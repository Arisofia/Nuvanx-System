name: Meta Canonical Credential Provision Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meta-canonical-credential-provision-once.yml'
      - 'scripts/meta-provision-canonical-credential-once.cjs'

permissions:
  contents: read

concurrency:
  group: meta-canonical-credential-provision-once
  cancel-in-progress: false

jobs:
  provision:
    name: Provision canonical per-user Meta credential
    if: github.repository == 'Arisofia/Nuvanx-System' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 12
    env:
      META_CANONICAL_ACCESS_TOKEN: ${{ secrets.META_CANONICAL_ACCESS_TOKEN }}
      META_CANONICAL_APP_SECRET: ${{ secrets.META_CANONICAL_APP_SECRET }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NUVANX_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NUVANX_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: https://ssvvuuysgxyqvmovrlvk.supabase.co
      TARGET_USER_ID: a2f2b8a1-fedb-4a74-891d-b8a2089fd49a
      TARGET_CLINIC_ID: 4207023b-eac1-4249-bf0f-d9b1e36a5d7a
      TARGET_INTEGRATION_ID: b3ee75f2-c926-4823-989b-fca551bbaa62
      CANONICAL_APP_ID: '1836302544001572'
      CANONICAL_BUSINESS_ID: '897835716596010'
      CANONICAL_AD_ACCOUNT_ID: act_718120894191565
      CANONICAL_PAGE_ID: '1329458703573874'
      CANONICAL_SYSTEM_USER_ID: '122098243371455164'
      CANONICAL_PIXEL_ID: '1037346649192028'
      META_ACCESS_AUDIT_REQUIRED_SOURCE: META_CANONICAL_ACCESS_TOKEN
      META_ACCESS_AUDIT_REQUIRE_CRITICAL: 'true'
      META_ACCESS_AUDIT_REQUIRE_APP_MATCH: 'true'
      META_ACCESS_AUDIT_REQUIRE_CRITICAL_ASSETS: 'true'

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse moved main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || {
            echo 'META_CREDENTIAL_PROVISION=FAIL reason=main_moved' >&2
            exit 1
          }
          echo "META_CREDENTIAL_SHA_GATE=PASS sha=$GITHUB_SHA"

      - name: Require secret inputs without exposing values
        shell: bash
        run: |
          set -euo pipefail
          test -n "${META_CANONICAL_ACCESS_TOKEN:-}"
          test -n "${META_CANONICAL_APP_SECRET:-}"
          test -n "${ENCRYPTION_KEY:-}"
          service_key="${SUPABASE_SERVICE_ROLE_KEY:-${NUVANX_SUPABASE_SERVICE_ROLE_KEY:-}}"
          test -n "$service_key"
          echo 'META_CREDENTIAL_SECRETS=PASS token=true app_secret=true encryption_key=true supabase_service_key=true'

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22

      - name: Validate canonical Meta identity and assets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/meta-access-audit.js
          node scripts/meta-system-user-audit.js
          echo 'META_CREDENTIAL_META_IDENTITY=PASS'

      - name: Provision encrypted canonical credential
        shell: bash
        run: node scripts/meta-provision-canonical-credential-once.cjs

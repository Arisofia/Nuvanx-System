# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: Manual Maintenance
run-name: Manual Maintenance · ${{ inputs.operation }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Explicit maintenance operation
        required: true
        type: choice
        options:
          - deploy_edge
          - prune_retired_edge
          - update_social_proof
      function:
        description: Edge Function selection when deploy_edge is chosen
        required: false
        default: all
        type: choice
        options:
          - all
          - web-events
          - google-click-attribution
          - google-data-manager-export
          - runtime-bootstrap
          - lead-captured
          - revops-dispatcher
          - web-lead-reconcile
          - deal-factory
          - meta-lead-backfill
          - meta-daily-insights
          - google-ads-health
          - meta-capi-dispatch
      confirmation:
        description: Type DEPLOY for Edge deployment, PRUNE for retired Edge cleanup, or UPDATE for WordPress mutation
        required: true
        type: string
      trusted_sha:
        description: Exact current main SHA required only for prune_retired_edge
        required: false
        default: ''
        type: string
      expected_doctoralia_count:
        description: Doctoralia count used only for update_social_proof
        required: false
        default: '98'
        type: string

permissions:
  contents: read

concurrency:
  group: manual-maintenance-${{ inputs.operation }}
  cancel-in-progress: false

jobs:
  deploy-edge:
    name: Manual · Attribution and RevOps Edge deploy
    if: ${{ inputs.operation == 'deploy_edge' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      DEPLOY_FUNCTION: ${{ inputs.function }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate explicit production authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = DEPLOY
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_PROJECT_REF:-}"
          [[ "${SUPABASE_PROJECT_REF:-}" =~ ^[a-z0-9]{20}$ ]]
          [[ "$DEPLOY_FUNCTION" =~ ^(all|web-events|google-click-attribution|google-data-manager-export|runtime-bootstrap|lead-captured|revops-dispatcher|web-lead-reconcile|deal-factory|meta-lead-backfill|meta-daily-insights|google-ads-health)$ ]]
          if [[ -z "${DATABASE_URL:-}" && -z "${SUPABASE_DB_PASSWORD:-}" ]]; then
            echo "::error::DATABASE_URL or SUPABASE_DB_PASSWORD is required"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x

      - name: Install workspace dependencies
        run: npm ci

      - name: Validate attribution and RevOps contracts
        run: >-
          npx vitest run
          supabase/functions/web-events/index.test.mjs
          supabase/functions/lead-captured/index.test.mjs
          supabase/functions/runtime-bootstrap/index.test.mjs
          supabase/functions/revops-dispatcher/index.test.mjs
          supabase/functions/web-lead-reconcile/index.test.mjs
          supabase/functions/deal-factory/index.test.mjs
          supabase/functions/google-data-manager-export/index.test.mjs
          supabase/functions/google-ads-health/index.test.mjs

      - name: Type-check governed Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          deno check --config=supabase/functions/deno.json \
            supabase/functions/web-events/index.ts \
            supabase/functions/google-click-attribution/index.ts \
            supabase/functions/google-data-manager-export/index.ts \
            supabase/functions/runtime-bootstrap/index.ts \
            supabase/functions/lead-captured/index.ts \
            supabase/functions/revops-dispatcher/index.ts \
            supabase/functions/web-lead-reconcile/index.ts \
            supabase/functions/deal-factory/index.ts \
            supabase/functions/google-ads-health/index.ts \
            supabase/functions/meta-lead-backfill/index.ts \
            supabase/functions/meta-daily-insights/index.ts

      - name: Apply canonical migrations
        uses: ./.github/actions/supabase-link-run
        with:
          project_ref: ${{ env.SUPABASE_PROJECT_REF }}
          supabase_access_token: ${{ env.SUPABASE_ACCESS_TOKEN }}
          database_url: ${{ env.DATABASE_URL }}
          supabase_db_password: ${{ env.SUPABASE_DB_PASSWORD }}
          skip_link: false
          command: |
            set -euo pipefail
            bash scripts/supabase-migrate.sh

      - name: Deploy selected Edge Function set
        uses: ./.github/actions/supabase-link-run
        with:
          project_ref: ${{ env.SUPABASE_PROJECT_REF }}
          supabase_access_token: ${{ env.SUPABASE_ACCESS_TOKEN }}
          database_url: ${{ env.DATABASE_URL }}
          supabase_db_password: ${{ env.SUPABASE_DB_PASSWORD }}
          skip_link: true
          command: |
            set -euo pipefail

            deploy_one() {
              case "$1" in
                web-events) supabase functions deploy web-events --project-ref "$SUPABASE_PROJECT_REF" ;;
                google-click-attribution) supabase functions deploy google-click-attribution --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt ;;
                google-data-manager-export) supabase functions deploy google-data-manager-export --project-ref "$SUPABASE_PROJECT_REF" ;;
                runtime-bootstrap) supabase functions deploy runtime-bootstrap --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt ;;
                lead-captured) supabase functions deploy lead-captured --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt ;;
                revops-dispatcher) supabase functions deploy revops-dispatcher --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt ;;
                web-lead-reconcile) supabase functions deploy web-lead-reconcile --project-ref "$SUPABASE_PROJECT_REF" ;;
                deal-factory) supabase functions deploy deal-factory --project-ref "$SUPABASE_PROJECT_REF" ;;
                meta-lead-backfill) supabase functions deploy meta-lead-backfill --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt ;;
                meta-daily-insights) supabase functions deploy meta-daily-insights --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt ;;
                google-ads-health) supabase functions deploy google-ads-health --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt ;;
                meta-capi-dispatch) supabase functions deploy meta-capi-dispatch --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt ;;
                *) echo "::error::Unsupported Edge Function: $1"; exit 1 ;;
              esac
            }

            if [[ "$DEPLOY_FUNCTION" == all ]]; then
              for function_name in \
                google-click-attribution \
                google-data-manager-export \
                runtime-bootstrap \
                lead-captured \
                revops-dispatcher \
                web-lead-reconcile \
                deal-factory \
                web-events \
                meta-capi-dispatch
              do
                deploy_one "$function_name"
              done
            else
              deploy_one "$DEPLOY_FUNCTION"
            fi

            supabase functions list --project-ref "$SUPABASE_PROJECT_REF"
            echo "EDGE_DEPLOY=PASS selection=$DEPLOY_FUNCTION"

  prune-retired-edge:
    name: Manual · Prune retired Edge Functions
    if: ${{ inputs.operation == 'prune_retired_edge' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: Production
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      CONFIRMATION: ${{ inputs.confirmation }}
      TRUSTED_SHA: ${{ inputs.trusted_sha }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate destructive maintenance authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = PRUNE
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_PROJECT_REF:-}"
          test -n "$TRUSTED_SHA"
          [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]
          test "$TRUSTED_SHA" = "$GITHUB_SHA"
          git fetch --no-tags origin main
          current_main="$(git rev-parse origin/main)"
          test "$current_main" = "$GITHUB_SHA"
          echo 'EDGE_PRUNE_SHA_GATE=PASS'

      - name: Setup Node.js for prune contract
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'

      - name: Validate retired Edge inventory contract
        run: node scripts/validate-retired-edge-inventory.mjs

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@52a446718e4edd1a9f1e2631186019c87e329f60
        with:
          version: 2.102.0

      - name: Delete proven retired Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          retired=(
            meta-credential-inventory-probe
            github-meta-probe-dispatch-once
            meta-legacy-credential-probe-once
            github-meta-stack-patch-once
            meta-runtime-secret-inventory-once
            github-runtime-token-presence-once
            github-master-deploy-dispatch-once
            github-master-deploy-status-once
            github-meta-runtime-reencrypt-dispatch-once
            meta-runtime-repair-config-probe-once
            github-master-ci-dispatch-once
            github-master-ci-status-once
            p0a-staging-submit
            integrations
            meta-asset-audit-temp
            meta-legacy-retire-temp
            google-gtm-audit-temp
            google-gtm-sa-audit-temp
            google-sa-shape-temp
            google-gtm-enable-temp
            meta-qa-suppression-proof-temp
          )

          function_is_present() {
            local function_name="$1"
            local inventory_json="$2"
            jq -e --arg slug "$function_name" \
              'any(.[]; ((.slug // .name // "") == $slug))' \
              <<< "$inventory_json" >/dev/null
          }

          before_json="$(supabase functions list \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --output json)"
          jq . <<< "$before_json"

          for function_name in "${retired[@]}"; do
            if function_is_present "$function_name" "$before_json"; then
              supabase functions delete "$function_name" \
                --project-ref "$SUPABASE_PROJECT_REF" \
                --yes
              echo "EDGE_PRUNE_DELETED=$function_name"
            else
              echo "EDGE_PRUNE_ALREADY_ABSENT=$function_name"
            fi
          done

          after_json="$(supabase functions list \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --output json)"
          jq . <<< "$after_json"
          for function_name in "${retired[@]}"; do
            if function_is_present "$function_name" "$after_json"; then
              echo "::error::Retired Edge Function still registered: $function_name"
              exit 1
            fi
          done
          echo "EDGE_PRUNE=PASS retired_count=${#retired[@]}"

  update-social-proof:
    name: Manual · Update WordPress social proof
    if: ${{ inputs.operation == 'update_social_proof' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CONFIRMATION: ${{ inputs.confirmation }}
      EXPECTED_DOCTORALIA_COUNT: ${{ inputs.expected_doctoralia_count }}
      OUT_DIR: tmp/social-proof-audit
      NUVANX_SSH_HOST: ${{ secrets.NUVANX_SSH_HOST }}
      NUVANX_SSH_PORT: ${{ secrets.NUVANX_SSH_PORT }}
      NUVANX_SSH_USER: ${{ secrets.NUVANX_SSH_USER }}
      NUVANX_SSH_KEY: ${{ secrets.NUVANX_SSH_KEY }}
      NUVANX_SSH_KNOWN_HOSTS: ${{ secrets.NUVANX_SSH_KNOWN_HOSTS }}
      NUVANX_WP_PATH: ${{ secrets.NUVANX_WP_PATH }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'

      - name: Validate explicit WordPress authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = UPDATE
          test -n "$EXPECTED_DOCTORALIA_COUNT"
          [[ "$EXPECTED_DOCTORALIA_COUNT" =~ ^[0-9]+$ ]]
          test -n "$NUVANX_SSH_HOST"
          test -n "$NUVANX_SSH_PORT"
          test -n "$NUVANX_SSH_USER"
          test -n "$NUVANX_SSH_KEY"
          test -n "$NUVANX_SSH_KNOWN_HOSTS"
          test -n "$NUVANX_WP_PATH"

      - name: Audit public NUVANX social proof before mutation
        run: node scripts/social-proof/nuvanx-social-proof-audit.mjs

      - name: SSH preflight — verify SiteGround reachability
        id: ssh_preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "$NUVANX_SSH_KEY" > ~/.ssh/nuvanx_key
          printf '%s\n' "$NUVANX_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/nuvanx_key ~/.ssh/known_hosts

          LOG_FILE="${RUNNER_TEMP}/ssh-preflight.log"
          printf '' > "$LOG_FILE"

          # Classify SSH exit code into an error category.
          # Returns: transport | auth | hostkey | remote_env | unknown
          classify_ssh_error() {
            local exit_code="$1"
            local stderr_snippet="$2"
            case "$exit_code" in
              255)
                if printf '%s' "$stderr_snippet" | grep -qi "REMOTE HOST IDENTIFICATION"; then
                  echo "hostkey"
                elif printf '%s' "$stderr_snippet" | grep -qi "Permission denied\|Authentication failed\|publickey"; then
                  echo "auth"
                else
                  echo "transport"
                fi
                ;;
              127|126)  echo "remote_env" ;;
              *)        echo "unknown" ;;
            esac
          }

          MAX_ATTEMPTS=5
          BACKOFF_SECONDS=5
          last_error=""
          last_category=""

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            printf '[preflight] attempt %d/%d\n' "$attempt" "$MAX_ATTEMPTS" | tee -a "$LOG_FILE"

            stderr_out="$(mktemp)"
            if ssh -i ~/.ssh/nuvanx_key \
                  -p "$NUVANX_SSH_PORT" \
                  -o StrictHostKeyChecking=yes \
                  -o UserKnownHostsFile=~/.ssh/known_hosts \
                  -o ConnectTimeout=15 \
                  -o BatchMode=yes \
                  "$NUVANX_SSH_USER@$NUVANX_SSH_HOST" \
                  "echo ssh-preflight-ok" 2>"$stderr_out"; then
              printf '[preflight] SUCCESS on attempt %d\n' "$attempt" | tee -a "$LOG_FILE"
              echo "SSH_PREFLIGHT=PASS" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            ssh_exit=$?
            last_error="$(cat "$stderr_out")"
            last_category="$(classify_ssh_error "$ssh_exit" "$last_error")"
            printf '[preflight] attempt %d FAILED (exit=%d category=%s): %s\n' \
              "$attempt" "$ssh_exit" "$last_category" "$last_error" | tee -a "$LOG_FILE"
            rm -f "$stderr_out"

            # Never retry identity failures — they will not self-heal.
            if [[ "$last_category" == "auth" || "$last_category" == "hostkey" ]]; then
              printf '[preflight] FATAL: %s error — fail-closed, no retry\n' \
                "$last_category" | tee -a "$LOG_FILE"
              echo "::error::SSH preflight failed: $last_category — $last_error"
              exit 1
            fi

            if [[ "$attempt" -lt "$MAX_ATTEMPTS" ]]; then
              sleep_secs=$(( BACKOFF_SECONDS * attempt ))
              printf '[preflight] retrying in %ds (transport/unknown)\n' "$sleep_secs" | tee -a "$LOG_FILE"
              sleep "$sleep_secs"
            fi
          done

          printf '[preflight] FAILED after %d attempts (category=%s)\n' \
            "$MAX_ATTEMPTS" "$last_category" | tee -a "$LOG_FILE"
          echo "::error::SSH preflight failed after $MAX_ATTEMPTS attempts ($last_category): $last_error"
          exit 1

      - name: Upload SSH preflight log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ssh-preflight-log
          path: ${{ runner.temp }}/ssh-preflight.log
          if-no-files-found: ignore

      - name: Update WordPress option and purge cache
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/nuvanx_key \
            -p "$NUVANX_SSH_PORT" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=15 \
            -o BatchMode=yes \
            "$NUVANX_SSH_USER@$NUVANX_SSH_HOST" \
            "set -e; cd '$NUVANX_WP_PATH' && /usr/local/bin/wp option update nvx_doctoralia_social_proof_count '$EXPECTED_DOCTORALIA_COUNT' && /usr/local/bin/wp cache flush && /usr/local/bin/wp sg purge"


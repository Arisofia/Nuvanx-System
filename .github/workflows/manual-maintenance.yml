# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: Manual Maintenance
run-name: >-
  Manual Maintenance · ${{ github.event_name == 'workflow_run' && 'master-release' || inputs.operation }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Explicit maintenance operation
        required: true
        type: choice
        options:
          - deploy_edge
          - update_social_proof
      function:
        description: Edge Function selection when deploy_edge is chosen
        required: false
        default: all
        type: choice
        options:
          - all
          - web-events
          - google-click-attribution
          - google-data-manager-export
          - runtime-bootstrap
          - lead-captured
          - revops-dispatcher
          - web-lead-reconcile
          - deal-factory
      confirmation:
        description: Type DEPLOY for Edge deployment or UPDATE for WordPress mutation
        required: true
        type: string
      expected_doctoralia_count:
        description: Doctoralia count used only for update_social_proof
        required: false
        default: '98'
        type: string
  workflow_call:
    inputs:
      operation:
        description: Explicit maintenance operation
        required: true
        type: string
      function:
        description: Edge Function selection when deploy_edge is chosen
        required: false
        default: all
        type: string
      confirmation:
        description: DEPLOY for Edge deployment or UPDATE for WordPress mutation
        required: true
        type: string
      expected_doctoralia_count:
        description: Doctoralia count used only for update_social_proof
        required: false
        default: '98'
        type: string
  workflow_run:
    workflows:
      - Master System
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: manual-maintenance-${{ github.event_name }}-${{ inputs.operation || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  deploy-edge:
    name: Manual · Attribution and RevOps Edge deploy
    if: >-
      ${{
        inputs.operation == 'deploy_edge' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          contains(github.event.workflow_run.head_commit.message, '[deploy-all]')
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      DEPLOY_FUNCTION: ${{ github.event_name == 'workflow_run' && 'all' || inputs.function }}
      CONFIRMATION: ${{ github.event_name == 'workflow_run' && 'DEPLOY' || inputs.confirmation }}
      NUVANX_SSH_HOST: ${{ secrets.NUVANX_SSH_HOST }}
      NUVANX_SSH_PORT: ${{ secrets.NUVANX_SSH_PORT }}
      NUVANX_SSH_USER: ${{ secrets.NUVANX_SSH_USER }}
      NUVANX_SSH_KEY: ${{ secrets.NUVANX_SSH_KEY }}
      NUVANX_WP_PATH: ${{ secrets.NUVANX_WP_PATH }}
      STAGING_WP_PATH: /home/customer/www/staging2.nuvanx.com/public_html
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate explicit production authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = DEPLOY
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_PROJECT_REF:-}"
          [[ "${SUPABASE_PROJECT_REF:-}" =~ ^[a-z0-9]{20}$ ]]
          [[ "$DEPLOY_FUNCTION" =~ ^(all|web-events|google-click-attribution|google-data-manager-export|runtime-bootstrap|lead-captured|revops-dispatcher|web-lead-reconcile|deal-factory)$ ]]
          if [ -z "${DATABASE_URL:-}" ] && [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error::DATABASE_URL or SUPABASE_DB_PASSWORD is required"
            exit 1
          fi

      - name: Install workspace dependencies
        run: npm ci

      - name: Validate attribution and RevOps contracts
        run: >-
          npx vitest run
          supabase/functions/web-events/index.test.mjs
          supabase/functions/lead-captured/index.test.mjs
          supabase/functions/runtime-bootstrap/index.test.mjs
          supabase/functions/revops-dispatcher/index.test.mjs
          supabase/functions/web-lead-reconcile/index.test.mjs
          supabase/functions/deal-factory/index.test.mjs
          supabase/functions/google-data-manager-export/index.test.mjs

      - name: Type-check governed Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          deno check --config=supabase/functions/deno.json \
            supabase/functions/web-events/index.ts \
            supabase/functions/google-click-attribution/index.ts \
            supabase/functions/google-data-manager-export/index.ts \
            supabase/functions/runtime-bootstrap/index.ts \
            supabase/functions/lead-captured/index.ts \
            supabase/functions/revops-dispatcher/index.ts \
            supabase/functions/web-lead-reconcile/index.ts \
            supabase/functions/deal-factory/index.ts

      - name: Rotate and synchronize first-party relay secrets
        if: ${{ env.DEPLOY_FUNCTION == 'all' || env.DEPLOY_FUNCTION == 'web-events' || env.DEPLOY_FUNCTION == 'lead-captured' }}
        shell: bash
        run: |
          set -euo pipefail
          for key in NUVANX_SSH_HOST NUVANX_SSH_PORT NUVANX_SSH_USER NUVANX_SSH_KEY NUVANX_WP_PATH; do
            value="${!key:-}"
            test -n "$value" || { echo "::error::$key is required for runtime secret synchronization"; exit 1; }
          done
          [[ "$NUVANX_SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$NUVANX_WP_PATH" == /home/customer/www/*/public_html ]]
          [[ "$STAGING_WP_PATH" == /home/customer/www/*/public_html ]]

          web_secret="$(openssl rand -hex 32)"
          lead_secret="$(openssl rand -hex 32)"
          test "${#web_secret}" -eq 64
          test "${#lead_secret}" -eq 64
          echo "::add-mask::$web_secret"
          echo "::add-mask::$lead_secret"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s' "$NUVANX_SSH_KEY" > "$HOME/.ssh/nuvanx_key"
          chmod 600 "$HOME/.ssh/nuvanx_key"
          printf '%s' "$web_secret" > "$RUNNER_TEMP/nvx-web-event-secret"
          printf '%s' "$lead_secret" > "$RUNNER_TEMP/nvx-lead-capture-secret"
          chmod 600 "$RUNNER_TEMP/nvx-web-event-secret" "$RUNNER_TEMP/nvx-lead-capture-secret"

          scp -q -i "$HOME/.ssh/nuvanx_key" -P "$NUVANX_SSH_PORT" -o StrictHostKeyChecking=no \
            "$RUNNER_TEMP/nvx-web-event-secret" "$RUNNER_TEMP/nvx-lead-capture-secret" \
            "$NUVANX_SSH_USER@$NUVANX_SSH_HOST:/tmp/"

          ssh -i "$HOME/.ssh/nuvanx_key" -p "$NUVANX_SSH_PORT" -o StrictHostKeyChecking=no \
            "$NUVANX_SSH_USER@$NUVANX_SSH_HOST" \
            "PROD_ROOT='$NUVANX_WP_PATH' STAGING_ROOT='$STAGING_WP_PATH' bash -se" <<'REMOTE'
          set -euo pipefail
          web_secret="$(cat /tmp/nvx-web-event-secret)"
          lead_secret="$(cat /tmp/nvx-lead-capture-secret)"
          test "${#web_secret}" -eq 64
          test "${#lead_secret}" -eq 64
          test -d "$PROD_ROOT"
          test -d "$STAGING_ROOT"
          test "$(cd "$PROD_ROOT" && /usr/local/bin/wp option get home)" = 'https://nuvanx.com'
          test "$(cd "$STAGING_ROOT" && /usr/local/bin/wp option get home)" = 'https://staging2.nuvanx.com'
          cd "$PROD_ROOT"
          /usr/local/bin/wp config set NUVANX_WEB_EVENT_SECRET "$web_secret" --quiet
          /usr/local/bin/wp config set NUVANX_LEAD_CAPTURE_SECRET "$lead_secret" --quiet
          cd "$STAGING_ROOT"
          /usr/local/bin/wp config set NUVANX_WEB_EVENT_SECRET "$web_secret" --quiet
          /usr/local/bin/wp config set NUVANX_LEAD_CAPTURE_SECRET "$lead_secret" --quiet
          rm -f /tmp/nvx-web-event-secret /tmp/nvx-lead-capture-secret
          REMOTE

          {
            echo "NUVANX_WEB_EVENT_SECRET=$web_secret"
            echo "NUVANX_LEAD_CAPTURE_SECRET=$lead_secret"
          } >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/nvx-web-event-secret" "$RUNNER_TEMP/nvx-lead-capture-secret" "$HOME/.ssh/nuvanx_key"
          echo 'RUNTIME_SECRET_SYNC=PASS stores=wordpress-production,wordpress-staging2,supabase-pending'

      - name: Synchronize relay secrets to Supabase
        if: ${{ env.DEPLOY_FUNCTION == 'all' || env.DEPLOY_FUNCTION == 'web-events' || env.DEPLOY_FUNCTION == 'lead-captured' }}
        uses: ./.github/actions/supabase-link-run
        with:
          project_ref: ${{ env.SUPABASE_PROJECT_REF }}
          supabase_access_token: ${{ env.SUPABASE_ACCESS_TOKEN }}
          database_url: ${{ env.DATABASE_URL }}
          supabase_db_password: ${{ env.SUPABASE_DB_PASSWORD }}
          skip_link: true
          command: |
            set -euo pipefail
            test -n "${NUVANX_WEB_EVENT_SECRET:-}"
            test -n "${NUVANX_LEAD_CAPTURE_SECRET:-}"
            supabase secrets set \
              NUVANX_WEB_EVENT_SECRET="$NUVANX_WEB_EVENT_SECRET" \
              NUVANX_LEAD_CAPTURE_SECRET="$NUVANX_LEAD_CAPTURE_SECRET" \
              --project-ref "$SUPABASE_PROJECT_REF"

      - name: Preflight web-events secret
        if: ${{ env.DEPLOY_FUNCTION == 'all' || env.DEPLOY_FUNCTION == 'web-events' }}
        uses: ./.github/actions/supabase-link-run
        with:
          project_ref: ${{ env.SUPABASE_PROJECT_REF }}
          supabase_access_token: ${{ env.SUPABASE_ACCESS_TOKEN }}
          database_url: ${{ env.DATABASE_URL }}
          supabase_db_password: ${{ env.SUPABASE_DB_PASSWORD }}
          skip_link: true
          command: |
            set -euo pipefail
            secrets="$(supabase secrets list --project-ref "$SUPABASE_PROJECT_REF")"
            secret_names="$(
              printf '%s\n' "$secrets" \
                | tr '│|' '  ' \
                | awk '{ for (i = 1; i <= NF; i += 1) if ($i ~ /^[A-Z][A-Z0-9_]+$/) { print $i; break } }' \
                | sort -u
            )"
            grep -Fxq NUVANX_WEB_EVENT_SECRET <<<"$secret_names"
            grep -Fxq NUVANX_LEAD_CAPTURE_SECRET <<<"$secret_names"

      - name: Apply canonical migrations
        uses: ./.github/actions/supabase-link-run
        with:
          project_ref: ${{ env.SUPABASE_PROJECT_REF }}
          supabase_access_token: ${{ env.SUPABASE_ACCESS_TOKEN }}
          database_url: ${{ env.DATABASE_URL }}
          supabase_db_password: ${{ env.SUPABASE_DB_PASSWORD }}
          skip_link: false
          command: |
            set -euo pipefail
            bash scripts/supabase-migrate.sh

      - name: Deploy selected Edge Function set
        uses: ./.github/actions/supabase-link-run
        with:
          project_ref: ${{ env.SUPABASE_PROJECT_REF }}
          supabase_access_token: ${{ env.SUPABASE_ACCESS_TOKEN }}
          database_url: ${{ env.DATABASE_URL }}
          supabase_db_password: ${{ env.SUPABASE_DB_PASSWORD }}
          skip_link: true
          command: |
            set -euo pipefail

            deploy_one() {
              case "$1" in
                web-events)
                  supabase functions deploy web-events --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
                  ;;
                google-click-attribution)
                  supabase functions deploy google-click-attribution --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
                  ;;
                google-data-manager-export)
                  supabase functions deploy google-data-manager-export --project-ref "$SUPABASE_PROJECT_REF"
                  ;;
                runtime-bootstrap)
                  supabase functions deploy runtime-bootstrap --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
                  ;;
                lead-captured)
                  supabase functions deploy lead-captured --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
                  ;;
                revops-dispatcher)
                  supabase functions deploy revops-dispatcher --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
                  ;;
                web-lead-reconcile)
                  supabase functions deploy web-lead-reconcile --project-ref "$SUPABASE_PROJECT_REF"
                  ;;
                deal-factory)
                  supabase functions deploy deal-factory --project-ref "$SUPABASE_PROJECT_REF"
                  ;;
                *)
                  echo "::error::Unsupported Edge Function: $1"
                  exit 1
                  ;;
              esac
            }

            if [ "$DEPLOY_FUNCTION" = all ]; then
              for function_name in \
                google-click-attribution \
                google-data-manager-export \
                runtime-bootstrap \
                lead-captured \
                revops-dispatcher \
                web-lead-reconcile \
                deal-factory \
                web-events
              do
                deploy_one "$function_name"
              done
            else
              deploy_one "$DEPLOY_FUNCTION"
            fi

            supabase functions list --project-ref "$SUPABASE_PROJECT_REF"

  update-social-proof:
    name: Manual · Update WordPress social proof
    if: ${{ inputs.operation == 'update_social_proof' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CONFIRMATION: ${{ inputs.confirmation }}
      EXPECTED_DOCTORALIA_COUNT: ${{ inputs.expected_doctoralia_count }}
      OUT_DIR: tmp/social-proof-audit
      NUVANX_SSH_HOST: ${{ secrets.NUVANX_SSH_HOST }}
      NUVANX_SSH_PORT: ${{ secrets.NUVANX_SSH_PORT }}
      NUVANX_SSH_USER: ${{ secrets.NUVANX_SSH_USER }}
      NUVANX_SSH_KEY: ${{ secrets.NUVANX_SSH_KEY }}
      NUVANX_WP_PATH: ${{ secrets.NUVANX_WP_PATH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Validate explicit WordPress authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = UPDATE
          test -n "$EXPECTED_DOCTORALIA_COUNT"
          [[ "$EXPECTED_DOCTORALIA_COUNT" =~ ^[0-9]+$ ]]
          test -n "$NUVANX_SSH_HOST"
          test -n "$NUVANX_SSH_PORT"
          test -n "$NUVANX_SSH_USER"
          test -n "$NUVANX_SSH_KEY"
          test -n "$NUVANX_WP_PATH"

      - name: Audit public NUVANX social proof before mutation
        run: node scripts/social-proof/nuvanx-social-proof-audit.mjs

      - name: Update WordPress option and purge cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "$NUVANX_SSH_KEY" > ~/.ssh/nuvanx_key
          chmod 600 ~/.ssh/nuvanx_key
          ssh -i ~/.ssh/nuvanx_key \
            -p "$NUVANX_SSH_PORT" \
            -o StrictHostKeyChecking=no \
            "$NUVANX_SSH_USER@$NUVANX_SSH_HOST" \
            "set -e; cd '$NUVANX_WP_PATH' && /usr/local/bin/wp option update nvx_doctoralia_social_proof_count '$EXPECTED_DOCTORALIA_COUNT' && /usr/local/bin/wp cache flush && /usr/local/bin/wp sg purge"

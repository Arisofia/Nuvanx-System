# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: Meta Leadgen Repair Once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  repair-leadgen:
    name: Repair · canonical Meta leadgen delivery
    if: ${{ github.head_ref == 'diagnostic/meta-leadgen-subscription-20260820' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restore app and Page leadgen subscriptions
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_VERIFY_TOKEN: ${{ secrets.META_VERIFY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = await import('node:crypto');

          const graphVersion = 'v22.0';
          const systemUserId = '61569256954284';
          const pageId = '685010274687129';
          const callbackUrl = 'https://ssvvuuysgxyqvmovrlvk.supabase.co/functions/v1/api/webhooks/meta';
          const systemUserToken = String(process.env.META_ACCESS_TOKEN || '').trim();
          const appId = String(process.env.META_APP_ID || '').trim();
          const appSecret = String(process.env.META_APP_SECRET || '').trim();
          const verifyToken = String(process.env.META_VERIFY_TOKEN || '').trim();

          if (!systemUserToken || !appId || !appSecret || !verifyToken) {
            console.error('META_LEADGEN_REPAIR_STATUS=ABORT_MISSING_REQUIRED_SECRET');
            process.exit(2);
          }

          const proof = (token) => crypto.createHmac('sha256', appSecret).update(token).digest('hex');

          async function graphJson(url, options = {}) {
            const response = await fetch(url, {
              ...options,
              headers: {
                Accept: 'application/json',
                ...(options.headers || {}),
              },
              signal: AbortSignal.timeout(20000),
            });
            const text = await response.text();
            let payload = null;
            try { payload = JSON.parse(text); } catch {}
            if (!response.ok || payload?.error) {
              const error = payload?.error || {};
              const safeMessage = String(error.message || text || `HTTP ${response.status}`)
                .replace(/[A-Za-z0-9_-]{32,}/g, '[masked]');
              const err = new Error(safeMessage);
              err.status = response.status;
              err.code = error.code ?? null;
              throw err;
            }
            return payload ?? {};
          }

          async function resolvePageToken() {
            const url = new URL(`https://graph.facebook.com/${graphVersion}/${systemUserId}/accounts`);
            url.searchParams.set('fields', 'id,name,access_token');
            url.searchParams.set('access_token', systemUserToken);
            url.searchParams.set('appsecret_proof', proof(systemUserToken));
            const payload = await graphJson(url, { method: 'GET' });
            const page = (Array.isArray(payload.data) ? payload.data : [])
              .find((item) => String(item?.id || '') === pageId);
            const token = String(page?.access_token || '').trim();
            if (!token) throw new Error('Target Page access token was not resolved.');
            return token;
          }

          async function verifyCallbackChallenge() {
            const challenge = `nvx_meta_repair_${Date.now()}`;
            const url = new URL(callbackUrl);
            url.searchParams.set('hub.mode', 'subscribe');
            url.searchParams.set('hub.challenge', challenge);
            url.searchParams.set('hub.verify_token', verifyToken);
            const response = await fetch(url, { method: 'GET', signal: AbortSignal.timeout(20000) });
            const text = await response.text();
            if (response.status !== 200 || text !== challenge) {
              throw new Error(`Callback verify-token preflight failed with HTTP ${response.status}.`);
            }
            console.log('META_CALLBACK_VERIFY_TOKEN_PREFLIGHT=PASS');
          }

          async function getAppSubscriptions() {
            const appAccessToken = `${appId}|${appSecret}`;
            const url = new URL(`https://graph.facebook.com/${graphVersion}/${encodeURIComponent(appId)}/subscriptions`);
            url.searchParams.set('access_token', appAccessToken);
            const payload = await graphJson(url, { method: 'GET' });
            return Array.isArray(payload.data) ? payload.data : [];
          }

          function appLeadgenHealthy(subscriptions) {
            return subscriptions.some((subscription) => {
              const fields = Array.isArray(subscription?.fields)
                ? subscription.fields.map((field) => typeof field === 'string' ? field : String(field?.name || ''))
                : [];
              return subscription?.object === 'page'
                && subscription?.active !== false
                && String(subscription?.callback_url || '') === callbackUrl
                && fields.includes('leadgen');
            });
          }

          async function repairAppSubscription() {
            const appAccessToken = `${appId}|${appSecret}`;
            const url = new URL(`https://graph.facebook.com/${graphVersion}/${encodeURIComponent(appId)}/subscriptions`);
            url.searchParams.set('access_token', appAccessToken);
            const body = new URLSearchParams({
              object: 'page',
              callback_url: callbackUrl,
              fields: 'leadgen',
              include_values: 'true',
              verify_token: verifyToken,
            });
            const payload = await graphJson(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body,
            });
            console.log(`META_APP_LEADGEN_REPAIR_RESPONSE=${payload.success === true ? 'SUCCESS' : 'ACCEPTED'}`);
          }

          async function getPageSubscriptions(pageToken) {
            const url = new URL(`https://graph.facebook.com/${graphVersion}/${pageId}/subscribed_apps`);
            url.searchParams.set('fields', 'id,name,subscribed_fields');
            url.searchParams.set('access_token', pageToken);
            url.searchParams.set('appsecret_proof', proof(pageToken));
            const payload = await graphJson(url, { method: 'GET' });
            return Array.isArray(payload.data) ? payload.data : [];
          }

          function pageLeadgenHealthy(apps) {
            return apps.some((app) => String(app?.id || '') === appId
              && Array.isArray(app?.subscribed_fields)
              && app.subscribed_fields.includes('leadgen'));
          }

          async function repairPageSubscription(pageToken) {
            const url = new URL(`https://graph.facebook.com/${graphVersion}/${pageId}/subscribed_apps`);
            url.searchParams.set('subscribed_fields', 'leadgen');
            url.searchParams.set('access_token', pageToken);
            url.searchParams.set('appsecret_proof', proof(pageToken));
            const payload = await graphJson(url, { method: 'POST' });
            console.log(`META_PAGE_LEADGEN_REPAIR_RESPONSE=${payload.success === true ? 'SUCCESS' : 'ACCEPTED'}`);
          }

          try {
            await verifyCallbackChallenge();
            const pageToken = await resolvePageToken();
            console.log('META_PAGE_ACCESS_TOKEN_RESOLVED=true');

            const beforeApp = await getAppSubscriptions();
            const beforePage = await getPageSubscriptions(pageToken);
            console.log(`META_REPAIR_BEFORE_APP_LEADGEN=${appLeadgenHealthy(beforeApp)}`);
            console.log(`META_REPAIR_BEFORE_PAGE_LEADGEN=${pageLeadgenHealthy(beforePage)}`);

            if (!appLeadgenHealthy(beforeApp)) {
              await repairAppSubscription();
            } else {
              console.log('META_APP_LEADGEN_REPAIR=NOOP_ALREADY_HEALTHY');
            }

            if (!pageLeadgenHealthy(beforePage)) {
              await repairPageSubscription(pageToken);
            } else {
              console.log('META_PAGE_LEADGEN_REPAIR=NOOP_ALREADY_HEALTHY');
            }

            const afterApp = await getAppSubscriptions();
            const afterPage = await getPageSubscriptions(pageToken);
            const appOk = appLeadgenHealthy(afterApp);
            const pageOk = pageLeadgenHealthy(afterPage);
            console.log(`META_REPAIR_AFTER_APP_LEADGEN=${appOk}`);
            console.log(`META_REPAIR_AFTER_PAGE_LEADGEN=${pageOk}`);
            console.log(`META_REPAIR_AFTER_PAGE_SUBSCRIBED_APPS_COUNT=${afterPage.length}`);

            if (!appOk || !pageOk) {
              console.error('META_LEADGEN_REPAIR_STATUS=FAILED_POST_ACCEPTANCE');
              process.exit(10);
            }
            console.log('META_LEADGEN_REPAIR_STATUS=SUCCESS');
          } catch (error) {
            console.error(`META_LEADGEN_REPAIR_STATUS=ABORTED code=${error?.code ?? 'unknown'} status=${error?.status ?? 'unknown'}`);
            console.error(`META_LEADGEN_REPAIR_ERROR=${String(error?.message || error).replace(/[A-Za-z0-9_-]{32,}/g, '[masked]')}`);
            process.exit(11);
          }
          NODE

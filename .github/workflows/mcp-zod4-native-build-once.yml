name: MCP Zod 4 Native Build Once

on:
  push:
    branches:
      - refactor/mcp-zod4-native-schema-20260825
    paths:
      - '.github/workflows/mcp-zod4-native-build-once.yml'

permissions:
  contents: write

jobs:
  migrate-validate:
    if: github.actor == 'Arisofia'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x
      - name: Apply MCP migration
        run: python3 .github/scripts/mcp-zod4-native-build.py
      - name: Regenerate parent and function lockfiles
        run: |
          cd supabase/functions
          rm -f deno.lock
          deno cache --config deno.json --reload mcp/index.ts
          cd mcp
          rm -f deno.lock
          deno cache --config deno.json --reload index.ts
      - name: Reject legacy dependency residue
        run: |
          if git grep -n 'zod-to-json-schema' -- supabase/functions ':!supabase/functions/mcp/zod4-native-schema-contract.test.mjs'; then
            echo 'Deprecated zod-to-json-schema dependency remains' >&2
            exit 1
          fi
          if git grep -n 'ZodTypeAny\|convertZodSchema' -- supabase/functions/mcp/index.ts; then
            echo 'Legacy adapter code remains' >&2
            exit 1
          fi
      - name: Validate full affected surface
        run: |
          npm ci --ignore-scripts
          npm test
          npm run validate:edge-deno
          npm run validate:workflows
          npm run secrets:scan
          deno check --config supabase/functions/mcp/deno.json supabase/functions/mcp/index.ts
          git diff --check
      - name: Commit permanent migration only
        run: |
          git config user.name 'Nuvanx Engineering'
          git config user.email 'admin@nuvanx.com'
          git add supabase/functions/deno.json supabase/functions/deno.lock supabase/functions/mcp/deno.json supabase/functions/mcp/deno.lock supabase/functions/mcp/index.ts supabase/functions/mcp/zod4-native-schema-contract.test.mjs
          git diff --cached --check
          git commit -m 'refactor(mcp): use native Zod 4 JSON schema'
          git push origin HEAD:refactor/mcp-zod4-native-schema-20260825

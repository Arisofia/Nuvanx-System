# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: Cloudflare Frontend Acceptance
run-name: Cloudflare acceptance · ${{ github.ref_name }} · ${{ inputs.approved_sha || github.sha }}

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: 'Optional exact approved Git commit SHA to checkout and deploy'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy · Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.approved_sha || github.sha }}
          persist-credentials: false

      - name: Verify exact approved SHA
        if: ${{ inputs.approved_sha != '' }}
        shell: bash
        run: |
          set -euo pipefail
          deployed_sha="$(git rev-parse HEAD)"
          expected_sha="${{ inputs.approved_sha }}"
          if [ "$deployed_sha" != "$expected_sha" ]; then
            echo "::error::Deployed SHA ($deployed_sha) does not match expected approved SHA ($expected_sha)" >&2
            exit 1
          fi
          echo "Verified exact approved commit: $deployed_sha"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Require Cloudflare deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing GitHub Secret: CLOUDFLARE_API_TOKEN' >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing GitHub Secret: CLOUDFLARE_ACCOUNT_ID' >&2; exit 1; }

      - name: Install frontend dependencies
        run: npm install --include=dev --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci

      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      - name: Verify deploy artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/_headers
          grep -F "X-Frame-Options: DENY" dist/_headers >/dev/null
          grep -F "Content-Security-Policy:" dist/_headers >/dev/null

      - name: Deploy Cloudflare Workers Static Assets
        shell: bash
        run: npm exec --yes --package=wrangler@4.127.1 -- wrangler deploy --config wrangler.jsonc

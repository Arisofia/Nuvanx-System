name: Meta Backfill

run-name: Meta Backfill · ${{ inputs.days }} días

on:
  workflow_dispatch:
    inputs:
      days:
        description: Días reales de Meta Ads a persistir (1–90)
        required: true
        default: '90'
        type: string

permissions:
  contents: read

jobs:
  backfill-meta-only:
    name: Backfill · Meta Ads y activos Meta
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # La URL de proyecto no es un secreto; se declara aquí para no depender de un secret ausente.
      SUPABASE_URL: https://ssvvuuysgxyqvmovrlvk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NUVANX_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NUVANX_SUPABASE_SERVICE_ROLE_KEY }}
      REPORT_USER_ID: ${{ secrets.REPORT_USER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Validate requested range
        shell: bash
        env:
          DAYS: ${{ inputs.days }}
        run: |
          set -euo pipefail
          [[ "$DAYS" =~ ^[0-9]+$ ]]
          (( DAYS >= 1 && DAYS <= 90 ))

      - name: Persist real Meta data only
        shell: bash
        env:
          DAYS: ${{ inputs.days }}
        run: |
          set -euo pipefail
          # Conserva el contrato del script sin revelar la clave; usa el secreto NUVANX ya disponible como respaldo.
          export SUPABASE_SERVICE_ROLE_KEY="${SUPABASE_SERVICE_ROLE_KEY:-${NUVANX_SUPABASE_SERVICE_ROLE_KEY:-}}"
          node scripts/run-meta-backfill.js --days="$DAYS" --attempts=3

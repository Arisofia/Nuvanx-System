name: Meta Backfill

run-name: Meta Backfill · ${{ github.event_name == 'push' && '90' || inputs.days || '7' }} días · ${{ github.event_name }}

on:
  workflow_dispatch:
    inputs:
      days:
        description: Días reales de Meta Ads y activos sociales a persistir (1–90)
        required: true
        default: '90'
        type: string
  schedule:
    # Daily after the canonical 07:00 UTC Doctoralia/paid-data sync window.
    - cron: '20 7 * * *'
  push:
    branches:
      - main
    paths:
      # Run one 90-day recovery immediately when this automation itself changes.
      - '.github/workflows/meta-backfill.yml'

permissions:
  contents: read

jobs:
  backfill-meta-only:
    name: Backfill · Meta Ads y activos Meta
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Production
    env:
      # Project URL is public configuration. Credentials remain GitHub Production secrets.
      SUPABASE_URL: https://ssvvuuysgxyqvmovrlvk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NUVANX_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NUVANX_SUPABASE_SERVICE_ROLE_KEY }}
      REPORT_USER_ID: ${{ secrets.REPORT_USER_ID }}
      BACKFILL_DAYS: ${{ github.event_name == 'push' && '90' || inputs.days || '7' }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'

      - name: Validate requested range
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BACKFILL_DAYS" =~ ^[0-9]+$ ]]
          (( BACKFILL_DAYS >= 1 && BACKFILL_DAYS <= 90 ))
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-${NUVANX_SUPABASE_SERVICE_ROLE_KEY:-}}"
          test -n "${REPORT_USER_ID:-}"

      - name: Persist real Meta data only
        shell: bash
        run: |
          set -euo pipefail
          export SUPABASE_SERVICE_ROLE_KEY="${SUPABASE_SERVICE_ROLE_KEY:-${NUVANX_SUPABASE_SERVICE_ROLE_KEY:-}}"
          node scripts/run-meta-backfill.js --days="$BACKFILL_DAYS" --attempts=3

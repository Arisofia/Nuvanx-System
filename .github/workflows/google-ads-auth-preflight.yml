name: Google Ads Auth Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-ads-auth-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: Read-only provider auth proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: Production
    env:
      GOOGLE_ADS_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_ADS_SERVICE_ACCOUNT }}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
      GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
      GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Revalidate exact main before provider reads
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          LOCAL_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git rev-parse origin/main)"
          if [[ "$LOCAL_SHA" != "$REMOTE_SHA" ]]; then
            echo "main advanced during checkout; refusing stale diagnostic"
            exit 1
          fi
          echo "GOOGLE_ADS_AUTH_PREFLIGHT_SHA=$LOCAL_SHA"

      - name: Validate required non-provider configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_ADS_DEVELOPER_TOKEN:-}"
          if [[ -z "${GOOGLE_ADS_SERVICE_ACCOUNT:-}" && -z "${GOOGLE_ADS_CLIENT_ID:-}" && -z "${GOOGLE_ADS_CLIENT_SECRET:-}" && -z "${GOOGLE_ADS_REFRESH_TOKEN:-}" ]]; then
            echo "No Google Ads OAuth mode is configured in the Production environment."
            exit 1
          fi

      - name: Run secretless regression tests
        run: node --test scripts/google-ads-auth-preflight.test.js scripts/sync-google-ads-service-account.test.js

      - name: Probe Google Ads authentication read-only
        run: node scripts/google-ads-auth-preflight.js

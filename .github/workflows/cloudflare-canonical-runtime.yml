name: Cloudflare Canonical Runtime

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'supabase/functions/**'
      - '.github/workflows/cloudflare-canonical-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'supabase/functions/**'
      - '.github/workflows/cloudflare-canonical-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-canonical-runtime-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  acceptance:
    name: Cloudflare + Supabase authenticated acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRODUCTION_E2E_URL: https://app.nuvanx.com
      ROLLBACK_E2E_URL: https://nuvanx-frontend.jenineferderas.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Prove Cloudflare zone ownership
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN missing' >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID missing' >&2; exit 1; }
          curl --fail-with-body --silent --show-error --get \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --data-urlencode 'name=nuvanx.com' \
            --data-urlencode "account.id=${CLOUDFLARE_ACCOUNT_ID}" \
            'https://api.cloudflare.com/client/v4/zones' \
            > /tmp/cloudflare-zones.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/cloudflare-zones.json').read_text())
          if not payload.get('success'):
              print('CLOUDFLARE_ZONE_API=FAIL')
              for error in payload.get('errors', []):
                  print(f"Cloudflare API error: {error.get('code')} {error.get('message')}")
              raise SystemExit(1)
          matches = [z for z in payload.get('result', []) if z.get('name') == 'nuvanx.com']
          print(f'CLOUDFLARE_ZONE_MATCHES={len(matches)}')
          for zone in matches:
              print('CLOUDFLARE_ZONE=' + '|'.join([
                  str(zone.get('name', '')),
                  str(zone.get('status', '')),
                  str(zone.get('type', '')),
              ]))
          if len(matches) != 1:
              raise SystemExit('nuvanx.com is not visible exactly once in the configured Cloudflare account')
          if matches[0].get('status') != 'active':
              raise SystemExit('nuvanx.com is visible but not active in Cloudflare')
          print('CLOUDFLARE_ZONE_OWNERSHIP=PASS')
          PY

      - name: Prove Cloudflare custom-domain binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains?hostname=app.nuvanx.com" \
            > /tmp/cloudflare-worker-domains.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/cloudflare-worker-domains.json').read_text())
          if not payload.get('success'):
              print('CLOUDFLARE_DOMAIN_API=FAIL')
              for error in payload.get('errors', []):
                  print(f"Cloudflare API error: {error.get('code')} {error.get('message')}")
              raise SystemExit(1)
          matches = [item for item in payload.get('result', []) if item.get('hostname') == 'app.nuvanx.com']
          print(f'CLOUDFLARE_CUSTOM_DOMAIN_MATCHES={len(matches)}')
          for item in matches:
              print('CLOUDFLARE_CUSTOM_DOMAIN=' + '|'.join([
                  str(item.get('hostname', '')),
                  str(item.get('service', '')),
                  str(item.get('zone_name', '')),
              ]))
          if len(matches) != 1:
              raise SystemExit('app.nuvanx.com is not attached exactly once as a Worker custom domain')
          if matches[0].get('service') != 'nuvanx-frontend':
              raise SystemExit('app.nuvanx.com is attached to the wrong Worker service')
          print('CLOUDFLARE_CUSTOM_DOMAIN_BINDING=PASS')
          PY

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --include=dev --ignore-scripts

      - name: Install Chromium
        working-directory: frontend
        run: npm exec playwright install --with-deps chromium

      - name: Verify Cloudflare custom-domain public runtime
        shell: bash
        run: |
          set -euo pipefail
          for route in / /login /dashboard /__canonical_runtime_probe__; do
            headers="/tmp/cf-headers-${route//\//_}"
            body="/tmp/cf-body-${route//\//_}"
            code="$(curl --silent --show-error --dump-header "$headers" --output "$body" --write-out '%{http_code}' "${PRODUCTION_E2E_URL}${route}")"
            if [ "$code" != '200' ]; then
              echo "${route} returned HTTP ${code}" >&2
              echo '--- response headers ---' >&2
              sed -n '1,40p' "$headers" >&2
              echo '--- response body preview ---' >&2
              head -c 1200 "$body" >&2 || true
              echo >&2
              exit 1
            fi
            grep -q 'id="root"' "$body" || { echo "${route} is not the SPA shell" >&2; exit 1; }
          done
          root_headers='/tmp/cf-headers-_'
          grep -qi '^server: cloudflare' "$root_headers" || { echo 'Custom domain is not being served through Cloudflare' >&2; exit 1; }
          grep -qi '^cf-ray:' "$root_headers" || { echo 'Missing Cloudflare request trace header' >&2; exit 1; }
          grep -qi '^x-frame-options: DENY' "$root_headers" || { echo 'Missing X-Frame-Options: DENY' >&2; exit 1; }
          grep -qi '^x-content-type-options: nosniff' "$root_headers" || { echo 'Missing X-Content-Type-Options: nosniff' >&2; exit 1; }
          grep -qi '^referrer-policy: strict-origin-when-cross-origin' "$root_headers" || { echo 'Missing Referrer-Policy' >&2; exit 1; }
          grep -qi '^permissions-policy:' "$root_headers" || { echo 'Missing Permissions-Policy' >&2; exit 1; }
          grep -qi '^content-security-policy:' "$root_headers" || { echo 'Missing Content-Security-Policy' >&2; exit 1; }
          echo 'CLOUDFLARE_CUSTOM_DOMAIN_PUBLIC_RUNTIME=PASS'

      - name: Verify workers.dev rollback origin
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/cf-rollback-body --write-out '%{http_code}' "${ROLLBACK_E2E_URL}/")"
          test "$code" = '200' || { echo "Rollback origin returned HTTP ${code}" >&2; exit 1; }
          grep -q 'id="root"' /tmp/cf-rollback-body || { echo 'Rollback origin is not the SPA shell' >&2; exit 1; }
          echo 'CLOUDFLARE_WORKERS_DEV_ROLLBACK=PASS'

      - name: Write strict Supabase runtime test
        working-directory: frontend
        shell: bash
        run: |
          cat > tests/cloudflare-canonical-runtime.playwright.ts <<'EOF'
          import { test, expect } from '@playwright/test';
          test('canonical Cloudflare runtime has healthy Supabase session and APIs', async ({ page }) => {
            test.setTimeout(75_000);
            const email = process.env.E2E_EMAIL?.trim();
            const password = process.env.E2E_PASSWORD?.trim();
            if (!email || !password) throw new Error('E2E credentials missing');
            const pageErrors: string[] = [];
            const networkFailures: string[] = [];
            const httpErrors: string[] = [];
            const policyErrors: string[] = [];
            const fallbackWarnings: string[] = [];
            const isSupabase = (url: string) => url.includes('ssvvuuysgxyqvmovrlvk.supabase.co');
            page.on('pageerror', error => pageErrors.push(error.message));
            page.on('requestfailed', request => {
              if (!isSupabase(request.url())) return;
              const reason = request.failure()?.errorText || 'unknown';
              if (!reason.includes('ERR_ABORTED')) networkFailures.push(`${reason} ${request.url()}`);
            });
            page.on('response', response => {
              if (isSupabase(response.url()) && response.status() >= 400) httpErrors.push(`${response.status()} ${response.url()}`);
            });
            page.on('console', msg => {
              const text = msg.text();
              if (/cors|content security policy|blocked by client/i.test(text)) policyErrors.push(text);
              if (/canonical crm load failed|legacy lead metadata unavailable/i.test(text)) fallbackWarnings.push(text);
            });
            await page.goto('/login', { waitUntil: 'domcontentloaded' });
            await page.locator('#login-email').fill(email);
            await page.locator('#login-password').fill(password);
            await page.getByRole('button', { name: /entrar/i }).click();
            await expect(page).toHaveURL(/\/dashboard\/?$/, { timeout: 15_000 });
            await expect(page.getByTestId('control-centre-overview')).toBeVisible({ timeout: 15_000 });
            await page.waitForTimeout(10_000);
            await page.reload({ waitUntil: 'domcontentloaded' });
            await expect(page).toHaveURL(/\/dashboard\/?$/, { timeout: 15_000 });
            await expect(page.getByTestId('control-centre-overview')).toBeVisible({ timeout: 15_000 });
            await page.waitForTimeout(6_000);
            expect(pageErrors).toEqual([]);
            expect(networkFailures).toEqual([]);
            expect(httpErrors).toEqual([]);
            expect(policyErrors).toEqual([]);
            expect(fallbackWarnings).toEqual([]);
          });
          EOF

      - name: Run canonical authenticated acceptance
        working-directory: frontend
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          PRODUCTION_E2E_URL: https://app.nuvanx.com
          PLAYWRIGHT_REQUIRE_BROWSERS: 'true'
        run: |
          set -euo pipefail
          test -n "$E2E_EMAIL"
          test -n "$E2E_PASSWORD"
          npm exec playwright test tests/cloudflare-canonical-runtime.playwright.ts --project=chromium
          echo 'CLOUDFLARE_CANONICAL_RUNTIME=PASS'

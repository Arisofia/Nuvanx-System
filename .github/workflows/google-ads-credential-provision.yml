name: Google Ads Credential Provision

on:
  push:
    branches: [main]
    paths:
      - 'scripts/provision-google-ads-developer-token.js'
      - 'scripts/provision-google-ads-developer-token.test.js'
      - '.github/workflows/google-ads-credential-provision.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-ads-credential-provision
  cancel-in-progress: false

jobs:
  provision:
    name: Provision encrypted developer token
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: Production
    env:
      SUPABASE_URL: https://ssvvuuysgxyqvmovrlvk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.NUVANX_SUPABASE_SERVICE_ROLE_KEY }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          persist-credentials: false

      - name: Validate credential inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -n "${ENCRYPTION_KEY:-}"
          test -n "${GOOGLE_ADS_DEVELOPER_TOKEN:-}"

      - name: Verify encryption contract
        run: node --test scripts/provision-google-ads-developer-token.test.js

      - name: Provision encrypted credential
        run: node scripts/provision-google-ads-developer-token.js

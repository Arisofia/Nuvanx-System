name: Google Ads Review Fixes Once

on:
  push:
    branches:
      - feat/google-ads-status-output-20260825
    paths:
      - '.github/workflows/google-ads-review-fixes-once.yml'

permissions:
  contents: write

jobs:
  fix-validate-commit:
    if: github.actor == 'Arisofia'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x
      - name: Apply verified review fixes
        run: python3 .github/scripts/google-ads-review-fixes.py
      - name: Validate repository
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm test
          npm run validate:workflows
          npm run validate:migrations
          npm run secrets:scan
          npm run validate:edge-deno
          npm --prefix frontend ci --ignore-scripts
          npm --prefix frontend run lint
          npm --prefix frontend test
          npm --prefix frontend run build
          git diff --check
      - name: Commit permanent fixes and remove one-shot tooling
        run: |
          set -euo pipefail
          git config user.name 'Nuvanx Engineering'
          git config user.email 'admin@nuvanx.com'
          git add frontend/src/pages/MarketingUnified.tsx frontend/tests/marketing-unified-contract.test.ts supabase/functions/api/google-ads-status-contract.test.mjs
          git rm .github/scripts/google-ads-review-fixes.py .github/workflows/google-ads-review-fixes-once.yml
          git diff --cached --check
          git commit -m 'fix(google-ads): preserve connection diagnostics'
          git push origin HEAD:feat/google-ads-status-output-20260825

name: RSV26 Live Audit Once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    name: Meta · RSV26 canonical live audit read-only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Production
    env:
      META_CANONICAL_ACCESS_TOKEN: ${{ secrets.META_CANONICAL_ACCESS_TOKEN }}
      META_CANONICAL_APP_SECRET: ${{ secrets.META_CANONICAL_APP_SECRET }}
      META_ACCESS_AUDIT_REQUIRED_SOURCE: META_CANONICAL_ACCESS_TOKEN
      META_ACCESS_AUDIT_REQUIRE_CRITICAL: 'true'
      META_ACCESS_AUDIT_REQUIRE_ALL: 'false'
      META_ACCESS_AUDIT_REQUIRE_APP_MATCH: 'true'
      META_ACCESS_AUDIT_REQUIRE_CRITICAL_ASSETS: 'true'

    steps:
      - name: Checkout audit candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Verify canonical secret presence without revealing values
        shell: bash
        run: |
          set -euo pipefail
          test -n "${META_CANONICAL_ACCESS_TOKEN:-}"
          test -n "${META_CANONICAL_APP_SECRET:-}"
          echo 'META_CANONICAL_ACCESS_TOKEN_PRESENT=true'
          echo 'META_CANONICAL_APP_SECRET_PRESENT=true'

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Run RSV26 safety tests
        run: npx vitest run supabase/functions/meta-rsv26-tools.test.mjs supabase/functions/meta-rsv26-safety-extra.test.mjs

      - name: Verify permissions app and critical assets
        run: node scripts/meta-access-audit.js

      - name: Verify canonical System User
        run: node scripts/meta-system-user-audit.js

      - name: Audit live campaign drift read-only
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node scripts/meta-audit-rsv26.js
          status=$?
          set -e
          echo "META_RSV26_AUDIT_EXIT=$status"
          test "$status" -eq 0 -o "$status" -eq 1

      - name: Diff live creative contracts read-only
        run: node scripts/meta-creative-diff-rsv26.js

      - name: Build categorized mutation plan read-only
        run: node scripts/meta-apply-rsv26.js

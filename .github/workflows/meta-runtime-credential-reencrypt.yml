# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Meta Runtime Credential Re-encryption

on:
  workflow_dispatch:
    inputs:
      trusted_sha:
        description: Exact current main SHA approved for this repair
        required: true
        type: string
      confirmation:
        description: Type ROTATE-META-CREDENTIAL exactly
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: meta-runtime-credential-reencrypt-v1
  cancel-in-progress: false

jobs:
  repair:
    name: Protected canonical Meta credential repair
    if: >-
      github.repository == 'Arisofia/Nuvanx-System' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'ROTATE-META-CREDENTIAL'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: Production
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      META_CANONICAL_ACCESS_TOKEN: ${{ secrets.META_CANONICAL_ACCESS_TOKEN }}
      CLAIM_TITLE: meta-runtime-credential-reencrypt-v1
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact dispatched main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse moved or unapproved main
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.trusted_sha }}" = "$GITHUB_SHA" || {
            echo "META_RUNTIME_ROTATION_SHA_GATE=FAIL reason=input_mismatch" >&2
            exit 1
          }
          git fetch --no-tags origin main
          current_main="$(git rev-parse origin/main)"
          test "$current_main" = "$GITHUB_SHA" || {
            echo "META_RUNTIME_ROTATION_SHA_GATE=FAIL reason=main_moved" >&2
            exit 1
          }
          test -n "${SUPABASE_PROJECT_REF:-}"
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${META_CANONICAL_ACCESS_TOKEN:-}"
          [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]
          echo 'META_RUNTIME_ROTATION_SHA_GATE=PASS'

      - name: Refuse previously claimed operation
        shell: bash
        run: |
          set -euo pipefail
          existing="$(
            gh api --paginate --method GET \
              "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" \
              | jq -r --arg title "$CLAIM_TITLE" '.[] | select(.title == $title) | .number' \
              | head -n1
          )"
          if [ -n "$existing" ]; then
            echo "META_RUNTIME_ROTATION_ONE_SHOT=REFUSED existing_issue=$existing" >&2
            exit 1
          fi
          echo 'META_RUNTIME_ROTATION_ONE_SHOT_AVAILABLE=PASS'

      - name: Persist one-shot claim before mutation
        id: claim
        shell: bash
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          Persistent one-shot claim created before canonical Meta credential re-encryption.

          - trusted_sha: ${{ inputs.trusted_sha }}
          - workflow_run: ${GITHUB_RUN_ID}
          - actor: ${GITHUB_ACTOR}
          - service: meta_ads
          - state: CLAIMED

          This operation is restricted to the canonical NUVANX Meta App/System User/Ad Account contract.
          EOF
          )
          response="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/issues" -f title="$CLAIM_TITLE" -f body="$body")"
          issue_number="$(printf '%s' "$response" | jq -r '.number')"
          test -n "$issue_number" && test "$issue_number" != null
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"
          echo "META_RUNTIME_ROTATION_CLAIM=PASS issue=$issue_number"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@52a446718e4edd1a9f1e2631186019c87e329f60
        with:
          version: 2.102.0

      - name: Validate repair function before deployment
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx vitest run supabase/functions/meta-credential-runtime-rotate-once/contract.test.mjs
          deno check supabase/functions/meta-credential-runtime-rotate-once/index.ts
          echo 'META_RUNTIME_ROTATION_CONTRACT=PASS'

      - name: Deploy bounded temporary rotator
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy meta-credential-runtime-rotate-once \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt
          echo 'META_RUNTIME_ROTATION_DEPLOY=PASS'

      - name: Re-encrypt canonical meta_ads credential inside Supabase runtime
        shell: bash
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/meta-runtime-rotation-response.json"
          http_code="$(
            curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer ${META_CANONICAL_ACCESS_TOKEN}" \
              --header 'x-nuvanx-operation: meta-runtime-credential-reencrypt-v1' \
              --header 'content-type: application/json' \
              --data '{}' \
              "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/meta-credential-runtime-rotate-once"
          )"
          test "$http_code" = 200 || {
            echo "META_RUNTIME_ROTATION_CALL=FAIL status=$http_code" >&2
            jq '{success,message}' "$response_file" >&2 || true
            exit 1
          }
          jq -e '
            .success == true and
            .service == "meta_ads" and
            .roundtrip_verified == true and
            .system_user_verified == true and
            .ad_account_verified == true
          ' "$response_file" >/dev/null
          jq '{success,service,before_decryptable,rotated,roundtrip_verified,system_user_verified,ad_account_verified}' "$response_file"
          echo 'META_RUNTIME_ROTATION_CALL=PASS'

      - name: Mark persistent claim completed
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          issue='${{ steps.claim.outputs.issue_number }}'
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${issue}/comments" \
            -f body="Canonical meta_ads credential re-encrypted successfully inside the Supabase runtime for SHA ${GITHUB_SHA}. Token identity, canonical ad account and encryption round-trip were verified."
          echo "META_RUNTIME_ROTATION_COMPLETE=PASS issue=$issue"

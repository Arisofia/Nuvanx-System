# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Meta Runtime Credential Re-encryption

on:
  workflow_dispatch:
    inputs:
      trusted_sha:
        description: Exact current main SHA approved for this repair
        required: true
        type: string
      confirmation:
        description: Type ROTATE-META-CREDENTIAL exactly
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: meta-runtime-credential-reencrypt-v1
  cancel-in-progress: false

jobs:
  repair:
    name: Protected canonical Meta credential repair
    if: >-
      github.repository == 'Arisofia/Nuvanx-System' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'ROTATE-META-CREDENTIAL'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: Production
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      META_CANONICAL_ACCESS_TOKEN: ${{ secrets.META_CANONICAL_ACCESS_TOKEN }}
      TRUSTED_SHA: ${{ inputs.trusted_sha }}
      CLAIM_TITLE: meta-runtime-credential-reencrypt-v1
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact dispatched main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse moved or unapproved main
        shell: bash
        run: |
          set -euo pipefail
          test "$TRUSTED_SHA" = "$GITHUB_SHA" || {
            echo 'META_RUNTIME_ROTATION_SHA_GATE=FAIL reason=input_mismatch' >&2
            exit 1
          }
          git fetch --no-tags origin main
          current_main="$(git rev-parse origin/main)"
          test "$current_main" = "$GITHUB_SHA" || {
            echo 'META_RUNTIME_ROTATION_SHA_GATE=FAIL reason=main_moved' >&2
            exit 1
          }
          test -n "${SUPABASE_PROJECT_REF:-}"
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${META_CANONICAL_ACCESS_TOKEN:-}"
          [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]
          echo 'META_RUNTIME_ROTATION_SHA_GATE=PASS'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@52a446718e4edd1a9f1e2631186019c87e329f60
        with:
          version: 2.102.0

      - name: Validate repair function before claim or deployment
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx vitest run supabase/functions/meta-credential-runtime-rotate-once/contract.test.mjs
          deno check supabase/functions/meta-credential-runtime-rotate-once/index.ts
          echo 'META_RUNTIME_ROTATION_CONTRACT=PASS'

      - name: Acquire persistent retry-safe claim
        id: claim
        shell: bash
        run: |
          set -euo pipefail
          existing="$(
            gh api --paginate --method GET \
              "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" \
              | jq -r --arg title "$CLAIM_TITLE" '.[] | select(.title == $title) | .number' \
              | head -n1
          )"

          if [ -n "$existing" ]; then
            issue_body="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/issues/${existing}" --jq '.body // ""')"
            comment_history="$(
              gh api --paginate --method GET \
                "repos/${GITHUB_REPOSITORY}/issues/${existing}/comments?per_page=100" \
                --jq '.[].body'
            )"
            history="${issue_body}"$'\n'"${comment_history}"
            if grep -Fq 'state: COMPLETED' <<< "$history" || grep -Fq 'state: MUTATED' <<< "$history"; then
              echo "META_RUNTIME_ROTATION_ONE_SHOT=REFUSED existing_issue=$existing reason=mutation_already_recorded" >&2
              exit 1
            fi
            issue_number="$existing"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${issue_number}/comments" \
              -f body="state: CLAIMED\nworkflow_run: ${GITHUB_RUN_ID}\ntrusted_sha: ${GITHUB_SHA}\nactor: ${GITHUB_ACTOR}\nRetrying an incomplete pre-mutation claim."
            echo "META_RUNTIME_ROTATION_CLAIM=REUSED issue=$issue_number"
          else
            body=$(cat <<EOF
          Persistent claim for canonical Meta credential re-encryption.

          - trusted_sha: ${GITHUB_SHA}
          - workflow_run: ${GITHUB_RUN_ID}
          - actor: ${GITHUB_ACTOR}
          - service: meta_ads
          - state: CLAIMED

          This operation is restricted to the canonical NUVANX Meta App/System User/Ad Account contract. A claim is retryable only until mutation occurs; MUTATED/COMPLETED states are permanent.
          EOF
            )
            response="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/issues" -f title="$CLAIM_TITLE" -f body="$body")"
            issue_number="$(printf '%s' "$response" | jq -r '.number')"
            test -n "$issue_number" && test "$issue_number" != null
            echo "META_RUNTIME_ROTATION_CLAIM=CREATED issue=$issue_number"
          fi

          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"

      - name: Deploy bounded temporary rotator
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy meta-credential-runtime-rotate-once \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt
          echo 'META_RUNTIME_ROTATION_DEPLOY=PASS'

      - name: Re-encrypt canonical meta_ads credential inside Supabase runtime
        id: rotate
        shell: bash
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/meta-runtime-rotation-response.json"
          issued_at="$(node -p 'Date.now()')"
          http_code="$(
            curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer ${META_CANONICAL_ACCESS_TOKEN}" \
              --header 'x-nuvanx-operation: meta-runtime-credential-reencrypt-v1' \
              --header "x-nuvanx-issued-at: ${issued_at}" \
              --header 'content-type: application/json' \
              --data '{}' \
              "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/meta-credential-runtime-rotate-once"
          )"
          message="$(jq -r '.message // ""' "$response_file")"
          echo "remote_state=$message" >> "$GITHUB_OUTPUT"
          if [ "$http_code" != 200 ]; then
            echo "META_RUNTIME_ROTATION_CALL=FAIL status=$http_code message=${message:-unknown}" >&2
            exit 1
          fi
          jq -e '
            .success == true and
            .service == "meta_ads" and
            .roundtrip_verified == true and
            .app_id_verified == true and
            .system_user_verified == true and
            .ad_account_verified == true and
            .operation_marked_completed == true
          ' "$response_file" >/dev/null
          jq '{success,service,before_decryptable,rotated,roundtrip_verified,app_id_verified,system_user_verified,ad_account_verified,operation_marked_completed}' "$response_file"
          echo 'META_RUNTIME_ROTATION_CALL=PASS'

      - name: Persist mutation boundary immediately
        if: ${{ steps.rotate.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          issue='${{ steps.claim.outputs.issue_number }}'
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${issue}/comments" \
            -f body="state: MUTATED\nworkflow_run: ${GITHUB_RUN_ID}\ntrusted_sha: ${GITHUB_SHA}\nCanonical meta_ads credential and its runtime one-shot marker were persisted after App/System User/Ad Account and encryption round-trip validation."
          echo "META_RUNTIME_ROTATION_MUTATED=PASS issue=$issue"

      - name: Delete temporary rotator from Supabase
        id: cleanup
        if: ${{ always() && steps.deploy.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          supabase functions delete meta-credential-runtime-rotate-once \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --yes
          echo 'META_RUNTIME_ROTATION_CLEANUP=PASS function_deleted=true'

      - name: Mark persistent claim completed
        if: ${{ always() && steps.rotate.outcome == 'success' && steps.cleanup.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          issue='${{ steps.claim.outputs.issue_number }}'
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${issue}/comments" \
            -f body="state: COMPLETED\nworkflow_run: ${GITHUB_RUN_ID}\ntrusted_sha: ${GITHUB_SHA}\nCanonical meta_ads credential re-encrypted successfully and temporary Supabase rotator deleted."
          echo "META_RUNTIME_ROTATION_COMPLETE=PASS issue=$issue"

      - name: Mark failed pre-mutation claim retryable
        if: >-
          ${{
            always() &&
            steps.claim.outputs.issue_number != '' &&
            steps.rotate.outcome != 'success' &&
            steps.rotate.outputs.remote_state != 'operation_already_completed'
          }}
        shell: bash
        run: |
          set -euo pipefail
          issue='${{ steps.claim.outputs.issue_number }}'
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${issue}/comments" \
            -f body="state: RETRYABLE\nworkflow_run: ${GITHUB_RUN_ID}\ntrusted_sha: ${GITHUB_SHA}\nThe run failed before a successful credential mutation was reported. The persistent claim may be reused after the underlying failure is corrected."
          echo "META_RUNTIME_ROTATION_RETRYABLE=PASS issue=$issue"

      - name: Record recovered or cleanup-failed mutation as non-retryable
        if: >-
          ${{
            always() &&
            steps.claim.outputs.issue_number != '' &&
            (
              steps.rotate.outputs.remote_state == 'operation_already_completed' ||
              (steps.rotate.outcome == 'success' && steps.cleanup.outcome != 'success')
            )
          }}
        shell: bash
        run: |
          set -euo pipefail
          issue='${{ steps.claim.outputs.issue_number }}'
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${issue}/comments" \
            -f body="state: MUTATED_CLEANUP_FAILED\nworkflow_run: ${GITHUB_RUN_ID}\ntrusted_sha: ${GITHUB_SHA}\nMutation is already persisted or remotely confirmed; do not retry credential replacement. Inspect and remove the temporary rotator manually if cleanup did not complete."
          echo "META_RUNTIME_ROTATION_NON_RETRYABLE=PASS issue=$issue"
          exit 1

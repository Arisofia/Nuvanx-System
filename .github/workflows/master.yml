# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: Master System
run-name: >-
  Master System · ${{ github.event_name }} · ${{ github.event.schedule || inputs.operation || github.ref_name }}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * *'
    - cron: '0 7 1 * *'
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run
        required: true
        default: ci
        type: choice
        options:
          - ci
          - deploy
          - daily_sync
          - social_audit
      from_date:
        description: Start date for Meta insights (YYYY-MM-DD)
        required: false
        type: string
      to_date:
        description: End date for Meta insights (YYYY-MM-DD)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: master-system-${{ github.event_name }}-${{ github.ref }}-${{ github.event.schedule || inputs.operation || 'default' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_ENV: production
  META_GRAPH_VERSION: v22.0

jobs:
  quality-backend:
    name: Quality · repository + backend
    if: >-
      ${{
        github.event_name == 'pull_request' ||
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && (inputs.operation == 'ci' || inputs.operation == 'deploy'))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x

      - name: Install workspace dependencies
        run: npm install --include=dev --ignore-scripts

      - name: Repository and migration gates
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from collections import defaultdict
          from pathlib import Path

          markers = ('<<<<<<<', '=======', '>>>>>>>')
          for target in (Path('.github'), Path('supabase/config.toml')):
              files = sorted(target.rglob('*')) if target.is_dir() else [target]
              for file_path in files:
                  if not file_path.is_file():
                      continue
                  for number, line in enumerate(file_path.read_text(errors='ignore').splitlines(), 1):
                      if line.startswith(markers):
                          raise SystemExit(f'merge conflict marker: {file_path}:{number}')

          versions = defaultdict(list)
          for migration in sorted(Path('supabase/migrations').glob('*.sql')):
              versions[migration.name.split('_', 1)[0]].append(migration.name)

          duplicates = {version: names for version, names in versions.items() if len(names) > 1}
          if duplicates:
              raise SystemExit(f'duplicate Supabase migration versions: {duplicates}')

          print(f'OK {len(versions)} unique Supabase migration versions')
          PY

          node scripts/validate-sql-migrations.js

          ruby - <<'RUBY'
          require 'yaml'
          files = Dir.glob('.github/**/*.{yml,yaml}').sort
          raise 'No GitHub YAML files found' if files.empty?
          files.each do |file|
            YAML.safe_load(File.read(file), permitted_classes: [], permitted_symbols: [], aliases: true)
            puts "OK #{file}"
          end
          RUBY

          node scripts/validate-github-workflows.js

      - name: Actionlint
        uses: reviewdog/action-actionlint@dbe5299849118fd6f099ba563d263d770955a64a
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38
        with:
          scandir: '.github'
        env:
          SHELLCHECK_OPTS: -e SC1091 -e SC2086 -e SC2155 --severity=warning

      - name: ShellCheck standalone scripts
        shell: bash
        run: |
          set -euo pipefail
          find . -name '*.sh' \
            -not -path './node_modules/*' \
            -not -path './frontend/node_modules/*' \
            -not -path './.git/*' \
            -exec shellcheck --severity=warning {} +

      - name: Shared and Edge Function tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY || '' }}
          MCP_API_KEY: ${{ secrets.MCP_API_KEY || '' }}
          FALLBACK_META_AD_ACCOUNT_ID: ${{ secrets.FALLBACK_META_AD_ACCOUNT_ID || '' }}
          SHEETS_WEBHOOK_URL_DOCTORALIA: ${{ secrets.SHEETS_WEBHOOK_URL_DOCTORALIA || '' }}
          SHEETS_WEBHOOK_SECRET_DOCTORALIA: ${{ secrets.SHEETS_WEBHOOK_SECRET_DOCTORALIA || '' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || '' }}
          DEFAULT_PHONE_COUNTRY_CODE: '34'

      - name: Deno type-check all Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/functions/deno.json
          mapfile -t sources < <(find supabase/functions -name '*.ts' -type f | sort)
          test "${#sources[@]}" -gt 0
          deno check --config=supabase/functions/deno.json "${sources[@]}"

  frontend:
    name: Quality · frontend
    needs: quality-backend
    if: >-
      ${{
        github.event_name == 'pull_request' ||
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && (inputs.operation == 'ci' || inputs.operation == 'deploy'))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm install --include=dev --ignore-scripts

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

  frontend-e2e:
    name: Quality · Playwright smoke
    needs: frontend
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preserve untrusted PR boundary
        id: check-e2e
        shell: bash
        run: |
          set -euo pipefail
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "AUTHENTICATED_E2E=NOT_RUN_UNTRUSTED_PR"

  frontend-e2e-trusted:
    name: Quality · Playwright smoke · trusted
    needs: frontend
    if: >-
      ${{
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && (inputs.operation == 'ci' || inputs.operation == 'deploy'))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: Production
    concurrency:
      group: production-authenticated-e2e
      cancel-in-progress: false
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_CLINIC_ID: 4207023b-eac1-4249-bf0f-d9b1e36a5d7a
      PRODUCTION_E2E_URL: https://nuvanx-frontend.jenineferderas.workers.dev
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NUVANX_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.NUVANX_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm install --include=dev --ignore-scripts

      - name: Install Chromium
        run: npm exec playwright install --with-deps chromium

      - name: Provision disposable E2E identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}" || { echo "::error::SUPABASE_URL is missing from Production"; exit 1; }
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || { echo "::error::SUPABASE_SERVICE_ROLE_KEY is missing from Production"; exit 1; }
          [[ "$SUPABASE_URL" == https://*.supabase.co ]]
          [[ "${E2E_CLINIC_ID:-}" =~ ^[0-9a-f-]{36}$ ]]

          email="e2e-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@nuvanx.com"
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          export E2E_EMAIL="$email"
          export E2E_PASSWORD="$password"
          printf 'E2E_EMAIL=%s\n' "$email" >> "$GITHUB_ENV"
          printf 'E2E_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"

          node --input-type=module <<'NODE'
          import { createClient } from '@supabase/supabase-js';

          const url = process.env.SUPABASE_URL?.trim();
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY?.trim();
          const email = process.env.E2E_EMAIL?.trim();
          const password = process.env.E2E_PASSWORD;
          const clinicId = process.env.E2E_CLINIC_ID?.trim();
          if (!url || !key || !email || !password || !clinicId) {
            throw new Error('Trusted E2E provisioning context is incomplete');
          }

          const supabase = createClient(url, key, {
            auth: { autoRefreshToken: false, persistSession: false, detectSessionInUrl: false },
          });

          const { data: listed, error: listError } = await supabase.auth.admin.listUsers({ page: 1, perPage: 1000 });
          if (listError) throw listError;
          const staleUsers = listed.users.filter((candidate) => {
            const candidateEmail = candidate.email?.toLowerCase() || '';
            return candidateEmail.startsWith('e2e-ci-') && candidateEmail.endsWith('@nuvanx.com') && candidateEmail !== email.toLowerCase();
          });
          for (const stale of staleUsers) {
            const { error: deleteError } = await supabase.auth.admin.deleteUser(stale.id);
            if (deleteError) throw deleteError;
          }

          const { data: created, error: createError } = await supabase.auth.admin.createUser({
            email,
            password,
            email_confirm: true,
            user_metadata: { name: 'NUVANX CI E2E' },
          });
          if (createError) throw createError;
          const userId = created.user?.id;
          if (!userId) throw new Error('Supabase did not return the disposable E2E user id');

          const { data: profile, error: profileError } = await supabase
            .from('users')
            .update({ clinic_id: clinicId })
            .eq('id', userId)
            .select('id, clinic_id')
            .single();

          if (profileError || profile?.clinic_id !== clinicId) {
            await supabase.auth.admin.deleteUser(userId);
            throw profileError || new Error('Disposable E2E profile was not assigned to the expected clinic');
          }

          console.log(`Disposable E2E identity provisioned: ${email}`);
          NODE

      - name: Run Playwright smoke
        run: npm run test:e2e
        env:
          PLAYWRIGHT_REQUIRE_BROWSERS: 'true'

      - name: Delete disposable E2E identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${E2E_EMAIL:-}" ]; then
            echo "No disposable E2E identity was exported; cleanup is not required."
            exit 0
          fi
          test -n "${SUPABASE_URL:-}" || { echo "::error::Cannot delete E2E identity without SUPABASE_URL"; exit 1; }
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || { echo "::error::Cannot delete E2E identity without SUPABASE_SERVICE_ROLE_KEY"; exit 1; }

          node --input-type=module <<'NODE'
          import { createClient } from '@supabase/supabase-js';

          const url = process.env.SUPABASE_URL?.trim();
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY?.trim();
          const email = process.env.E2E_EMAIL?.trim();
          if (!url || !key || !email) throw new Error('Trusted E2E cleanup context is incomplete');

          const supabase = createClient(url, key, {
            auth: { autoRefreshToken: false, persistSession: false, detectSessionInUrl: false },
          });
          const { data, error } = await supabase.auth.admin.listUsers({ page: 1, perPage: 1000 });
          if (error) throw error;
          const user = data.users.find((candidate) => candidate.email?.toLowerCase() === email.toLowerCase());
          if (!user) {
            console.log(`Disposable E2E identity already absent: ${email}`);
            process.exit(0);
          }

          const { error: deleteError } = await supabase.auth.admin.deleteUser(user.id);
          if (deleteError) throw deleteError;
          console.log(`Disposable E2E identity deleted: ${email}`);
          NODE

  deploy-supabase:
    name: Deploy · Supabase manual fallback
    needs: [quality-backend, frontend, frontend-e2e-trusted]
    # Supabase Git Branching is the automatic production deploy owner for pushes to main.
    # This job is retained only as an explicit manual recovery path.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        inputs.operation == 'deploy'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: nuvanx-system-supabase-production
      cancel-in-progress: false
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FALLBACK_META_AD_ACCOUNT_ID: ${{ secrets.FALLBACK_META_AD_ACCOUNT_ID }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect deploy-relevant changes
        id: scope
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before || '' }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$BEFORE_SHA" ] || [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$BEFORE_SHA" "$CURRENT_SHA" -- \
            supabase/ \
            scripts/supabase-migrate.sh \
            scripts/validate-sql-migrations.js \
            .github/actions/supabase-link-run; then
            echo 'required=false' >> "$GITHUB_OUTPUT"
            echo 'No deploy-relevant Supabase changes in this push.'
          else
            echo 'required=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate deployment configuration
        if: steps.scope.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_PROJECT_REF:-}"
          [[ "${SUPABASE_PROJECT_REF:-}" =~ ^[a-z0-9]{20}$ ]]
          [[ "${SUPABASE_ACCESS_TOKEN:-}" =~ ^sbp_[A-Za-z0-9]+$ ]]
          [[ "${FALLBACK_META_AD_ACCOUNT_ID:-}" =~ ^[0-9]+$ ]]
          if [ -z "${DATABASE_URL:-}" ] && [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error::DATABASE_URL or SUPABASE_DB_PASSWORD is required"
            exit 1
          fi

      - name: Apply canonical migrations
        if: steps.scope.outputs.required == 'true'
        uses: ./.github/actions/supabase-link-run
        with:
          project_ref: ${{ env.SUPABASE_PROJECT_REF }}
          supabase_access_token: ${{ env.SUPABASE_ACCESS_TOKEN }}
          database_url: ${{ env.DATABASE_URL }}
          supabase_db_password: ${{ env.SUPABASE_DB_PASSWORD }}
          skip_link: true
          command: |
            set -euo pipefail
            node scripts/validate-sql-migrations.js
            bash scripts/supabase-migrate.sh
            supabase migration list --db-url "${SESSION_URL:-$DATABASE_URL}" --debug

      - name: Deploy canonical core Edge Functions
        if: steps.scope.outputs.required == 'true'
        uses: ./.github/actions/supabase-link-run
        with:
          project_ref: ${{ env.SUPABASE_PROJECT_REF }}
          supabase_access_token: ${{ env.SUPABASE_ACCESS_TOKEN }}
          database_url: ${{ env.DATABASE_URL }}
          supabase_db_password: ${{ env.SUPABASE_DB_PASSWORD }}
          skip_link: true
          command: |
            set -euo pipefail
            export FALLBACK_META_AD_ACCOUNT_ID="$FALLBACK_META_AD_ACCOUNT_ID"
            supabase functions deploy api --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
            supabase functions deploy mcp --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
            supabase functions deploy daily-aggregates --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
            supabase functions deploy meta-daily-insights --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
            supabase functions deploy meta-lead-backfill --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
            supabase functions list --project-ref "$SUPABASE_PROJECT_REF"

  daily-sync:
    name: Scheduled · Daily Sync
    if: >-
      ${{
        (github.event_name == 'schedule' && github.event.schedule == '0 7 * * *') ||
        (github.event_name == 'workflow_dispatch' && inputs.operation == 'daily_sync')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: Production
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NUVANX_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.NUVANX_SUPABASE_SERVICE_ROLE_KEY }}
      NUVANX_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NUVANX_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GOOGLE_ADS_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_ADS_SERVICE_ACCOUNT }}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
      GOOGLE_DOCTORALIA_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_DOCTORALIA_SERVICE_ACCOUNT }}
      DOCTORALIA_SHEET_ID: ${{ secrets.DOCTORALIA_SHEET_ID }}
      DOCTORALIA_DRIVE_FILE_ID: ${{ secrets.DOCTORALIA_DRIVE_FILE_ID }}
      DOCTORALIA_LOOKER_FOLDER_ID: ${{ secrets.DOCTORALIA_LOOKER_FOLDER_ID }}
      DOCTORALIA_APPOINTMENTS_SHEET_ID: ${{ secrets.DOCTORALIA_APPOINTMENTS_SHEET_ID || secrets.DOCTORALIA_SHEET_ID }}
      CLINIC_ID: ${{ secrets.CLINIC_ID }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      REPORT_USER_ID: ${{ secrets.REPORT_USER_ID }}
      META_REPORTING_TOKEN_60D: ${{ secrets.META_REPORTING_TOKEN_60D }}
      META_REPORTING_AD_ACCOUNT_ID: ${{ secrets.META_REPORTING_AD_ACCOUNT_ID }}
      FALLBACK_META_AD_ACCOUNT_ID: ${{ secrets.FALLBACK_META_AD_ACCOUNT_ID }}
      SHEETS_WEBHOOK_URL_DOCTORALIA: ${{ secrets.SHEETS_WEBHOOK_URL_DOCTORALIA }}
      SHEETS_WEBHOOK_SECRET_DOCTORALIA: ${{ secrets.SHEETS_WEBHOOK_SECRET_DOCTORALIA }}
      SHEET_NAME: Doctoralia
      SHEET_RANGE: A1:T5000
      DOCTORALIA_SYNC_PERMISSION_MODE: ${{ secrets.DOCTORALIA_SYNC_PERMISSION_MODE || 'fail' }}
      DOCTORALIA_APPOINTMENTS_SHEET_NAME: ${{ secrets.DOCTORALIA_APPOINTMENTS_SHEET_NAME }}
      DOCTORALIA_APPOINTMENTS_SHEET_RANGE: A1:T5000
      DOCTORALIA_APPOINTMENTS_MIN_ROWS: '1800'
      DOCTORALIA_APPOINTMENTS_PERMISSION_MODE: ${{ secrets.DOCTORALIA_SYNC_PERMISSION_MODE || 'fail' }}
      DOCTORALIA_APPOINTMENTS_REPLACE_MODE: 'true'
      FROM_DATE_INPUT: ${{ inputs.from_date || '' }}
      TO_DATE_INPUT: ${{ inputs.to_date || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          cache: npm

      - name: Install workspace dependencies
        run: npm install --include=dev --ignore-scripts

      - name: Activate read-only Meta reporting token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${META_REPORTING_TOKEN_60D:-}"
          test -n "${META_REPORTING_AD_ACCOUNT_ID:-}"
          echo "META_ACCESS_TOKEN=${META_REPORTING_TOKEN_60D}" >> "$GITHUB_ENV"
          echo "META_AD_ACCOUNT_IDS=${META_REPORTING_AD_ACCOUNT_ID}" >> "$GITHUB_ENV"
          echo "META_AD_ACCOUNT_ID=" >> "$GITHUB_ENV"
          echo "FALLBACK_META_AD_ACCOUNT_ID=" >> "$GITHUB_ENV"

      - name: Validate sync prerequisites
        run: |
          node scripts/validate-daily-sync-config.js
          node scripts/validate-doctoralia-appointments-ready.js

      - name: Run canonical daily orchestrator
        run: node scripts/run-daily-sync.js

      - name: Fetch Meta daily insights
        run: node scripts/fetch-meta-daily-insights-via-edge.js

  social-proof-audit:
    name: Scheduled · Social Proof Audit
    if: >-
      ${{
        (github.event_name == 'schedule' && github.event.schedule == '0 7 1 * *') ||
        (github.event_name == 'workflow_dispatch' && inputs.operation == 'social_audit')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OUT_DIR: tmp/social-proof-audit
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'

      - name: Audit public NUVANX social proof
        run: node scripts/social-proof/nuvanx-social-proof-audit.mjs

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nuvanx-social-proof-audit
          path: tmp/social-proof-audit
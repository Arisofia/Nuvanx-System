name: Google Ads Status Output Build V4 Once
# Re-triggered after removing superseded malformed one-shot workflows.

on:
  push:
    branches:
      - feat/google-ads-status-output-20260825
    paths:
      - '.github/workflows/google-ads-status-output-build-v4-once.yml'

permissions:
  contents: write

jobs:
  build-test-commit:
    if: github.actor == 'Arisofia'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x
      - name: Apply deterministic patch
        run: python3 .github/scripts/google-ads-status-output-build-v4.py
      - name: Validate syntax and diff
        run: |
          node --check scripts/check-google-ads-db.js
          git diff --check
      - name: Validate repository
        run: |
          npm ci --ignore-scripts
          npm test
          npm run validate:workflows
          npm run validate:migrations
          npm run secrets:scan
          npm run validate:edge-deno
          npm --prefix frontend ci --ignore-scripts
          npm --prefix frontend run lint
          npm --prefix frontend test
          npm --prefix frontend run build
          git diff --check
      - name: Commit permanent changes only
        run: |
          git config user.name 'Nuvanx Engineering'
          git config user.email 'admin@nuvanx.com'
          git add package.json scripts/check-google-ads-db.js supabase/functions/api/index.ts supabase/functions/api/google-ads-status-contract.test.mjs frontend/src/pages/MarketingUnified.tsx frontend/tests/marketing-unified-contract.test.ts docs/operations/google-ads-status-output.md
          git diff --cached --check
          git commit -m 'feat(google-ads): expose canonical connection status'
          git push origin HEAD:feat/google-ads-status-output-20260825

name: Apply Same Day Range Fix Once

on:
  push:
    branches:
      - fix/meta-clinic-tenant-resolution-v2-20260902

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'Arisofia/Nuvanx-System' && github.ref == 'refs/heads/fix/meta-clinic-tenant-resolution-v2-20260902'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply same-day range fix
        run: python3 scripts/apply-same-day-range-fix.py

      - name: Verify one-day floor
        shell: bash
        run: |
          set -euo pipefail
          grep -F "const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));" supabase/functions/api/index.ts
          grep -F "const days = Number.isFinite(diffDays) ? Math.max(1, diffDays) : 30;" supabase/functions/api/index.ts

      - name: Commit source fix and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/apply-same-day-range-fix.py
          rm .github/workflows/apply-same-day-range-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/api/index.ts scripts/apply-same-day-range-fix.py .github/workflows/apply-same-day-range-fix-once.yml
          git commit -m "fix(reporting): keep same-day ranges at one day"
          git push origin HEAD:fix/meta-clinic-tenant-resolution-v2-20260902

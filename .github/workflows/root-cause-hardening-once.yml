name: Root Cause Hardening Once

on:
  push:
    branches:
      - fix/meta-clinic-tenant-resolution-v2-20260902
    paths:
      - .github/workflows/root-cause-hardening-once.yml

concurrency:
  group: root-cause-hardening-once
  cancel-in-progress: false

jobs:
  harden:
    name: harden
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Required only to commit the one-shot patch and remove this workflow.
    steps:
      - name: Checkout branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/meta-clinic-tenant-resolution-v2-20260902
          fetch-depth: 0
          persist-credentials: true

      - name: Apply root-cause patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one source match, found {count}')
              return text.replace(old, new, 1)

          api_path = Path('supabase/functions/api/index.ts')
          api = api_path.read_text()

          api = replace_once(
              api,
              "  const clinicIdForLead = clinicId ?? await resolveClinicId(adminClient, userId);\n\n  const { data: lead } = await adminClient.from('leads')",
              "  const clinicIdForLead = clinicId ?? await resolveClinicId(adminClient, userId);\n  if (!clinicIdForLead) throw new Error('Clinic is required for Meta lead ingestion');\n\n  const { data: lead } = await adminClient.from('leads')",
              'Meta lead clinic guard',
          )

          api = replace_once(
              api,
              "async function ingestMetaLeadsFromForms(adminClient: any, userId: string, adAccountId: string, accessToken: string, sinceTs: number): Promise<number> {\n  let totalFetched = 0;",
              "async function ingestMetaLeadsFromForms(adminClient: any, userId: string, adAccountId: string, accessToken: string, sinceTs: number): Promise<number> {\n  const clinicId = await resolveClinicId(adminClient, userId);\n  if (!clinicId) throw new Error('Clinic is required for Meta lead ingestion');\n  let totalFetched = 0;",
              'Meta lead backfill clinic guard',
          )
          api = replace_once(
              api,
              "const success = await processLeadData(adminClient, userId, leadData);",
              "const success = await processLeadData(adminClient, userId, leadData, clinicId);",
              'Meta lead backfill canonical clinic propagation',
          )

          for label, old, new in [
              (
                  'Organic writer clinic guard',
                  "  const clinicId = await resolveClinicId(adminClient, userId);\n\n  const dbRows = Array.from(byDate.values()).map((r: any) => ({",
                  "  const clinicId = await resolveClinicId(adminClient, userId);\n  if (!clinicId) throw new Error('Clinic is required for Meta provider fact persistence');\n\n  const dbRows = Array.from(byDate.values()).map((r: any) => ({",
              ),
              (
                  'Page post writer clinic guard',
                  "  const clinicId = await resolveClinicId(adminClient, userId);\n\n  const dbRows = posts.map((p: any) => {",
                  "  const clinicId = await resolveClinicId(adminClient, userId);\n  if (!clinicId) throw new Error('Clinic is required for Meta provider fact persistence');\n\n  const dbRows = posts.map((p: any) => {",
              ),
              (
                  'IG account writer clinic guard',
                  "async function persistMetaIgAccountDailyInsights(adminClient: any, userId: string, igId: string, accessToken: string, sinceDate: string, untilDate: string): Promise<number> {\n  const clinicId = await resolveClinicId(adminClient, userId);\n  const byDate = new Map<string, any>();",
                  "async function persistMetaIgAccountDailyInsights(adminClient: any, userId: string, igId: string, accessToken: string, sinceDate: string, untilDate: string): Promise<number> {\n  const clinicId = await resolveClinicId(adminClient, userId);\n  if (!clinicId) throw new Error('Clinic is required for Meta provider fact persistence');\n  const byDate = new Map<string, any>();",
              ),
              (
                  'IG media writer clinic guard',
                  "  const clinicId = await resolveClinicId(adminClient, userId);\n  let upserted = 0;",
                  "  const clinicId = await resolveClinicId(adminClient, userId);\n  if (!clinicId) throw new Error('Clinic is required for Meta provider fact persistence');\n  let upserted = 0;",
              ),
          ]:
              api = replace_once(api, old, new, label)

          for label, old, new in [
              ('Organic canonical conflict key', "onConflict: 'user_id,page_id,date'", "onConflict: 'clinic_id,page_id,date'"),
              ('Page post canonical conflict key', "onConflict: 'user_id,post_id'", "onConflict: 'clinic_id,page_id,post_id'"),
              ('IG account canonical conflict key', "onConflict: 'user_id,ig_id,date'", "onConflict: 'clinic_id,ig_id,date'"),
              ('IG media canonical conflict key', "onConflict: 'user_id,media_id'", "onConflict: 'clinic_id,ig_id,media_id'"),
          ]:
              api = replace_once(api, old, new, label)

          old_webhook = """  const connected = intgs ?? [];
  let matchingIntg = connected.find((integration: any) =>
    metaIntegrationPageIds(integration?.metadata ?? {}).includes(String(page_id ?? '').trim())
  );

  if (matchingIntg == null) {
    const withoutPageRouting = connected.filter(
      (integration: any) => metaIntegrationPageIds(integration?.metadata ?? {}).length === 0,
    );
    if (withoutPageRouting.length === 1 && connected.length === 1) {
      matchingIntg = withoutPageRouting[0];
    }
  }
"""
          new_webhook = """  const connected = intgs ?? [];
  const incomingPageId = String(page_id ?? '').trim();
  const explicitMatches = connected.filter((integration: any) =>
    metaIntegrationPageIds(integration?.metadata ?? {}).includes(incomingPageId)
  );

  if (explicitMatches.length > 1) {
    console.warn('[meta-webhook] Ambiguous connected integrations match incoming page_id', {
      page_id,
      leadgen_id,
      match_count: explicitMatches.length,
    });
    return;
  }

  let matchingIntg = explicitMatches.length === 1 ? explicitMatches[0] : null;
  if (matchingIntg == null) {
    const withoutPageRouting = connected.filter(
      (integration: any) => metaIntegrationPageIds(integration?.metadata ?? {}).length === 0,
    );
    if (withoutPageRouting.length === 1 && connected.length === 1) {
      matchingIntg = withoutPageRouting[0];
    }
  }
"""
          api = replace_once(api, old_webhook, new_webhook, 'Webhook ambiguous page routing')
          api_path.write_text(api)

          # Reply-delay bridge: fix PL/pgSQL terminator and keep security_invoker
          # independent from historical reloptions for all five canonical views.
          p = Path('supabase/migrations/20260902091000_reconcile_reply_delay_integer_contract.sql')
          sql = p.read_text()
          sql = replace_once(sql, "  v_acl record;\nBEGIN", "  v_acl record;\n  v_safe_reloptions text[];\nBEGIN", '091000 safe reloptions declaration')
          sql = replace_once(sql, "END\n$reply_delay_bridge$;", "END;\n$reply_delay_bridge$;", '091000 PL/pgSQL terminator')
          old_restore = """    IF v_view.reloptions IS NOT NULL
       AND pg_catalog.array_length(v_view.reloptions, 1) > 0 THEN
      EXECUTE pg_catalog.format(
        'ALTER VIEW %I.%I SET (%s)',
        v_view.view_schema,
        v_view.view_name,
        pg_catalog.array_to_string(v_view.reloptions, ', ')
      );
    END IF;

    FOR v_acl IN
"""
          new_restore = """    SELECT pg_catalog.array_agg(opt)
      INTO v_safe_reloptions
    FROM pg_catalog.unnest(COALESCE(v_view.reloptions, ARRAY[]::text[])) AS opt
    WHERE opt !~ '^security_invoker=';

    IF v_safe_reloptions IS NOT NULL
       AND pg_catalog.array_length(v_safe_reloptions, 1) > 0 THEN
      EXECUTE pg_catalog.format(
        'ALTER VIEW %I.%I SET (%s)',
        v_view.view_schema,
        v_view.view_name,
        pg_catalog.array_to_string(v_safe_reloptions, ', ')
      );
    END IF;

    EXECUTE pg_catalog.format(
      'ALTER VIEW %I.%I SET (security_invoker = true)',
      v_view.view_schema,
      v_view.view_name
    );

    FOR v_acl IN
"""
          sql = replace_once(sql, old_restore, new_restore, '091000 security_invoker restore')
          p.write_text(sql)

          # source_to_cash bridge: validate narrowing casts and never inherit a
          # historical security_invoker=false reloption.
          p = Path('supabase/migrations/20260902092000_reconcile_source_to_cash_contract.sql')
          sql = p.read_text()
          range_guard = """
  IF EXISTS (
    SELECT 1 FROM public.patients
    WHERE total_ltv IS NOT NULL
      AND pg_catalog.abs(total_ltv) >= 10000000000::numeric
  ) THEN
    RAISE EXCEPTION 'Cannot reconcile source_to_cash: patients.total_ltv exceeds numeric(12,2) range';
  END IF;

  IF EXISTS (
    SELECT 1 FROM public.financial_settlements
    WHERE amount_net IS NOT NULL
      AND pg_catalog.abs(amount_net) >= 10000000000::numeric
  ) THEN
    RAISE EXCEPTION 'Cannot reconcile source_to_cash: financial_settlements.amount_net exceeds numeric(12,2) range';
  END IF;

"""
          sql = replace_once(sql, "  DROP VIEW public.source_to_cash;", range_guard + "  DROP VIEW public.source_to_cash;", '092000 numeric narrowing guard')
          sql = replace_once(sql, "  v_acl record;\nBEGIN", "  v_acl record;\n  v_safe_reloptions text[];\nBEGIN", '092000 safe reloptions declaration')
          old_restore = """  IF v_restore.reloptions IS NOT NULL
     AND pg_catalog.array_length(v_restore.reloptions, 1) > 0 THEN
    EXECUTE pg_catalog.format(
      'ALTER VIEW public.source_to_cash SET (%s)',
      pg_catalog.array_to_string(v_restore.reloptions, ', ')
    );
  END IF;

  FOR v_acl IN SELECT * FROM nvx_source_to_cash_acl ORDER BY grantee_name, privilege_type LOOP
"""
          new_restore = """  SELECT pg_catalog.array_agg(opt)
    INTO v_safe_reloptions
  FROM pg_catalog.unnest(COALESCE(v_restore.reloptions, ARRAY[]::text[])) AS opt
  WHERE opt !~ '^security_invoker=';

  IF v_safe_reloptions IS NOT NULL
     AND pg_catalog.array_length(v_safe_reloptions, 1) > 0 THEN
    EXECUTE pg_catalog.format(
      'ALTER VIEW public.source_to_cash SET (%s)',
      pg_catalog.array_to_string(v_safe_reloptions, ', ')
    );
  END IF;

  ALTER VIEW public.source_to_cash SET (security_invoker = true);

  FOR v_acl IN SELECT * FROM nvx_source_to_cash_acl ORDER BY grantee_name, privilege_type LOOP
"""
          sql = replace_once(sql, old_restore, new_restore, '092000 security_invoker restore')
          p.write_text(sql)

          # Canonical reporting bridge: Doctor Performance must match Production
          # (security_invoker option absent); Lead Audit must always remain true.
          p = Path('supabase/migrations/20260901160000_fix_reporting_canonical_sources.sql')
          sql = p.read_text()

          def patch_restore_section(text: str, start_marker: str, end_marker: str, view_name: str, force_true: bool) -> str:
              start = text.index(start_marker)
              end = text.index(end_marker, start) + len(end_marker)
              section = text[start:end]
              section = replace_once(section, "  v_acl record;\nBEGIN", "  v_acl record;\n  v_safe_reloptions text[];\nBEGIN", f'{view_name} safe reloptions declaration')
              old = f"""  IF v_restore.reloptions IS NOT NULL
     AND pg_catalog.array_length(v_restore.reloptions, 1) > 0 THEN
    EXECUTE pg_catalog.format(
      'ALTER VIEW public.{view_name} SET (%s)',
      pg_catalog.array_to_string(v_restore.reloptions, ', ')
    );
  END IF;

  FOR v_acl IN"""
              security_stmt = (
                  f"  ALTER VIEW public.{view_name} SET (security_invoker = true);"
                  if force_true
                  else f"  ALTER VIEW public.{view_name} RESET (security_invoker);"
              )
              new = f"""  SELECT pg_catalog.array_agg(opt)
    INTO v_safe_reloptions
  FROM pg_catalog.unnest(COALESCE(v_restore.reloptions, ARRAY[]::text[])) AS opt
  WHERE opt !~ '^security_invoker=';

  IF v_safe_reloptions IS NOT NULL
     AND pg_catalog.array_length(v_safe_reloptions, 1) > 0 THEN
    EXECUTE pg_catalog.format(
      'ALTER VIEW public.{view_name} SET (%s)',
      pg_catalog.array_to_string(v_safe_reloptions, ', ')
    );
  END IF;

{security_stmt}

  FOR v_acl IN"""
              section = replace_once(section, old, new, f'{view_name} security_invoker contract')
              return text[:start] + section + text[end:]

          sql = patch_restore_section(sql, 'DO $doctor_view_restore$', '$doctor_view_restore$;', 'vw_doctor_performance_real', False)
          sql = patch_restore_section(sql, 'DO $lead_audit_view_restore$', '$lead_audit_view_restore$;', 'vw_lead_traceability', True)
          p.write_text(sql)
          PY

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused contracts
        run: |
          npx vitest run \
            supabase/tests/meta-tenant-resolution-contract.test.mjs \
            supabase/tests/meta-provider-fact-clinic-canonical.test.mjs \
            supabase/tests/reply-delay-replay-contract.test.mjs \
            supabase/tests/source-to-cash-replay-contract.test.mjs \
            supabase/tests/canonical-reporting-pipeline-contract.test.mjs

      - name: Verify SQL guardrails
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'END;' supabase/migrations/20260902091000_reconcile_reply_delay_integer_contract.sql
          ! grep -Fq $'END\n$reply_delay_bridge$;' supabase/migrations/20260902091000_reconcile_reply_delay_integer_contract.sql
          grep -Fq 'ALTER VIEW public.source_to_cash SET (security_invoker = true);' supabase/migrations/20260902092000_reconcile_source_to_cash_contract.sql
          grep -Fq 'ALTER VIEW public.vw_doctor_performance_real RESET (security_invoker);' supabase/migrations/20260901160000_fix_reporting_canonical_sources.sql
          grep -Fq 'ALTER VIEW public.vw_lead_traceability SET (security_invoker = true);' supabase/migrations/20260901160000_fix_reporting_canonical_sources.sql

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/root-cause-hardening-once.yml
          git add \
            supabase/functions/api/index.ts \
            supabase/migrations/20260901160000_fix_reporting_canonical_sources.sql \
            supabase/migrations/20260902091000_reconcile_reply_delay_integer_contract.sql \
            supabase/migrations/20260902092000_reconcile_source_to_cash_contract.sql \
            .github/workflows/root-cause-hardening-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(meta): close tenant and replay root causes'
          git push origin HEAD:fix/meta-clinic-tenant-resolution-v2-20260902

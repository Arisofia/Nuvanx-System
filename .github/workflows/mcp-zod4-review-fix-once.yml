name: MCP Zod 4 Review Fix Once

on:
  push:
    branches:
      - refactor/mcp-zod4-native-schema-20260825
    paths:
      - '.github/workflows/mcp-zod4-review-fix-once.yml'

permissions:
  contents: write

jobs:
  fix-validate-commit:
    if: github.actor == 'Arisofia'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x
      - name: Apply verified review fix
        run: python3 .github/scripts/mcp-zod4-review-fix.py
      - name: Validate affected surface
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm test
          npm run validate:edge-deno
          npm run validate:workflows
          npm run secrets:scan
          deno check --config supabase/functions/mcp/deno.json supabase/functions/mcp/index.ts
          git diff --check
      - name: Commit permanent fix and remove one-shot tooling
        run: |
          set -euo pipefail
          git config user.name 'Nuvanx Engineering'
          git config user.email 'admin@nuvanx.com'
          git add supabase/functions/mcp/index.ts supabase/functions/mcp/zod4-native-schema-contract.test.mjs
          git rm .github/scripts/mcp-zod4-review-fix.py .github/workflows/mcp-zod4-review-fix-once.yml
          git diff --cached --check
          git commit -m 'fix(mcp): publish input-mode tool schemas'
          git push origin HEAD:refactor/mcp-zod4-native-schema-20260825

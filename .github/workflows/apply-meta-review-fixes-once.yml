name: Apply Meta Review Fixes Once

on:
  push:
    branches:
      - fix/meta-clinic-tenant-resolution-v2-20260902

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'Arisofia/Nuvanx-System' && github.ref == 'refs/heads/fix/meta-clinic-tenant-resolution-v2-20260902'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply review hardening
        run: python3 scripts/apply-meta-review-fixes.py

      - name: Verify review findings are addressed
        shell: bash
        run: |
          set -euo pipefail
          grep -F ".select('clinic_id').eq('id', userId).maybeSingle()" supabase/functions/api/index.ts
          grep -F "if (error) throw error;" supabase/functions/api/index.ts
          grep -F "integrationOwnerId = creds.integrationOwnerId" supabase/functions/api/index.ts
          grep -F "updateIntegrationStatus(adminClient, integrationOwnerId, integrationService" supabase/functions/api/index.ts
          if grep -Fq "updateIntegrationStatus(adminClient, userId, 'meta'" supabase/functions/api/index.ts; then
            echo "::error::Meta test route still updates requester-owned legacy integration"
            exit 1
          fi

      - name: Commit hardened source and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/apply-meta-review-fixes.py
          rm .github/workflows/apply-meta-review-fixes-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/api/index.ts supabase/tests/meta-tenant-resolution-contract.test.mjs scripts/apply-meta-review-fixes.py .github/workflows/apply-meta-review-fixes-once.yml
          git commit -m "fix(meta): fail closed on clinic lookup and update canonical owner"
          git push origin HEAD:fix/meta-clinic-tenant-resolution-v2-20260902

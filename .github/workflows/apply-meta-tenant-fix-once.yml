name: Apply Meta Tenant Fix Once

on:
  push:
    branches:
      - fix/meta-clinic-tenant-resolution-v2-20260902

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'Arisofia/Nuvanx-System' && github.ref == 'refs/heads/fix/meta-clinic-tenant-resolution-v2-20260902'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply backend tenant-safe resolver
        run: python3 scripts/apply-meta-tenant-fix.py

      - name: Restore strict trusted smoke from pre-478 source
        run: git show 3624ea01c42a8e01f8bb7256770240eb83315ce8:frontend/tests/smoke.playwright.ts > frontend/tests/smoke.playwright.ts

      - name: Verify intended contract before commit
        shell: bash
        run: |
          set -euo pipefail
          grep -F "async function resolveMetaIntegration" supabase/functions/api/index.ts
          grep -F "integrationsQuery.eq('clinic_id', requesterClinicId)" supabase/functions/api/index.ts
          grep -F ".eq('user_id', integrationOwnerId)" supabase/functions/api/index.ts
          if grep -Fq "DISPOSABLE_META_PROVIDER_PATHS" frontend/tests/smoke.playwright.ts; then
            echo "::error::Disposable provider allowlist still present"
            exit 1
          fi

      - name: Commit source fix and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/apply-meta-tenant-fix.py
          rm .github/workflows/apply-meta-tenant-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/api/index.ts frontend/tests/smoke.playwright.ts supabase/tests/meta-tenant-resolution-contract.test.mjs scripts/apply-meta-tenant-fix.py .github/workflows/apply-meta-tenant-fix-once.yml
          git commit -m "fix(meta): resolve canonical credentials by clinic tenant"
          git push origin HEAD:fix/meta-clinic-tenant-resolution-v2-20260902

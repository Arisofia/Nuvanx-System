# One-shot cleanup. Delete this workflow after the temporary functions are removed.
name: Cleanup Temporary Edge Functions Once

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-meta-probes-once.yml'

permissions:
  contents: read

jobs:
  cleanup:
    name: Delete verified temporary diagnostic functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: Production
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Delete temporary functions and verify absence
        uses: ./.github/actions/supabase-link-run
        with:
          project_ref: ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase_access_token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          skip_link: 'true'
          command: |
            set -euo pipefail

            temporary_functions=(
              meta-ads-admin-probe
              meta-ads-probe-once
              meta-credential-scope-probe
              meta-business-assignment-probe
              meta-assign-nuvanx-adaccount-once
              meta-business-pending-probe
              meta-ad-account-info-probe
              meta-runtime-credential-diagnostic
              github-repo-writer-once
              github-production-dispatch-once
            )

            before="$(supabase functions list --project-ref "$SUPABASE_PROJECT_REF")"
            printf '%s\n' "$before"

            for fn in "${temporary_functions[@]}"; do
              if printf '%s\n' "$before" | grep -Fq -- "$fn"; then
                echo "Deleting temporary function: $fn"
                supabase functions delete "$fn" --project-ref "$SUPABASE_PROJECT_REF" --yes
              else
                echo "Already absent: $fn"
              fi
            done

            after="$(supabase functions list --project-ref "$SUPABASE_PROJECT_REF")"
            printf '%s\n' "$after"

            remaining=0
            for fn in "${temporary_functions[@]}"; do
              if printf '%s\n' "$after" | grep -Fq -- "$fn"; then
                echo "::error::Temporary function still present after cleanup: $fn"
                remaining=1
              fi
            done

            if (( remaining != 0 )); then
              exit 1
            fi

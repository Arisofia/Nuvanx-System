# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: HubSpot Marketing Contact Monitor

on:
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-maintenance-deploy_edge
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh · HubSpot marketing contacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: Production
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NUVANX_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.NUVANX_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'

      - name: Validate monitor runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"
          [[ "$SUPABASE_URL" == https://*.supabase.co ]]

      - name: Refresh HubSpot marketing-contact monitor
        run: node scripts/refresh-hubspot-marketing-contact-monitor.js

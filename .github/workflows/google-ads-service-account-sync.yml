name: Google Ads Service Account Sync

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-google-ads-service-account.js'
      - 'scripts/sync-google-ads-service-account.test.js'
      - '.github/workflows/google-ads-service-account-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-ads-service-account-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Normalize and sync service account
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: Production
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GOOGLE_ADS_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_ADS_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          persist-credentials: false

      - name: Validate required inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_PROJECT_REF:-}"
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${GOOGLE_ADS_SERVICE_ACCOUNT:-}"

      - name: Verify normalization contract
        run: node --test scripts/sync-google-ads-service-account.test.js

      - name: Sync normalized service account to Supabase
        run: node scripts/sync-google-ads-service-account.js

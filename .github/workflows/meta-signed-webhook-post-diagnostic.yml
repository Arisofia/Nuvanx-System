# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: Meta Signed Webhook POST Diagnostic

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  signed-webhook-post:
    name: Diagnostic · signed leadgen POST path
    if: ${{ github.head_ref == 'diagnostic/meta-leadgen-subscription-20260820' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Send one signed synthetic leadgen notification
        env:
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = await import('node:crypto');

          const appSecret = String(process.env.META_APP_SECRET || '').trim();
          if (!appSecret) {
            console.error('META_SIGNED_POST_RESULT=ABORT_MISSING_APP_SECRET');
            process.exit(2);
          }

          const callbackUrl = 'https://ssvvuuysgxyqvmovrlvk.supabase.co/functions/v1/api/webhooks/meta';
          const fakeLeadgenId = '999999998260820001';
          const pageId = '685010274687129';
          const formId = '4479267692387105';
          const now = Math.floor(Date.now() / 1000);
          const payload = {
            object: 'page',
            entry: [{
              id: pageId,
              time: now,
              changes: [{
                field: 'leadgen',
                value: {
                  leadgen_id: fakeLeadgenId,
                  page_id: pageId,
                  form_id: formId,
                  created_time: now,
                },
              }],
            }],
          };

          const rawBody = JSON.stringify(payload);
          const digest = crypto.createHmac('sha256', appSecret).update(rawBody).digest('hex');
          const response = await fetch(callbackUrl, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-Hub-Signature-256': `sha256=${digest}`,
            },
            body: rawBody,
            signal: AbortSignal.timeout(30000),
          });
          const text = await response.text();

          console.log(`META_FAKE_LEADGEN_ID=${fakeLeadgenId}`);
          console.log(`META_SIGNED_POST_HTTP_STATUS=${response.status}`);
          console.log(`META_SIGNED_POST_BODY=${JSON.stringify(text)}`);

          if (response.status !== 200 || text !== 'ok') {
            console.error('META_SIGNED_POST_RESULT=FAIL');
            process.exit(3);
          }
          console.log('META_SIGNED_POST_RESULT=PASS');
          NODE

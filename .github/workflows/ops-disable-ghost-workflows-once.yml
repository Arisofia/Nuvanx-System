name: Disable retired workflow registrations once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ops-disable-ghost-workflows-once.yml

permissions:
  contents: read
  actions: write

jobs:
  disable-ghost-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Disable registrations with no current workflow owner
        shell: bash
        run: |
          set -Eeuo pipefail

          current_path='.github/workflows/ops-disable-ghost-workflows-once.yml'
          inventory="$(mktemp)"
          final_inventory="$(mktemp)"
          trap 'rm -f "$inventory" "$final_inventory"' EXIT

          gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" \
            --jq '.workflows[] | [.id,.path,.state,.name] | @tsv' > "$inventory"

          [[ -s "$inventory" ]] || { echo 'GHOST_WORKFLOW_RETIREMENT=FAIL reason=empty_inventory' >&2; exit 1; }

          current_id=''
          registered=0
          canonical=0
          ghost=0
          disabled_now=0
          already_disabled=0

          while IFS=$'\t' read -r id path state name; do
            [[ "$id" =~ ^[0-9]+$ ]] || { echo "GHOST_WORKFLOW_RETIREMENT=FAIL reason=invalid_id path=$path" >&2; exit 1; }
            registered=$((registered + 1))

            if [[ "$path" == "$current_path" ]]; then
              current_id="$id"
            fi

            if [[ -f "$path" ]]; then
              canonical=$((canonical + 1))
              if [[ "$state" != 'active' ]]; then
                echo "GHOST_WORKFLOW_RETIREMENT=FAIL reason=current_owner_not_active id=$id path=$path state=$state" >&2
                exit 1
              fi
              continue
            fi

            ghost=$((ghost + 1))
            if [[ "$state" == 'active' ]]; then
              echo "Disabling retired registration id=$id path=$path name=$name"
              gh api --method PUT \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/${id}/disable" >/dev/null
              disabled_now=$((disabled_now + 1))
            else
              already_disabled=$((already_disabled + 1))
            fi
          done < "$inventory"

          [[ -n "$current_id" ]] || { echo 'GHOST_WORKFLOW_RETIREMENT=FAIL reason=current_registration_missing' >&2; exit 1; }

          gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" \
            --jq '.workflows[] | [.id,.path,.state,.name] | @tsv' > "$final_inventory"

          residual_active_ghosts=0
          while IFS=$'\t' read -r id path state name; do
            if [[ ! -f "$path" && "$state" == 'active' ]]; then
              echo "Residual active ghost id=$id path=$path name=$name" >&2
              residual_active_ghosts=$((residual_active_ghosts + 1))
            fi
          done < "$final_inventory"

          [[ "$residual_active_ghosts" -eq 0 ]] || {
            echo "GHOST_WORKFLOW_RETIREMENT=FAIL reason=residual_active_ghosts count=$residual_active_ghosts" >&2
            exit 1
          }

          # Retire this one-shot registration only after all other checks pass.
          gh api --method PUT \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/${current_id}/disable" >/dev/null

          echo "GHOST_WORKFLOW_RETIREMENT=PASS registered=$registered current_owners=$canonical ghosts=$ghost disabled_now=$disabled_now already_disabled=$already_disabled self_disabled=1"

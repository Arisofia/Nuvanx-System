# Temporary one-shot read-only topology probe. Delete after evidence is persisted.
name: Meta Topology Inspect Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meta-topology-inspect-once.yml'

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect canonical Meta topology read-only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: Production
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NUVANX_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.NUVANX_SUPABASE_SERVICE_ROLE_KEY }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      META_REPORTING_TOKEN_60D: ${{ secrets.META_REPORTING_TOKEN_60D }}
      TARGET_AD_ACCOUNT_ID: act_718120894191565
      OLD_BUSINESS_ID: '878822511043717'
      CANONICAL_BUSINESS_ID: '897835716596010'
      CANONICAL_APP_ID: '1836302544001572'
      CANONICAL_SYSTEM_USER_ID: '61593654929650'
      CANONICAL_PAGE_ID: '1329458703573874'
      CANONICAL_IG_ID: '17841474094610850'
      CANONICAL_WABA_ID: '4380854058795406'
    steps:
      - name: Probe connected and reporting credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -n "${ENCRYPTION_KEY:-}"
          test -n "${META_REPORTING_TOKEN_60D:-}"
          node <<'NODE'
          const crypto = require('crypto');

          const base = String(process.env.SUPABASE_URL || '').replace(/\/$/, '');
          const service = String(process.env.SUPABASE_SERVICE_ROLE_KEY || '').trim();
          const encryptionKey = String(process.env.ENCRYPTION_KEY || '');
          const reportingToken = String(process.env.META_REPORTING_TOKEN_60D || '').trim();
          const account = String(process.env.TARGET_AD_ACCOUNT_ID || '').trim();
          const oldBusiness = String(process.env.OLD_BUSINESS_ID || '').trim();
          const canonicalBusiness = String(process.env.CANONICAL_BUSINESS_ID || '').trim();
          const canonicalApp = String(process.env.CANONICAL_APP_ID || '').trim();
          const canonicalSystemUser = String(process.env.CANONICAL_SYSTEM_USER_ID || '').trim();
          const canonicalPage = String(process.env.CANONICAL_PAGE_ID || '').trim();
          const canonicalIg = String(process.env.CANONICAL_IG_ID || '').trim();
          const canonicalWaba = String(process.env.CANONICAL_WABA_ID || '').trim();
          const graph = 'https://graph.facebook.com/v22.0';

          function decryptCredential(encoded) {
            const parts = String(encoded || '').split(':');
            if (parts.length !== 4) throw new Error('Malformed encrypted Meta credential');
            const [saltHex, ivHex, tagHex, ciphertextHex] = parts;
            const salt = Buffer.from(saltHex, 'hex');
            const iv = Buffer.from(ivHex, 'hex');
            const tag = Buffer.from(tagHex, 'hex');
            const ciphertext = Buffer.from(ciphertextHex, 'hex');
            const key = crypto.pbkdf2Sync(encryptionKey, salt, 100000, 32, 'sha256');
            const decipher = crypto.createDecipheriv('aes-256-gcm', key, iv);
            decipher.setAuthTag(tag);
            return Buffer.concat([decipher.update(ciphertext), decipher.final()]).toString('utf8');
          }

          async function sb(path, init = {}) {
            const response = await fetch(`${base}/rest/v1/${path}`, {
              ...init,
              headers: { apikey: service, Authorization: `Bearer ${service}`, ...(init.headers || {}) },
              signal: AbortSignal.timeout(20000),
            });
            if (!response.ok) throw new Error(`Supabase REST ${response.status}`);
            return response.status === 204 ? null : await response.json();
          }

          async function meta(token, path, params = {}) {
            const url = new URL(`${graph}${path}`);
            url.searchParams.set('access_token', token);
            for (const [key, value] of Object.entries(params)) {
              if (value !== undefined && value !== null && value !== '') url.searchParams.set(key, String(value));
            }
            const response = await fetch(url, { signal: AbortSignal.timeout(25000) });
            const body = await response.json().catch(() => ({}));
            if (!response.ok || body?.error) {
              const e = body?.error || {};
              return { ok: false, status: response.status, error: { code: e.code ?? null, subcode: e.error_subcode ?? null, type: e.type ?? null, message: String(e.message || `Meta ${response.status}`).slice(0, 500) } };
            }
            return { ok: true, status: response.status, data: body };
          }

          async function probe(label, token) {
            const result = { label };
            result.identity = await meta(token, '/me', { fields: 'id,name' });
            result.permissions = await meta(token, '/me/permissions');
            result.debug_self = await meta(token, '/debug_token', { input_token: token });
            result.app_alias = await meta(token, '/app', { fields: 'id,name' });
            result.me_adaccounts = await meta(token, '/me/adaccounts', { fields: 'id,name,account_status,currency,timezone_name', limit: 100 });
            result.target_minimal = await meta(token, `/${account}`, { fields: 'id,name,account_status,currency,timezone_name' });
            result.target_business = await meta(token, `/${account}`, { fields: 'id,name,account_status,business' });
            result.target_campaigns = await meta(token, `/${account}/campaigns`, { fields: 'id,name,status,effective_status,objective,created_time,updated_time', limit: 500 });
            result.old_business = await meta(token, `/${oldBusiness}`, { fields: 'id,name' });
            result.old_owned_ad_accounts = await meta(token, `/${oldBusiness}/owned_ad_accounts`, { fields: 'id,name,account_status', limit: 100 });
            result.old_client_ad_accounts = await meta(token, `/${oldBusiness}/client_ad_accounts`, { fields: 'id,name,account_status', limit: 100 });
            result.old_system_users = await meta(token, `/${oldBusiness}/system_users`, { fields: 'id,name,role', limit: 100 });
            result.canonical_business = await meta(token, `/${canonicalBusiness}`, { fields: 'id,name' });
            result.canonical_owned_ad_accounts = await meta(token, `/${canonicalBusiness}/owned_ad_accounts`, { fields: 'id,name,account_status', limit: 100 });
            result.canonical_client_ad_accounts = await meta(token, `/${canonicalBusiness}/client_ad_accounts`, { fields: 'id,name,account_status', limit: 100 });
            result.canonical_system_users = await meta(token, `/${canonicalBusiness}/system_users`, { fields: 'id,name,role', limit: 100 });
            result.canonical_app = await meta(token, `/${canonicalApp}`, { fields: 'id,name' });
            result.canonical_system_user = await meta(token, `/${canonicalSystemUser}`, { fields: 'id,name' });
            result.canonical_page = await meta(token, `/${canonicalPage}`, { fields: 'id,name' });
            result.canonical_instagram = await meta(token, `/${canonicalIg}`, { fields: 'id,username,name' });
            result.canonical_waba = await meta(token, `/${canonicalWaba}`, { fields: 'id,name,currency,timezone_id' });
            return result;
          }

          const integrations = await sb('integrations?service=eq.meta&status=eq.connected&select=user_id,metadata&order=updated_at.desc&limit=1');
          const integration = integrations?.[0];
          if (!integration?.user_id) throw new Error('Connected Meta integration owner missing');
          const credentials = await sb(`credentials?service=eq.meta&user_id=eq.${encodeURIComponent(integration.user_id)}&select=encrypted_key&limit=1`);
          const encrypted = credentials?.[0]?.encrypted_key;
          if (!encrypted) throw new Error('Connected Meta credential missing');
          const connectedToken = decryptCredential(encrypted);

          const result = {
            expected: {
              target_account: account,
              old_business: oldBusiness,
              canonical_business: canonicalBusiness,
              canonical_app: canonicalApp,
              canonical_system_user: canonicalSystemUser,
              canonical_page: canonicalPage,
              canonical_instagram: canonicalIg,
              canonical_waba: canonicalWaba,
            },
            integration_metadata: integration.metadata || {},
            connected_runtime_token: await probe('connected_runtime_token', connectedToken),
            reporting_token_60d: await probe('reporting_token_60d', reportingToken),
          };

          await sb('agent_outputs', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Prefer: 'return=minimal' },
            body: JSON.stringify({
              user_id: integration.user_id,
              agent_type: 'meta-canonical-topology-probe-20260824',
              input_context: result.expected,
              output_text: JSON.stringify(result),
              model_used: 'github-actions-meta-topology-probe-v1',
              status: 'completed',
              output: result,
              metadata: { source: 'github_actions', read_only: true, one_time: true, graph_version: 'v22.0' },
            }),
          });
          console.log('META_CANONICAL_TOPOLOGY_PROBE=PASS');
          NODE

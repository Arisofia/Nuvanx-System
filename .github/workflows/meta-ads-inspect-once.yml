# Temporary one-shot read-only hierarchy probe for the existing Meta reporting credential.
name: Meta Ads Inspect Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meta-ads-inspect-once.yml'

permissions:
  contents: read

jobs:
  inspect:
    name: Enumerate target Meta hierarchy read-only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: Production
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NUVANX_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.NUVANX_SUPABASE_SERVICE_ROLE_KEY }}
      META_REPORTING_TOKEN_60D: ${{ secrets.META_REPORTING_TOKEN_60D }}
      TARGET_AD_ACCOUNT_ID: act_718120894191565
    steps:
      - name: Enumerate campaign, ad set and ad hierarchy
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -n "${META_REPORTING_TOKEN_60D:-}"
          node <<'NODE'
          const base = String(process.env.SUPABASE_URL || '').replace(/\/$/, '');
          const service = String(process.env.SUPABASE_SERVICE_ROLE_KEY || '').trim();
          const token = String(process.env.META_REPORTING_TOKEN_60D || '').trim();
          const account = String(process.env.TARGET_AD_ACCOUNT_ID || '').trim();
          const graph = 'https://graph.facebook.com/v22.0';

          async function meta(path, params = {}) {
            const url = new URL(`${graph}${path}`);
            url.searchParams.set('access_token', token);
            for (const [key, value] of Object.entries(params)) url.searchParams.set(key, String(value));
            const response = await fetch(url, { signal: AbortSignal.timeout(25000) });
            const body = await response.json().catch(() => ({}));
            if (!response.ok || body?.error) {
              const e = body?.error || {};
              return { ok: false, status: response.status, error: { code: e.code ?? null, subcode: e.error_subcode ?? null, type: e.type ?? null, message: String(e.message || `Meta ${response.status}`).slice(0, 500) } };
            }
            return { ok: true, status: response.status, data: body };
          }

          async function sb(path, init = {}) {
            const response = await fetch(`${base}/rest/v1/${path}`, {
              ...init,
              headers: { apikey: service, Authorization: `Bearer ${service}`, ...(init.headers || {}) },
            });
            if (!response.ok) throw new Error(`Supabase REST ${response.status}`);
            return response.status === 204 ? null : await response.json();
          }

          const integrations = await sb('integrations?service=eq.meta&status=eq.connected&select=user_id&order=updated_at.desc&limit=1');
          const userId = integrations?.[0]?.user_id;
          if (!userId) throw new Error('Connected Meta integration owner missing');

          const result = {
            account: await meta(`/${account}`, { fields: 'id,name,account_status,currency,timezone_name' }),
            campaigns: await meta(`/${account}/campaigns`, {
              fields: 'id,name,status,effective_status,objective,buying_type,daily_budget,lifetime_budget,bid_strategy,created_time,updated_time',
              limit: 500,
            }),
            adsets: await meta(`/${account}/adsets`, {
              fields: 'id,name,status,effective_status,campaign_id,daily_budget,lifetime_budget,billing_event,optimization_goal,bid_strategy,bid_amount,attribution_spec,start_time,end_time,created_time,updated_time',
              limit: 500,
            }),
            ads: await meta(`/${account}/ads`, {
              fields: 'id,name,status,effective_status,campaign_id,adset_id,creative{id,name,effective_object_story_id},created_time,updated_time',
              limit: 500,
            }),
          };

          await sb('agent_outputs', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Prefer: 'return=minimal' },
            body: JSON.stringify({
              user_id: userId,
              agent_type: 'meta-target-hierarchy-probe',
              input_context: { account_id: account },
              output_text: JSON.stringify(result),
              model_used: 'github-actions-meta-hierarchy-probe-v1',
              status: 'completed',
              output: result,
              metadata: { source: 'github_actions', read_only: true, one_time: true, graph_version: 'v22.0' },
            }),
          });
          console.log('META_TARGET_HIERARCHY_PROBE=PASS');
          NODE

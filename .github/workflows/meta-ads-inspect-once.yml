# One-shot read-only inspection for the explicitly selected Meta Ads objects.
# Probe v2 uses internal service-role authentication inside the Edge Function.
name: Meta Ads Inspect Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meta-ads-inspect-once.yml'

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect selected Meta Ads objects once
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: Production
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NUVANX_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.NUVANX_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Invoke protected Supabase Meta Ads probe
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "${SUPABASE_URL%/}/functions/v1/meta-ads-admin-probe")"
          printf '%s\n' "$response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(j.success!==true||j.persisted!==true)process.exit(1);console.log('META_ADS_ADMIN_PROBE=PASS')})"

name: Patch Canonical Meta Stack Once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/meta-stack-separation-rsv26-20260824'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout target branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/meta-stack-separation-rsv26-20260824
          persist-credentials: true
          fetch-depth: 0

      - name: Apply surgical Meta stack separation patch
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('supabase/functions/api/index.ts')
          source = path.read_text()

          if "const META_CANONICAL_APP_SECRET" in source:
              print('Canonical Meta stack patch already applied; nothing to do.')
              raise SystemExit(0)

          original = source

          anchor = "const LEAD_TRACEABILITY_VIEW = 'vw_lead_traceability';"
          insert = """const LEAD_TRACEABILITY_VIEW = 'vw_lead_traceability';
          const META_CANONICAL_APP_SECRET = Deno.env.get('META_CANONICAL_APP_SECRET') ?? Deno.env.get('META_REPORTING_APP_SECRET') ?? '';

          function metaIntegrationPageIds(metadata: any): string[] {
            const values = [
              metadata?.pageId,
              metadata?.page_id,
              ...(Array.isArray(metadata?.pageIds) ? metadata.pageIds : []),
              ...(Array.isArray(metadata?.page_ids) ? metadata.page_ids : []),
            ];
            return [...new Set(values.map((value) => String(value ?? '').trim()).filter(Boolean))];
          }

          function metaAppSecretForService(service: string): string | null | undefined {
            return service === 'meta_ads' ? META_CANONICAL_APP_SECRET : META_APP_SECRET;
          }"""
          if anchor not in source:
              raise SystemExit('missing anchor: LEAD_TRACEABILITY_VIEW')
          source = source.replace(anchor, insert, 1)

          old_sig = "export async function metaFetch(path: string, params: Record<string, string>, token: string) {"
          new_sig = "export async function metaFetch(path: string, params: Record<string, string>, token: string, appSecretOverride?: string | null) {"
          if old_sig not in source:
              raise SystemExit('missing anchor: metaFetch signature')
          source = source.replace(old_sig, new_sig, 1)

          meta_start = source.index(new_sig)
          secret_pos = source.index('  const appSecret = META_APP_SECRET;', meta_start)
          source = source[:secret_pos] + "  const appSecret = appSecretOverride === undefined ? META_APP_SECRET : appSecretOverride;" + source[secret_pos + len('  const appSecret = META_APP_SECRET;'):]

          pattern = re.compile(r"async function processMetaLeadChange\(adminClient: any, change: any\): Promise<void> \{.*?\n\}\n\n(?=/\*\*\n \* Fire CAPI Lead)", re.S)
          replacement = r'''async function processMetaLeadChange(adminClient: any, change: any): Promise<void> {
            if (change.field !== 'leadgen') return;
            const val = change.value ?? {};
            const { leadgen_id, page_id } = val;
            if (!leadgen_id) return;

            const { data: intgs } = await adminClient.from('integrations')
              .select('user_id, service, metadata')
              .in('service', ['meta', 'meta_ads'])
              .eq('status', 'connected');

            const connected = intgs ?? [];
            let matchingIntg = connected.find((integration: any) =>
              metaIntegrationPageIds(integration?.metadata ?? {}).includes(String(page_id ?? '').trim())
            );

            if (matchingIntg == null) {
              const withoutPageRouting = connected.filter(
                (integration: any) => metaIntegrationPageIds(integration?.metadata ?? {}).length === 0,
              );
              if (withoutPageRouting.length === 1 && connected.length === 1) {
                matchingIntg = withoutPageRouting[0];
              }
            }

            if (matchingIntg == null) {
              console.warn('[meta-webhook] No connected integration matches incoming page_id', { page_id, leadgen_id });
              return;
            }

            const webhookUserId = matchingIntg.user_id;
            const credentialService = matchingIntg.service === 'meta_ads' ? 'meta_ads' : 'meta';
            const intgMetadata = matchingIntg.metadata ?? {};
            const pixelId = intgMetadata.pixelId ?? intgMetadata.pixel_id ?? '';

            const { data: credRow } = await adminClient.from('credentials')
              .select('encrypted_key')
              .eq('user_id', webhookUserId)
              .eq('service', credentialService)
              .single();
            if (!credRow) {
              console.warn('[meta-webhook] Matching integration has no credential', { page_id, credentialService });
              return;
            }

            let accessToken: string;
            try {
              accessToken = await publicRouteHelpers.decryptCred(credRow.encrypted_key);
            } catch {
              return;
            }

            let leadData: any;
            try {
              leadData = await publicRouteHelpers.metaFetch(`/${leadgen_id}`, {
                fields: 'field_data,created_time,ad_id,ad_name,form_id,form_name,campaign_id,campaign_name,adset_id,adset_name,page_id,is_organic,platform',
              }, accessToken, metaAppSecretForService(credentialService));
            } catch (error) {
              console.warn('[meta-webhook] Lead retrieval failed', {
                page_id,
                credentialService,
                error: maskSensitive(error),
              });
              return;
            }

            const leadId = await publicRouteHelpers.processLeadData(adminClient, webhookUserId, leadData);
            await fireMetaLeadCapi(accessToken, leadgen_id, leadData, pixelId, leadId);
          }

          '''
          source, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'processMetaLeadChange replacement count={count}')

          handler_anchor = 'async function handleMetaWebhookPost(ctx: PublicRouteContext): Promise<Response | null> {'
          signature_helper = r'''async function metaWebhookSignatureMatches(rawBody: string, signature: string, secret: string): Promise<boolean> {
            if (!secret || !signature) return false;
            const enc = new TextEncoder();
            const key = await crypto.subtle.importKey(
              'raw', enc.encode(secret), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign'],
            );
            const sig = await crypto.subtle.sign('HMAC', key, enc.encode(rawBody));
            const expectedSig = 'sha256=' + Array.from(new Uint8Array(sig))
              .map((b) => b.toString(16).padStart(2, '0')).join('');
            return signature === expectedSig;
          }

          '''
          if handler_anchor not in source:
              raise SystemExit('missing anchor: handleMetaWebhookPost')
          source = source.replace(handler_anchor, signature_helper + handler_anchor, 1)

          old_block = r'''  const appSecret = META_APP_SECRET;
            const rawBody = await req.text();

            if (!appSecret && !IS_DEVELOPMENT) {
              return new Response('Meta App Secret not configured', { status: 500 });
            }

            if (appSecret) {
              const signature = req.headers.get('X-Hub-Signature-256') ?? '';
              const enc = new TextEncoder();
              const key = await crypto.subtle.importKey(
                'raw', enc.encode(appSecret), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign'],
              );
              const sig = await crypto.subtle.sign('HMAC', key, enc.encode(rawBody));
              const expectedSig = 'sha256=' + Array.from(new Uint8Array(sig)).map((b) => b.toString(16).padStart(2, '0')).join('');
              if (signature !== expectedSig) return new Response('Unauthorized', { status: 403 });
            }
          '''
          # indentation in source is two spaces, not twelve; normalize literal before match
          old_block = '\n'.join(line[10:] if line.startswith('          ') else line for line in old_block.splitlines())
          if old_block not in source:
              raise SystemExit('missing anchor: legacy webhook signature block')

          new_block = r'''  const rawBody = await req.text();
            const signature = req.headers.get('X-Hub-Signature-256') ?? '';
            const configuredSecrets = [META_APP_SECRET, META_CANONICAL_APP_SECRET]
              .filter((secret): secret is string => Boolean(secret));

            if (configuredSecrets.length === 0 && !IS_DEVELOPMENT) {
              return new Response('Meta App Secret not configured', { status: 500 });
            }

            if (configuredSecrets.length > 0) {
              const checks = await Promise.all(
                configuredSecrets.map((secret) => metaWebhookSignatureMatches(rawBody, signature, secret)),
              );
              if (!checks.some(Boolean)) return new Response('Unauthorized', { status: 403 });
            }
          '''
          new_block = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_block.splitlines())
          source = source.replace(old_block, new_block, 1)

          if source == original:
              raise SystemExit('patch produced no changes')
          path.write_text(source)

          test_path = Path('supabase/functions/api/meta-stack-separation.test.mjs')
          test_path.write_text("""import { describe, expect, it } from 'vitest';
          import { readFileSync } from 'node:fs';
          import { fileURLToPath } from 'node:url';

          const source = readFileSync(fileURLToPath(new URL('./index.ts', import.meta.url)), 'utf8');

          describe('Meta canonical/legacy stack separation', () => {
            it('routes lead webhooks across legacy and canonical services', () => {
              expect(source).toContain(".in('service', ['meta', 'meta_ads'])");
              expect(source).toContain('metaIntegrationPageIds');
              expect(source).toContain("credentialService = matchingIntg.service === 'meta_ads' ? 'meta_ads' : 'meta'");
            });

            it('supports legacy and canonical app secrets', () => {
              expect(source).toContain('META_CANONICAL_APP_SECRET');
              expect(source).toContain('metaWebhookSignatureMatches');
              expect(source).toContain('[META_APP_SECRET, META_CANONICAL_APP_SECRET]');
            });

            it('uses the matching app secret for canonical lead retrieval', () => {
              expect(source).toContain('metaAppSecretForService(credentialService)');
              expect(source).toContain('appSecretOverride === undefined ? META_APP_SECRET : appSecretOverride');
            });
          });
          """.replace('          ', ''))

          print(f'Patched {path}; delta={len(source)-len(original)} bytes')

      - name: Validate focused tests and type-check
        shell: bash
        run: |
          set -euo pipefail
          npm install --include=dev --ignore-scripts --legacy-peer-deps
          npm exec vitest run supabase/functions/api/meta-stack-separation.test.mjs
          deno check --config=supabase/functions/deno.json supabase/functions/api/index.ts

      - name: Commit patch to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/api/index.ts supabase/functions/api/meta-stack-separation.test.mjs
          git commit -m 'fix(meta): separate canonical RSV26 stack'
          git push origin HEAD:fix/meta-stack-separation-rsv26-20260824

name: Patch Meta Persisted Reads Once

on:
  push:
    branches:
      - fix/meta-clinic-tenant-resolution-v2-20260902
    paths:
      - .github/workflows/patch-meta-persisted-reads-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/meta-clinic-tenant-resolution-v2-20260902
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact Meta persisted-read patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('supabase/functions/api/index.ts')
          source = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one source match, found {count}')
              source = source.replace(old, new, 1)

          replace_once(
              """  const { integration: integ, requesterClinicId } = await resolveMetaIntegration(adminClient, userId, '');\n  const meta = (integ?.metadata ?? {}) as Record<string, any>;\n  const pageId = meta.pageId ?? meta.page_id ?? null;\n""",
              """  const { integration: integ, requesterClinicId } = await resolveMetaIntegration(adminClient, userId, '');\n  if (!integ || !requesterClinicId) {\n    return sendJson({ success: false, message: 'Meta Ads not connected' }, 400);\n  }\n  const meta = (integ.metadata ?? {}) as Record<string, any>;\n  const pageId = meta.pageId ?? meta.page_id ?? null;\n""",
              'organic clinic-required guard',
          )

          replace_once(
              """    let query = adminClient\n      .from('meta_post_performance')\n      .select('post_id, created_time, message, status_type, permalink_url, impressions, reach, engaged_users, reactions, comments, shares, video_views, is_video, updated_at')\n      .eq('page_id', pageId)\n      .order('created_time', { ascending: false })\n      .order('updated_at', { ascending: false })\n      .limit(Math.min(limit * 5, 1000));\n    query = applyClinicOrUserScope(query, requesterClinicId, userId);\n    if (keyword) query = query.ilike('message', `%${keyword}%`);\n    const { data, error } = await query;\n    if (error) return sendJson({ success: false, message: error.message }, 500);\n    const uniquePostsMap = new Map();\n    for (const p of (data ?? [])) {\n      if (!uniquePostsMap.has(p.post_id)) {\n        uniquePostsMap.set(p.post_id, p);\n        if (uniquePostsMap.size >= limit) break;\n      }\n    }\n    const posts = Array.from(uniquePostsMap.values());\n""",
              """    const pageSize = 200;\n    const uniquePostsMap = new Map();\n    for (let offset = 0; uniquePostsMap.size < limit; offset += pageSize) {\n      let query = adminClient\n        .from('meta_post_performance')\n        .select('post_id, created_time, message, status_type, permalink_url, impressions, reach, engaged_users, reactions, comments, shares, video_views, is_video, updated_at')\n        .eq('page_id', pageId)\n        .eq('clinic_id', requesterClinicId)\n        .order('created_time', { ascending: false })\n        .order('updated_at', { ascending: false })\n        .range(offset, offset + pageSize - 1);\n      if (keyword) query = query.ilike('message', `%${keyword}%`);\n      const { data, error } = await query;\n      if (error) return sendJson({ success: false, message: error.message }, 500);\n      const page = data ?? [];\n      for (const p of page) {\n        if (!uniquePostsMap.has(p.post_id)) {\n          uniquePostsMap.set(p.post_id, p);\n          if (uniquePostsMap.size >= limit) break;\n        }\n      }\n      if (page.length < pageSize) break;\n    }\n    const posts = Array.from(uniquePostsMap.values());\n""",
              'organic deterministic pagination',
          )

          replace_once(
              """  query = applyClinicOrUserScope(query, requesterClinicId, userId);\n  const { data: rows, error } = await query;\n""",
              """  query = query.eq('clinic_id', requesterClinicId);\n  const { data: rows, error } = await query;\n""",
              'organic daily clinic scope',
          )

          replace_once(
              """  const { integration: integ, requesterClinicId } = await resolveMetaIntegration(adminClient, userId, '');\n  const meta = (integ?.metadata ?? {}) as Record<string, any>;\n  let igId: string | null = meta.igBusinessAccountId ?? meta.ig_business_account_id ?? null;\n""",
              """  const { integration: integ, requesterClinicId } = await resolveMetaIntegration(adminClient, userId, '');\n  if (!integ || !requesterClinicId) {\n    return sendJson({ success: false, message: 'Meta Ads not connected' }, 400);\n  }\n  const meta = (integ.metadata ?? {}) as Record<string, any>;\n  let igId: string | null = meta.igBusinessAccountId ?? meta.ig_business_account_id ?? null;\n""",
              'instagram clinic-required guard',
          )

          replace_once(
              """    let igDiscoverQuery = adminClient.from('meta_ig_account_daily')\n      .select('ig_id')\n      .limit(1);\n    igDiscoverQuery = applyClinicOrUserScope(igDiscoverQuery, requesterClinicId, userId);\n""",
              """    let igDiscoverQuery = adminClient.from('meta_ig_account_daily')\n      .select('ig_id')\n      .eq('clinic_id', requesterClinicId)\n      .limit(1);\n""",
              'instagram discovery clinic scope',
          )

          replace_once(
              """    let query = adminClient\n      .from('meta_ig_media_performance')\n      .select('media_id, media_type, media_product_type, caption, permalink, timestamp, reach, views, likes, comments, shares, saved, total_interactions, updated_at')\n      .eq('ig_id', igId)\n      .order('timestamp', { ascending: false })\n      .order('updated_at', { ascending: false })\n      .limit(Math.min(limit * 5, 1000));\n    query = applyClinicOrUserScope(query, requesterClinicId, userId);\n    if (keyword) query = query.ilike('caption', `%${keyword}%`);\n    const { data, error } = await query;\n    if (error) return sendJson({ success: false, message: error.message }, 500);\n    const uniquePostsMap = new Map();\n    for (const p of (data ?? [])) {\n      if (!uniquePostsMap.has(p.media_id)) {\n        uniquePostsMap.set(p.media_id, p);\n        if (uniquePostsMap.size >= limit) break;\n      }\n    }\n    const posts = Array.from(uniquePostsMap.values());\n""",
              """    const pageSize = 200;\n    const uniquePostsMap = new Map();\n    for (let offset = 0; uniquePostsMap.size < limit; offset += pageSize) {\n      let query = adminClient\n        .from('meta_ig_media_performance')\n        .select('media_id, media_type, media_product_type, caption, permalink, timestamp, reach, views, likes, comments, shares, saved, total_interactions, updated_at')\n        .eq('ig_id', igId)\n        .eq('clinic_id', requesterClinicId)\n        .order('timestamp', { ascending: false })\n        .order('updated_at', { ascending: false })\n        .range(offset, offset + pageSize - 1);\n      if (keyword) query = query.ilike('caption', `%${keyword}%`);\n      const { data, error } = await query;\n      if (error) return sendJson({ success: false, message: error.message }, 500);\n      const page = data ?? [];\n      for (const p of page) {\n        if (!uniquePostsMap.has(p.media_id)) {\n          uniquePostsMap.set(p.media_id, p);\n          if (uniquePostsMap.size >= limit) break;\n        }\n      }\n      if (page.length < pageSize) break;\n    }\n    const posts = Array.from(uniquePostsMap.values());\n""",
              'instagram deterministic pagination',
          )

          ig_handler_start = source.index('async function handleMetaIgGet')
          ig_handler_end = source.index('function parseMetaBackfillDates', ig_handler_start)
          if ig_handler_start < 0 or ig_handler_end <= ig_handler_start:
              raise SystemExit('instagram handler markers not found')
          ig_handler = source[ig_handler_start:ig_handler_end]
          old_scope = "  query = applyClinicOrUserScope(query, requesterClinicId, userId);\n  const { data: rows, error } = await query;"
          if ig_handler.count(old_scope) != 1:
              raise SystemExit(f'instagram daily clinic scope: expected one match, found {ig_handler.count(old_scope)}')
          ig_handler = ig_handler.replace(
              old_scope,
              "  query = query.eq('clinic_id', requesterClinicId);\n  const { data: rows, error } = await query;",
              1,
          )
          source = source[:ig_handler_start] + ig_handler + source[ig_handler_end:]

          path.write_text(source)

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Meta tenant regression contract
        run: npx vitest run supabase/tests/meta-tenant-resolution-contract.test.mjs

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-meta-persisted-reads-once.yml
          git add supabase/functions/api/index.ts .github/workflows/patch-meta-persisted-reads-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(meta): harden persisted read tenancy and pagination'
          git push origin HEAD:fix/meta-clinic-tenant-resolution-v2-20260902

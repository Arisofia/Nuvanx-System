# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: Meta Business Effective Admin Diagnostic

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  business-users:
    name: Read-only · effective business users
    if: ${{ github.head_ref == 'diagnostic/meta-leadgen-subscription-20260820' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect Business users and system users
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = await import('node:crypto');
          const graphVersion = 'v22.0';
          const businessId = '878822511043717';
          const token = String(process.env.META_ACCESS_TOKEN || '').trim();
          const appId = String(process.env.META_APP_ID || '').trim();
          const appSecret = String(process.env.META_APP_SECRET || '').trim();
          if (!token || !appId || !appSecret) process.exit(2);
          const proof = crypto.createHmac('sha256', appSecret).update(token).digest('hex');

          async function get(path, params = {}) {
            const url = new URL(`https://graph.facebook.com/${graphVersion}${path}`);
            for (const [k, v] of Object.entries(params)) url.searchParams.set(k, String(v));
            url.searchParams.set('access_token', token);
            url.searchParams.set('appsecret_proof', proof);
            const res = await fetch(url, { method: 'GET', headers: { Accept: 'application/json' }, signal: AbortSignal.timeout(20000) });
            const body = await res.json().catch(() => ({}));
            if (!res.ok || body?.error) {
              const e = body?.error || {};
              throw new Error(`http=${res.status} code=${e.code ?? 'unknown'} message=${String(e.message || 'Graph error').replace(/[A-Za-z0-9_-]{32,}/g, '[masked]')}`);
            }
            return body;
          }

          function maskedEmail(email) {
            const value = String(email || '');
            const at = value.indexOf('@');
            if (at < 1) return value ? '[present]' : '';
            return `${value[0]}***@${value.slice(at + 1)}`;
          }

          async function probeUsers(path, label) {
            const fieldSets = ['id,name,email,role,status', 'id,name,role,status', 'id,name'];
            for (const fields of fieldSets) {
              try {
                const body = await get(path, { fields, limit: '100' });
                const rows = Array.isArray(body?.data) ? body.data : [];
                console.log(`${label}_STATUS=OK`);
                console.log(`${label}_COUNT=${rows.length}`);
                for (const row of rows) {
                  const email = String(row?.email || '');
                  console.log(`${label}_USER id=${String(row?.id || '')} name=${JSON.stringify(String(row?.name || ''))} role=${JSON.stringify(row?.role ?? null)} status=${JSON.stringify(row?.status ?? null)} email=${JSON.stringify(maskedEmail(email))} is_info_nuvanx=${email.toLowerCase() === 'info@nuvanx.com'}`);
                }
                return;
              } catch (error) {
                console.log(`${label}_FIELDS_${fields.replaceAll(',', '_')}_ERROR=${String(error.message || error)}`);
              }
            }
            console.log(`${label}_STATUS=UNAVAILABLE`);
          }

          console.log(`META_BUSINESS_ID=${businessId}`);
          await probeUsers(`/${businessId}/business_users`, 'META_BUSINESS_USERS');
          await probeUsers(`/${businessId}/system_users`, 'META_SYSTEM_USERS');
          await probeUsers(`/${businessId}/pending_users`, 'META_PENDING_USERS');
          console.log('META_BUSINESS_ADMIN_DIAG_STATUS=COMPLETE_READ_ONLY');
          NODE

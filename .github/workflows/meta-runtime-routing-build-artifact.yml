name: Meta Runtime Routing Commit Once

on:
  push:
    branches:
      - fix/meta-runtime-routing-20260824
    paths:
      - '.github/workflows/meta-runtime-routing-build-artifact.yml'
      - 'supabase/functions/web-events/index.test.mjs'

permissions:
  contents: write

concurrency:
  group: meta-runtime-routing-commit-once
  cancel-in-progress: false

jobs:
  patch-validate-commit:
    if: github.actor == 'Arisofia'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Bind to expected branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'fix/meta-runtime-routing-20260824'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x

      - name: Apply deterministic runtime patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/meta-runtime-routing-commit.py
          git diff --check
          git diff -- supabase/functions/api/index.ts supabase/functions/web-events/index.ts > /tmp/meta-runtime-routing.diff
          test -s /tmp/meta-runtime-routing.diff
          grep -q "service, metadata, status, updated_at" supabase/functions/api/index.ts
          grep -q "credentialService" supabase/functions/api/index.ts
          grep -q "META_CANONICAL_APP_SECRET" supabase/functions/web-events/index.ts

      - name: Validate repository and runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --include=dev --ignore-scripts --legacy-peer-deps
          npm test
          deno check --config=supabase/functions/deno.json supabase/functions/api/index.ts supabase/functions/web-events/index.ts

      - name: Remove one-shot builder and commit only runtime result
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/meta-runtime-routing-build-artifact.yml
          git rm scripts/meta-runtime-routing-build-artifact.cjs
          git rm scripts/meta-runtime-routing-commit.py
          git diff --check
          git status --short
          git config user.name 'Nuvanx Engineering'
          git config user.email 'admin@nuvanx.com'
          git add supabase/functions/api/index.ts supabase/functions/web-events/index.ts
          git commit -m 'fix(meta): route canonical and legacy stacks explicitly'
          git push origin HEAD:fix/meta-runtime-routing-20260824

name: Verify RSV26 Live Read-Only Once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/meta-rsv26-live-verify-once.yml'
      - 'config/meta/rsv26-canonical.json'
      - 'scripts/meta-access-audit.js'
      - 'scripts/meta-audit-rsv26.js'
      - 'scripts/meta-apply-rsv26.js'
      - 'scripts/meta-creative-diff-rsv26.js'
      - 'scripts/lib/meta-rsv26.js'
      - 'supabase/functions/meta-rsv26-tools.test.mjs'

permissions:
  contents: read

jobs:
  verify-live:
    name: Meta · Production read-only diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: Production
    env:
      META_REPORTING_TOKEN_60D: ${{ secrets.META_REPORTING_TOKEN_60D }}
      META_ADS_MANAGEMENT_TOKEN: ${{ secrets.META_ADS_MANAGEMENT_TOKEN }}
      META_CANONICAL_ACCESS_TOKEN: ${{ secrets.META_CANONICAL_ACCESS_TOKEN }}
      META_CANONICAL_APP_SECRET: ${{ secrets.META_CANONICAL_APP_SECRET }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Report Production credential presence without revealing values
        shell: bash
        run: |
          set -euo pipefail
          test -n "${META_REPORTING_TOKEN_60D:-}${META_ADS_MANAGEMENT_TOKEN:-}${META_CANONICAL_ACCESS_TOKEN:-}"
          for name in META_REPORTING_TOKEN_60D META_ADS_MANAGEMENT_TOKEN META_CANONICAL_ACCESS_TOKEN META_CANONICAL_APP_SECRET; do
            if [ -n "${!name:-}" ]; then
              echo "PRODUCTION_${name}_PRESENT=true"
            else
              echo "PRODUCTION_${name}_PRESENT=false"
            fi
          done

      - name: Audit available token scopes and effective asset access read-only
        shell: bash
        run: |
          set -euo pipefail
          node scripts/meta-access-audit.js

      - name: Discover canonical Pixel/Dataset IDs read-only
        shell: bash
        run: |
          set -euo pipefail
          token="${META_ADS_MANAGEMENT_TOKEN:-${META_CANONICAL_ACCESS_TOKEN:-${META_REPORTING_TOKEN_60D:-}}}"
          test -n "$token"
          META_PROBE_TOKEN="$token" node --input-type=module <<'NODE'
          const token = process.env.META_PROBE_TOKEN;
          const version = 'v22.0';
          const endpoints = [
            ['ad_account_pixels', 'act_718120894191565/adspixels', 'id,name,last_fired_time'],
            ['business_owned_pixels', '897835716596010/owned_pixels', 'id,name,last_fired_time'],
          ];
          for (const [label, path, fields] of endpoints) {
            const url = new URL(`https://graph.facebook.com/${version}/${path}`);
            url.searchParams.set('access_token', token);
            url.searchParams.set('fields', fields);
            url.searchParams.set('limit', '100');
            const response = await fetch(url, { signal: AbortSignal.timeout(20000) });
            const body = await response.json().catch(() => ({}));
            const rows = Array.isArray(body?.data)
              ? body.data.map(({ id, name, last_fired_time }) => ({ id, name, last_fired_time: last_fired_time ?? null }))
              : [];
            console.log(`${label}=${JSON.stringify({ status: response.status, rows, error: body?.error?.message ?? null })}`);
          }
          NODE

      - name: Audit live drift read-only
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node scripts/meta-audit-rsv26.js
          audit_status=$?
          set -e
          echo "RSV26_AUDIT_EXIT=$audit_status"
          test "$audit_status" -eq 0 -o "$audit_status" -eq 1

      - name: Decompose creative drift read-only
        shell: bash
        run: |
          set -euo pipefail
          node scripts/meta-creative-diff-rsv26.js

      - name: Execute reconciler dry-run only
        shell: bash
        run: |
          set -euo pipefail
          node scripts/meta-apply-rsv26.js

  verify-management-token:
    name: Meta · canonical management credential gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: Production
    env:
      META_ADS_MANAGEMENT_TOKEN: ${{ secrets.META_ADS_MANAGEMENT_TOKEN }}
      META_ACCESS_AUDIT_REQUIRED_SOURCE: META_ADS_MANAGEMENT_TOKEN
      META_ACCESS_AUDIT_REQUIRE_CRITICAL: 'true'
    steps:
      - name: Checkout candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Require dedicated management credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${META_ADS_MANAGEMENT_TOKEN:-}" ]; then
            echo 'META_MANAGEMENT_GATE=FAIL reason=META_ADS_MANAGEMENT_TOKEN_missing_in_Production'
            exit 1
          fi
          echo 'META_MANAGEMENT_GATE_TOKEN_PRESENT=true'

      - name: Require critical scopes and effective read access
        shell: bash
        run: |
          set -euo pipefail
          node scripts/meta-access-audit.js
          echo 'META_MANAGEMENT_GATE=PASS'

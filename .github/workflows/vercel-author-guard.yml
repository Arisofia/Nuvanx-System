name: Vercel Author Guard

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: vercel-author-guard-main
  cancel-in-progress: false

jobs:
  normalize-author:
    if: contains(github.event.head_commit.author.email, 'e+') || contains(github.event.head_commit.author.email, 'E+')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Create Vercel-compatible head commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Arisofia"
          git config user.email "jenineferderas@hotmail.com"
          git commit --allow-empty -m "chore(deploy): normalize GitHub author for Vercel [identity-fix]"
          git push origin HEAD:main

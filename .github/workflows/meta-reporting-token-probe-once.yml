name: Meta Reporting Token Probe Once
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: Production
    env:
      META_REPORTING_TOKEN_60D: ${{ secrets.META_REPORTING_TOKEN_60D }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NUVANX_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.NUVANX_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Inspect form and conversion wiring
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token=String(process.env.META_REPORTING_TOKEN_60D||'').trim();
          const sbUrl=String(process.env.SUPABASE_URL||'').replace(/\/$/,'');
          const service=String(process.env.SUPABASE_SERVICE_ROLE_KEY||'').trim();
          if(!token||!sbUrl||!service) throw new Error('required secret missing');
          const graph='https://graph.facebook.com/v22.0';
          async function meta(id,fields){
            const u=new URL(`${graph}/${id}`);u.searchParams.set('access_token',token);u.searchParams.set('fields',fields);
            const r=await fetch(u,{signal:AbortSignal.timeout(20000)});const b=await r.json().catch(()=>({}));
            if(!r.ok||b?.error){const e=b?.error||{};return{ok:false,status:r.status,error:{code:e.code??null,subcode:e.error_subcode??null,type:e.type??null,message:String(e.message||`Meta ${r.status}`).slice(0,500)}}}
            return{ok:true,status:r.status,data:b};
          }
          const result={
            cta_form:await meta('1493697602775666','id,name,status,locale,created_time'),
            conversion_spec_leadgen:await meta('1329736270212784','id,name,status,locale,created_time'),
            conversion_object:await meta('28513036711646979','id,name'),
            page:await meta('1329458703573874','id,name'),
            instagram:await meta('17841474094610850','id,username,name')
          };
          const ur=await fetch(`${sbUrl}/rest/v1/integrations?service=eq.meta&status=eq.connected&select=user_id&order=updated_at.desc&limit=1`,{headers:{apikey:service,Authorization:`Bearer ${service}`}});const rows=await ur.json();const userId=rows?.[0]?.user_id;if(!userId)throw new Error('owner missing');
          const pr=await fetch(`${sbUrl}/rest/v1/agent_outputs`,{method:'POST',headers:{apikey:service,Authorization:`Bearer ${service}`,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({user_id:userId,agent_type:'meta-rsv26-form-wiring-probe-20260824',input_context:{cta_form:'1493697602775666',conversion_spec_leadgen:'1329736270212784',conversion_object:'28513036711646979'},output_text:JSON.stringify(result),model_used:'github-actions-rsv26-form-probe-v1',status:'completed',output:result,metadata:{source:'github_actions',read_only:true,one_time:true,graph_version:'v22.0'}})});if(!pr.ok)throw new Error(`persist ${pr.status}`);
          console.log('META_RSV26_FORM_PROBE=PASS');
          NODE

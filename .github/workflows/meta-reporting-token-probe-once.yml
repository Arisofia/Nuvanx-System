name: Meta Reporting Token Probe Once

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: Production
    env:
      META_REPORTING_TOKEN_60D: ${{ secrets.META_REPORTING_TOKEN_60D }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NUVANX_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.NUVANX_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Inspect reporting token identity and app
        shell: bash
        run: |
          set -euo pipefail
          test -n "${META_REPORTING_TOKEN_60D:-}"
          test -n "${SUPABASE_URL:-}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"
          node <<'NODE'
          const token = String(process.env.META_REPORTING_TOKEN_60D || '').trim();
          const sbUrl = String(process.env.SUPABASE_URL || '').replace(/\/$/, '');
          const service = String(process.env.SUPABASE_SERVICE_ROLE_KEY || '').trim();
          const graph = 'https://graph.facebook.com/v22.0';
          const target = 'act_718120894191565';
          const canonicalBusiness = '897835716596010';
          const canonicalApp = '1836302544001572';
          const canonicalSystemUser = '61593654929650';

          async function meta(path, params = {}) {
            const url = new URL(`${graph}${path}`);
            url.searchParams.set('access_token', token);
            for (const [k, v] of Object.entries(params)) url.searchParams.set(k, String(v));
            const r = await fetch(url, { signal: AbortSignal.timeout(20000) });
            const b = await r.json().catch(() => ({}));
            if (!r.ok || b?.error) {
              const e = b?.error || {};
              return { ok:false, status:r.status, error:{ code:e.code ?? null, subcode:e.error_subcode ?? null, type:e.type ?? null, message:String(e.message || `Meta ${r.status}`).slice(0,400) } };
            }
            return { ok:true, status:r.status, data:b };
          }

          const result = {
            identity: await meta('/me', { fields:'id,name' }),
            permissions: await meta('/me/permissions'),
            debug_self: await meta('/debug_token', { input_token:token }),
            app_alias: await meta('/app', { fields:'id,name' }),
            target: await meta(`/${target}`, { fields:'id,name,account_status,currency,timezone_name' }),
            target_campaigns: await meta(`/${target}/campaigns`, { fields:'id,name,status,effective_status,objective,created_time,updated_time', limit:500 }),
            canonical_business: await meta(`/${canonicalBusiness}`, { fields:'id,name' }),
            canonical_system_users: await meta(`/${canonicalBusiness}/system_users`, { fields:'id,name,role', limit:100 }),
            canonical_app: await meta(`/${canonicalApp}`, { fields:'id,name' }),
            canonical_system_user: await meta(`/${canonicalSystemUser}`, { fields:'id,name' }),
          };

          const userRes = await fetch(`${sbUrl}/rest/v1/integrations?service=eq.meta&status=eq.connected&select=user_id&order=updated_at.desc&limit=1`, { headers:{ apikey:service, Authorization:`Bearer ${service}` } });
          if (!userRes.ok) throw new Error(`Supabase owner lookup ${userRes.status}`);
          const rows = await userRes.json();
          const userId = rows?.[0]?.user_id;
          if (!userId) throw new Error('Meta integration owner missing');
          const persist = await fetch(`${sbUrl}/rest/v1/agent_outputs`, {
            method:'POST',
            headers:{ apikey:service, Authorization:`Bearer ${service}`, 'Content-Type':'application/json', Prefer:'return=minimal' },
            body:JSON.stringify({ user_id:userId, agent_type:'meta-reporting-token-debug-probe-20260824', input_context:{ target, canonical_business:canonicalBusiness, canonical_app:canonicalApp, canonical_system_user:canonicalSystemUser }, output_text:JSON.stringify(result), model_used:'github-actions-reporting-token-probe-v1', status:'completed', output:result, metadata:{ source:'github_actions', read_only:true, one_time:true, graph_version:'v22.0' } })
          });
          if (!persist.ok) throw new Error(`Supabase persist ${persist.status}`);
          console.log('META_REPORTING_TOKEN_PROBE=PASS');
          NODE

name: Supabase Migration History Parity

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/check-supabase-migration-history.mjs'
      - '.github/workflows/supabase-migration-history.yml'

permissions:
  contents: read

concurrency:
  group: supabase-migration-history-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  history-parity:
    name: Supabase · migration history parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          cache: npm

      - name: Install workspace dependencies
        run: npm install --include=dev --ignore-scripts

      - name: Validate remote migration history parity
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}"
          node scripts/check-supabase-migration-history.mjs

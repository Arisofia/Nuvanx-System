name: GSC Search Analytics Read-Only One-Shot

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    name: Validate GSC Search Analytics Query
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          project_id: nuvanx
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SEARCH_CONSOLE_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Execute GSC Query Script
        run: node scripts/gsc-search-analytics-read-once.js

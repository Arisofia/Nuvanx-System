# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: Repo Hygiene Live Builder Once

on:
  push:
    branches:
      - cleanup/repo-hygiene-live-20260825
    paths:
      - .github/workflows/repo-hygiene-live-builder-once.yml

permissions:
  contents: write

concurrency:
  group: repo-hygiene-live-builder-once
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout hygiene branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: cleanup/repo-hygiene-live-20260825
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x

      - name: Apply verified hygiene edits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['scripts']['test'] = package['scripts']['test'].replace(' --passWithNoTests', '')
          package['scripts']['build'] = package['scripts']['build'].replace(' --legacy-peer-deps', '')
          package['devDependencies'].pop('tweetsodium', None)
          package_path.write_text(json.dumps(package, indent=2, ensure_ascii=False) + '\n')

          for workflow_name in (
              '.github/workflows/master.yml',
              '.github/workflows/deploy-standalone-edge-functions.yml',
          ):
              path = Path(workflow_name)
              text = path.read_text()
              text = text.replace(' --legacy-peer-deps', '')
              path.write_text(text)

          dead_files = (
              'frontend/src/config/trackingConfig.ts',
              'frontend/src/data/clinicsScores.ts',
              'frontend/src/hooks/useFigmaData.ts',
              'frontend/src/lib/metaPixelTracking.ts',
              'frontend/src/components/ui/index.ts',
          )
          for file_name in dead_files:
              path = Path(file_name)
              if not path.is_file():
                  raise SystemExit(f'expected dead file missing: {file_name}')
              path.unlink()
          PY

      - name: Regenerate npm lockfiles mechanically
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm --prefix frontend install --package-lock-only --ignore-scripts

      - name: Validate installs without legacy peer bypass
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm --prefix frontend ci --ignore-scripts
          npm test
          npm --prefix frontend run lint
          npm --prefix frontend run test:ci
          npm --prefix frontend run build

      - name: Validate hygiene contract
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(grep -R --line-number --fixed-strings -- '--legacy-peer-deps' package.json .github/workflows || true)"
          test -z "$(grep -R --line-number --fixed-strings -- '--passWithNoTests' package.json .github/workflows || true)"
          test -z "$(grep -R --line-number --fixed-strings 'tweetsodium' package.json package-lock.json frontend/package-lock.json || true)"
          for path in \
            frontend/src/config/trackingConfig.ts \
            frontend/src/data/clinicsScores.ts \
            frontend/src/hooks/useFigmaData.ts \
            frontend/src/lib/metaPixelTracking.ts \
            frontend/src/components/ui/index.ts
          do
            test ! -e "$path"
          done
          git diff --check

      - name: Remove builder and commit final hygiene delta
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repo-hygiene-live-builder-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'chore(repo): remove verified hygiene debt'
          git push origin HEAD:cleanup/repo-hygiene-live-20260825

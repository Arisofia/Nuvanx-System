# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: Repo Hygiene Workflow Blob Builder Once

on:
  push:
    branches:
      - cleanup/repo-hygiene-live-20260825
    paths:
      - .github/workflows/repo-hygiene-live-builder-once.yml

permissions:
  contents: write

concurrency:
  group: repo-hygiene-live-builder-once
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout hygiene branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: cleanup/repo-hygiene-live-20260825
          fetch-depth: 0

      - name: Build corrected workflow blobs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          targets = (
              Path('.github/workflows/master.yml'),
              Path('.github/workflows/deploy-standalone-edge-functions.yml'),
          )
          out_dir = Path('.hygiene-artifacts')
          out_dir.mkdir(exist_ok=True)

          for source in targets:
              text = source.read_text()
              count = text.count(' --legacy-peer-deps')
              if count == 0:
                  raise SystemExit(f'expected legacy peer bypass not found in {source}')
              cleaned = text.replace(' --legacy-peer-deps', '')
              if '--legacy-peer-deps' in cleaned:
                  raise SystemExit(f'legacy peer bypass survived in {source}')
              (out_dir / source.name).write_text(cleaned)
              print(f'{source}: removed {count} occurrence(s)')
          PY
          git diff --check -- .hygiene-artifacts

      - name: Commit ordinary blob artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .hygiene-artifacts/master.yml .hygiene-artifacts/deploy-standalone-edge-functions.yml
          git diff --cached --check
          git commit -m 'chore(repo): stage corrected workflow blobs'
          git push origin HEAD:cleanup/repo-hygiene-live-20260825

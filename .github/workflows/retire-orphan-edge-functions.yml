name: Retire Orphan Edge Functions

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  retire:
    if: github.head_ref == 'cleanup/retire-orphan-edge-functions-20260825'
    runs-on: ubuntu-latest
    environment:
      name: Production
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@52a446718e4edd1a9f1e2631186019c87e329f60
        with:
          version: '2.102.0'
      - name: Delete retired orphan functions
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_PROJECT_REF:-}"
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          supabase functions delete exec-snapshot --project-ref "$SUPABASE_PROJECT_REF" --yes
          supabase functions delete daily-market-intel --project-ref "$SUPABASE_PROJECT_REF" --yes
          supabase functions delete competitor-audit --project-ref "$SUPABASE_PROJECT_REF" --yes
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF"

# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: Meta Leadgen Subscription Diagnostic

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  subscribed-apps-read-only:
    name: Read-only · Page leadgen subscription
    if: ${{ github.head_ref == 'diagnostic/meta-leadgen-subscription-20260820' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Unit-test diagnostic transport
        run: node scripts/verify-meta-leadgen-subscription.test.js

      - name: Validate read-only credentials are available
        shell: bash
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${META_ACCESS_TOKEN:-}" ]; then
            echo '::error::META_ACCESS_TOKEN secret is unavailable to this PR workflow.'
            exit 2
          fi

      - name: Inspect Page subscribed_apps for leadgen with GitHub Meta token
        continue-on-error: true
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_PAGE_ID: '685010274687129'
          META_GRAPH_VERSION: 'v22.0'
        run: node scripts/verify-meta-leadgen-subscription.js

      - name: Inspect live API Meta health with Supabase stored credential
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NUVANX_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NUVANX_SUPABASE_SERVICE_ROLE_KEY }}
          REPORT_USER_ID: ${{ secrets.REPORT_USER_ID }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = String(process.env.SUPABASE_URL || '').replace(/\/+$/, '');
          const serviceRole = String(process.env.SUPABASE_SERVICE_ROLE_KEY || '');
          const authKey = String(process.env.NUVANX_SUPABASE_SERVICE_ROLE_KEY || '') || serviceRole;
          const reportUserId = String(process.env.REPORT_USER_ID || '');
          if (!base || !serviceRole || !authKey || !reportUserId) {
            console.error('META_RUNTIME_HEALTH_STATUS=UNVERIFIABLE_MISSING_SUPABASE_DIAGNOSTIC_SECRET');
            process.exit(6);
          }
          const response = await fetch(`${base}/functions/v1/api/health/meta`, {
            method: 'GET',
            headers: {
              Authorization: `Bearer ${authKey}`,
              apikey: serviceRole,
              'x-user-id': reportUserId,
              Accept: 'application/json',
            },
            signal: AbortSignal.timeout(30000),
          });
          const text = await response.text();
          let payload = null;
          try { payload = JSON.parse(text); } catch {}
          const safe = payload && typeof payload === 'object' ? {
            success: payload.success,
            status: payload.status,
            message: payload.message,
            meta_user: payload.meta_user ?? payload.metaUser,
            ad_account: payload.ad_account ?? payload.accountId,
            accountIds: payload.accountIds,
            pageId: payload.pageId,
            pixelId: payload.pixelId,
            token_valid: payload.token_valid ?? payload.tokenValid,
          } : { body: text.slice(0, 500) };
          console.log(`META_RUNTIME_HEALTH_HTTP=${response.status}`);
          console.log(`META_RUNTIME_HEALTH_SAFE=${JSON.stringify(safe)}`);
          if (!response.ok || payload?.success === false) {
            console.error('META_RUNTIME_HEALTH_STATUS=FAILED');
            process.exit(7);
          }
          console.log('META_RUNTIME_HEALTH_STATUS=OK');
          NODE

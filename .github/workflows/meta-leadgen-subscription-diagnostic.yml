# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: Meta Leadgen Subscription Diagnostic

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  subscribed-apps-read-only:
    name: Read-only · Page leadgen subscription
    if: ${{ github.head_ref == 'diagnostic/meta-leadgen-subscription-20260820' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Unit-test diagnostic transport
        run: node scripts/verify-meta-leadgen-subscription.test.js

      - name: Validate read-only credentials are available
        shell: bash
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${META_ACCESS_TOKEN:-}" ]; then
            echo '::error::META_ACCESS_TOKEN secret is unavailable to this PR workflow.'
            exit 2
          fi

      - name: Inspect Page subscribed_apps for leadgen via System User to Page token
        shell: bash
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_SYSTEM_USER_ID: '61569256954284'
          META_PAGE_ID: '685010274687129'
          META_GRAPH_VERSION: 'v22.0'
        run: |
          set +e
          node scripts/verify-meta-leadgen-subscription.js
          rc=$?
          echo "META_LEADGEN_DIAGNOSTIC_EXIT=${rc}"
          exit 0

      - name: Inspect app-level Page leadgen webhook
        shell: bash
        env:
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: |
          set +e
          node <<'NODE'
          const appId = String(process.env.META_APP_ID || '').trim();
          const appSecret = String(process.env.META_APP_SECRET || '').trim();
          const graphVersion = 'v22.0';
          const expectedCallback = 'https://ssvvuuysgxyqvmovrlvk.supabase.co/functions/v1/api/webhooks/meta';
          if (!appId || !appSecret) {
            console.log('META_APP_WEBHOOK_STATUS=UNVERIFIABLE_MISSING_APP_CREDENTIALS');
            process.exit(0);
          }
          const appAccessToken = `${appId}|${appSecret}`;
          const url = new URL(`https://graph.facebook.com/${graphVersion}/${encodeURIComponent(appId)}/subscriptions`);
          url.searchParams.set('access_token', appAccessToken);
          const response = await fetch(url, {
            method: 'GET',
            headers: { Accept: 'application/json' },
            signal: AbortSignal.timeout(20000),
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok || payload?.error) {
            const error = payload?.error || {};
            console.log(`META_APP_ID=${appId}`);
            console.log(`META_APP_WEBHOOK_HTTP=${response.status}`);
            console.log(`META_APP_WEBHOOK_STATUS=UNVERIFIABLE_GRAPH_ERROR code=${error.code ?? 'unknown'}`);
            console.log(`META_APP_WEBHOOK_ERROR=${String(error.message || 'Graph error').replace(/[A-Za-z0-9_-]{32,}/g, '[masked]')}`);
            process.exit(0);
          }
          const subscriptions = Array.isArray(payload?.data) ? payload.data : [];
          const normalized = subscriptions.map((subscription) => ({
            object: String(subscription?.object || ''),
            callback_url: String(subscription?.callback_url || ''),
            active: subscription?.active ?? null,
            fields: Array.isArray(subscription?.fields)
              ? subscription.fields.map((field) => typeof field === 'string' ? field : String(field?.name || '')).filter(Boolean)
              : [],
          }));
          const pageSubscriptions = normalized.filter((subscription) => subscription.object === 'page');
          const leadgenSubscriptions = pageSubscriptions.filter((subscription) => subscription.fields.includes('leadgen'));
          const canonicalLeadgen = leadgenSubscriptions.find((subscription) => subscription.callback_url === expectedCallback) || null;
          console.log(`META_APP_ID=${appId}`);
          console.log(`META_APP_SUBSCRIPTIONS_COUNT=${normalized.length}`);
          console.log(`META_APP_PAGE_SUBSCRIPTIONS_COUNT=${pageSubscriptions.length}`);
          console.log(`META_APP_LEADGEN_SUBSCRIPTIONS_COUNT=${leadgenSubscriptions.length}`);
          for (const subscription of pageSubscriptions) {
            console.log(`META_APP_PAGE_WEBHOOK active=${subscription.active} callback=${JSON.stringify(subscription.callback_url)} fields=${subscription.fields.join(',') || 'none'}`);
          }
          console.log(`META_APP_EXPECTED_CALLBACK=${expectedCallback}`);
          console.log(`META_APP_CANONICAL_LEADGEN_CALLBACK=${Boolean(canonicalLeadgen)}`);
          if (pageSubscriptions.length === 0) {
            console.log('META_APP_WEBHOOK_STATUS=MISSING_PAGE_WEBHOOK');
          } else if (leadgenSubscriptions.length === 0) {
            console.log('META_APP_WEBHOOK_STATUS=MISSING_LEADGEN_FIELD');
          } else if (!canonicalLeadgen) {
            console.log('META_APP_WEBHOOK_STATUS=LEADGEN_CALLBACK_MISMATCH');
          } else {
            console.log('META_APP_WEBHOOK_STATUS=OK');
          }
          NODE

      - name: Inspect live API Meta health routing
        shell: bash
        env:
          NUVANX_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NUVANX_SUPABASE_SERVICE_ROLE_KEY }}
          REPORT_USER_ID: ${{ secrets.REPORT_USER_ID }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = 'https://ssvvuuysgxyqvmovrlvk.supabase.co';
          const authKey = String(process.env.NUVANX_SUPABASE_SERVICE_ROLE_KEY || '');
          const reportUserId = String(process.env.REPORT_USER_ID || '');
          if (!authKey || !reportUserId) {
            console.error('META_RUNTIME_HEALTH_STATUS=UNVERIFIABLE_MISSING_INTERNAL_AUTH');
            process.exit(6);
          }
          const response = await fetch(`${base}/functions/v1/api/health/meta`, {
            method: 'GET',
            headers: {
              Authorization: `Bearer ${authKey}`,
              'x-user-id': reportUserId,
              Accept: 'application/json',
            },
            signal: AbortSignal.timeout(30000),
          });
          const text = await response.text();
          let payload = null;
          try { payload = JSON.parse(text); } catch {}
          const safe = payload && typeof payload === 'object' ? {
            success: payload.success,
            status: payload.status,
            message: payload.message,
            meta_user: payload.meta_user ?? payload.metaUser,
            ad_account: payload.ad_account ?? payload.accountId,
            accountIds: payload.accountIds,
            pageId: payload.pageId,
            pixelId: payload.pixelId,
            token_valid: payload.token_valid ?? payload.tokenValid,
          } : { body: text.slice(0, 500) };
          console.log(`META_RUNTIME_HEALTH_HTTP=${response.status}`);
          console.log(`META_RUNTIME_HEALTH_SAFE=${JSON.stringify(safe)}`);
          console.log('META_RUNTIME_HEALTH_NOTE=public_health_router_intercepts_health_meta_before_authenticated_handler');
          NODE

      - name: Probe live Meta campaigns with dedicated Supabase auth
        shell: bash
        env:
          NUVANX_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NUVANX_SUPABASE_SERVICE_ROLE_KEY }}
          REPORT_USER_ID: ${{ secrets.REPORT_USER_ID }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = 'https://ssvvuuysgxyqvmovrlvk.supabase.co';
          const authKey = String(process.env.NUVANX_SUPABASE_SERVICE_ROLE_KEY || '');
          const reportUserId = String(process.env.REPORT_USER_ID || '');
          if (!authKey || !reportUserId) {
            console.error('META_RUNTIME_CAMPAIGNS_DEDICATED_STATUS=UNVERIFIABLE_MISSING_INTERNAL_AUTH');
            process.exit(8);
          }
          const response = await fetch(`${base}/functions/v1/api/meta/campaigns?from=2026-08-13&to=2026-08-20`, {
            method: 'GET',
            headers: {
              Authorization: `Bearer ${authKey}`,
              'x-user-id': reportUserId,
              Accept: 'application/json',
            },
            signal: AbortSignal.timeout(45000),
          });
          const text = await response.text();
          let payload = null;
          try { payload = JSON.parse(text); } catch {}
          const campaigns = Array.isArray(payload?.campaigns) ? payload.campaigns : [];
          const safe = payload && typeof payload === 'object' ? {
            success: payload.success,
            source: payload.source ?? null,
            cached: payload.cached ?? null,
            accountId: payload.accountId ?? null,
            accountIds: payload.accountIds ?? null,
            currency: payload.currency ?? null,
            campaignCount: campaigns.length,
            warning: payload.warning ?? null,
            message: payload.message ?? null,
            metaApiError: payload.metaApiError ?? null,
          } : { body: text.slice(0, 500) };
          console.log(`META_RUNTIME_CAMPAIGNS_DEDICATED_HTTP=${response.status}`);
          console.log(`META_RUNTIME_CAMPAIGNS_DEDICATED_SAFE=${JSON.stringify(safe)}`);
          if (!response.ok || payload?.success === false) {
            console.error('META_RUNTIME_CAMPAIGNS_DEDICATED_STATUS=FAILED');
            process.exit(9);
          }
          if (payload?.source === 'live') {
            console.log('META_RUNTIME_CAMPAIGNS_DEDICATED_STATUS=LIVE_META_CONFIRMED');
          } else {
            console.log(`META_RUNTIME_CAMPAIGNS_DEDICATED_STATUS=NON_LIVE_SOURCE:${String(payload?.source ?? 'unknown')}`);
          }
          NODE

      - name: Probe live Meta campaigns with MCP API key
        shell: bash
        env:
          MCP_API_KEY: ${{ secrets.MCP_API_KEY }}
          REPORT_USER_ID: ${{ secrets.REPORT_USER_ID }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = 'https://ssvvuuysgxyqvmovrlvk.supabase.co';
          const apiKey = String(process.env.MCP_API_KEY || '');
          const reportUserId = String(process.env.REPORT_USER_ID || '');
          if (!apiKey) {
            console.log('META_RUNTIME_CAMPAIGNS_MCP_STATUS=UNAVAILABLE_MISSING_GITHUB_SECRET');
            process.exit(0);
          }
          if (!reportUserId) {
            console.log('META_RUNTIME_CAMPAIGNS_MCP_STATUS=UNAVAILABLE_MISSING_REPORT_USER_ID');
            process.exit(0);
          }
          const response = await fetch(`${base}/functions/v1/api/meta/campaigns?from=2026-08-13&to=2026-08-20`, {
            method: 'GET',
            headers: {
              'x-api-key': apiKey,
              'x-user-id': reportUserId,
              Accept: 'application/json',
            },
            signal: AbortSignal.timeout(45000),
          });
          const text = await response.text();
          let payload = null;
          try { payload = JSON.parse(text); } catch {}
          const campaigns = Array.isArray(payload?.campaigns) ? payload.campaigns : [];
          const safe = payload && typeof payload === 'object' ? {
            success: payload.success,
            source: payload.source ?? null,
            cached: payload.cached ?? null,
            accountId: payload.accountId ?? null,
            accountIds: payload.accountIds ?? null,
            currency: payload.currency ?? null,
            campaignCount: campaigns.length,
            warning: payload.warning ?? null,
            message: payload.message ?? null,
            metaApiError: payload.metaApiError ?? null,
          } : { body: text.slice(0, 500) };
          console.log(`META_RUNTIME_CAMPAIGNS_MCP_HTTP=${response.status}`);
          console.log(`META_RUNTIME_CAMPAIGNS_MCP_SAFE=${JSON.stringify(safe)}`);
          if (!response.ok || payload?.success === false) {
            console.log('META_RUNTIME_CAMPAIGNS_MCP_STATUS=FAILED');
            process.exit(0);
          }
          if (payload?.source === 'live') {
            console.log('META_RUNTIME_CAMPAIGNS_MCP_STATUS=LIVE_META_CONFIRMED');
          } else {
            console.log(`META_RUNTIME_CAMPAIGNS_MCP_STATUS=NON_LIVE_SOURCE:${String(payload?.source ?? 'unknown')}`);
          }
          NODE

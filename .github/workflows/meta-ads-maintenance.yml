# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: Meta Ads Maintenance
run-name: Meta Ads Maintenance · ${{ inputs.operation }} · ${{ inputs.campaign_id }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Meta Ads maintenance operation
        required: true
        default: inspect
        type: choice
        options:
          - inspect
      account_id:
        description: Meta ad account ID
        required: true
        default: act_718120894191565
        type: string
      campaign_id:
        description: Campaign ID
        required: true
        default: '120249780276630419'
        type: string
      adset_id:
        description: Ad set ID
        required: true
        default: '120249784103200419'
        type: string
      ad_id:
        description: Ad ID
        required: true
        default: '120249780276610419'
        type: string
      confirmation:
        description: Type INSPECT to authorize read-only Meta inspection
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: meta-ads-maintenance-${{ inputs.account_id }}-${{ inputs.campaign_id }}
  cancel-in-progress: false

jobs:
  inspect:
    name: Read-only Meta Ads inspection
    if: ${{ inputs.operation == 'inspect' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: Production
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NUVANX_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.NUVANX_SUPABASE_SERVICE_ROLE_KEY }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET || '' }}
      META_GRAPH_VERSION: v22.0
      TARGET_AD_ACCOUNT_ID: ${{ inputs.account_id }}
      TARGET_CAMPAIGN_ID: ${{ inputs.campaign_id }}
      TARGET_ADSET_ID: ${{ inputs.adset_id }}
      TARGET_AD_ID: ${{ inputs.ad_id }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Validate explicit authorization and inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = INSPECT
          test -n "${SUPABASE_URL:-}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -n "${ENCRYPTION_KEY:-}"
          [[ "$TARGET_AD_ACCOUNT_ID" =~ ^act_[0-9]+$ ]]
          [[ "$TARGET_CAMPAIGN_ID" =~ ^[0-9]+$ ]]
          [[ "$TARGET_ADSET_ID" =~ ^[0-9]+$ ]]
          [[ "$TARGET_AD_ID" =~ ^[0-9]+$ ]]

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'

      - name: Validate inspector syntax
        run: node --check scripts/meta-ads-inspect.js

      - name: Inspect Meta permissions and selected objects
        run: node scripts/meta-ads-inspect.js

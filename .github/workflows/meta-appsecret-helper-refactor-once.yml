name: Meta Appsecret Helper Refactor Once

on:
  push:
    branches:
      - fix/meta-appsecret-proof-fallback-20260825
    paths:
      - '.github/workflows/meta-appsecret-helper-refactor-once.yml'

permissions:
  contents: write

concurrency:
  group: meta-appsecret-helper-refactor-once
  cancel-in-progress: false

jobs:
  refactor-test-commit:
    if: github.actor == 'Arisofia'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Bind exact branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'fix/meta-appsecret-proof-fallback-20260825'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x

      - name: Extract pure proof-routing helper and executable tests
        shell: bash
        run: |
          set -euo pipefail
          cat > supabase/functions/_shared/meta-appsecret.mjs <<'EOF'
          function normalizedSecret(value) {
            const normalized = String(value ?? '').trim();
            return normalized || null;
          }

          export function buildMetaAppSecretCandidates(canonicalSecret, legacySecret, appSecretOverride = undefined) {
            if (appSecretOverride !== undefined) return [normalizedSecret(appSecretOverride)];
            const configured = [canonicalSecret, legacySecret]
              .map(normalizedSecret)
              .filter(Boolean);
            return [...new Set(configured), null];
          }

          export function isInvalidMetaAppSecretProof(body) {
            const message = String(body?.error?.message ?? body?.message ?? '').toLowerCase();
            return message.includes('appsecret_proof') || message.includes('app secret proof');
          }

          export function shouldRetryMetaAppSecretProof(index, candidates, body) {
            return index + 1 < candidates.length && isInvalidMetaAppSecretProof(body);
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          path = Path('supabase/functions/api/index.ts')
          text = path.read_text()

          import_anchor = "import { getPhoneNormalizationFailureReason, normalizePhoneForMeta } from '../_shared/phone.ts';\n"
          import_line = "import { buildMetaAppSecretCandidates, shouldRetryMetaAppSecretProof } from '../_shared/meta-appsecret.mjs';\n"
          if import_line not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit('phone import anchor not unique')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          start = text.find('function metaGraphSecretCandidates(')
          end = text.find('export async function metaFetch(', start)
          if start < 0 or end < 0:
              raise SystemExit('meta proof helper block not found')
          text = text[:start] + text[end:]

          old_candidates = '  const candidates = metaGraphSecretCandidates(appSecretOverride);'
          new_candidates = '  const candidates = buildMetaAppSecretCandidates(META_CANONICAL_APP_SECRET, META_APP_SECRET, appSecretOverride);'
          if text.count(old_candidates) != 2:
              raise SystemExit(f'expected two candidate call sites, found {text.count(old_candidates)}')
          text = text.replace(old_candidates, new_candidates)

          old_retry = '    const canRetrySecret = index + 1 < candidates.length && isInvalidAppsecretProof(data);'
          new_retry = '    const canRetrySecret = shouldRetryMetaAppSecretProof(index, candidates, data);'
          if text.count(old_retry) != 2:
              raise SystemExit(f'expected two retry call sites, found {text.count(old_retry)}')
          text = text.replace(old_retry, new_retry)
          path.write_text(text)
          PY

          cat > supabase/functions/api/meta-appsecret-proof-fallback.test.mjs <<'EOF'
          import { describe, expect, it, vi } from 'vitest';
          import {
            buildMetaAppSecretCandidates,
            isInvalidMetaAppSecretProof,
            shouldRetryMetaAppSecretProof,
          } from '../_shared/meta-appsecret.mjs';

          async function runFallback({ canonical, legacy, override, responses }) {
            const candidates = buildMetaAppSecretCandidates(canonical, legacy, override);
            const attempt = vi.fn(async (candidate, index) => responses[index]);
            let last;
            for (let index = 0; index < candidates.length; index += 1) {
              last = await attempt(candidates[index], index);
              if (last.ok) return { result: last, candidates, attempt };
              if (!shouldRetryMetaAppSecretProof(index, candidates, last.body)) break;
            }
            return { result: last, candidates, attempt };
          }

          describe('Meta appsecret proof routing', () => {
            it('orders canonical, legacy and bare-token fallback deterministically', () => {
              expect(buildMetaAppSecretCandidates(' canonical ', 'legacy')).toEqual(['canonical', 'legacy', null]);
              expect(buildMetaAppSecretCandidates('same', 'same')).toEqual(['same', null]);
              expect(buildMetaAppSecretCandidates('', '')).toEqual([null]);
            });

            it('keeps explicit overrides strict, including explicit no-proof mode', () => {
              expect(buildMetaAppSecretCandidates('canonical', 'legacy', 'override')).toEqual(['override']);
              expect(buildMetaAppSecretCandidates('canonical', 'legacy', null)).toEqual([null]);
            });

            it('retries only invalid appsecret_proof failures and reaches bare-token success', async () => {
              const outcome = await runFallback({
                canonical: 'canonical',
                legacy: 'legacy',
                responses: [
                  { ok: false, body: { error: { message: 'Invalid appsecret_proof provided' } } },
                  { ok: false, body: { error: { message: 'Invalid App Secret Proof' } } },
                  { ok: true, body: { data: [{ id: 'ok' }] } },
                ],
              });
              expect(outcome.candidates).toEqual(['canonical', 'legacy', null]);
              expect(outcome.attempt.mock.calls.map(([secret]) => secret)).toEqual(['canonical', 'legacy', null]);
              expect(outcome.result.ok).toBe(true);
            });

            it('does not retry unrelated Meta errors', async () => {
              const body = { error: { message: 'Unsupported get request' } };
              expect(isInvalidMetaAppSecretProof(body)).toBe(false);
              const outcome = await runFallback({
                canonical: 'canonical',
                legacy: 'legacy',
                responses: [{ ok: false, body }, { ok: true, body: {} }],
              });
              expect(outcome.attempt).toHaveBeenCalledTimes(1);
              expect(outcome.result.ok).toBe(false);
            });
          });
          EOF

          git diff --check

      - name: Validate full repository and runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --include=dev --ignore-scripts --legacy-peer-deps
          npm test
          deno check --config=supabase/functions/deno.json supabase/functions/api/index.ts

      - name: Self-remove and commit only permanent files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/meta-appsecret-helper-refactor-once.yml
          git diff --check
          git config user.name 'Nuvanx Engineering'
          git config user.email 'admin@nuvanx.com'
          git add supabase/functions/_shared/meta-appsecret.mjs supabase/functions/api/index.ts supabase/functions/api/meta-appsecret-proof-fallback.test.mjs
          git commit -m 'test(meta): execute appsecret fallback policy'
          git push origin HEAD:fix/meta-appsecret-proof-fallback-20260825

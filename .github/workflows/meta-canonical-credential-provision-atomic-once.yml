name: Meta Canonical Credential Provision Atomic Once

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: meta-canonical-credential-provision-atomic-once
  cancel-in-progress: false

jobs:
  provision:
    name: Provision canonical meta_ads credential atomically
    if: >-
      github.repository == 'Arisofia/Nuvanx-System' &&
      github.event.issue.number == 276 &&
      github.event.issue.state == 'closed' &&
      github.event.comment.user.login == 'Arisofia' &&
      startsWith(github.event.comment.body, 'PROVISION-META-ADS-CANONICAL ')
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 15
    env:
      TRIGGER_COMMENT: ${{ github.event.comment.body }}
      SUPABASE_URL: https://ssvvuuysgxyqvmovrlvk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NUVANX_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NUVANX_SUPABASE_SERVICE_ROLE_KEY }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      META_CANONICAL_ACCESS_TOKEN: ${{ secrets.META_CANONICAL_ACCESS_TOKEN }}
      META_CANONICAL_APP_SECRET: ${{ secrets.META_CANONICAL_APP_SECRET }}
      META_ACCESS_AUDIT_REQUIRED_SOURCE: META_CANONICAL_ACCESS_TOKEN
      META_ACCESS_AUDIT_REQUIRE_CRITICAL: 'true'
      META_ACCESS_AUDIT_REQUIRE_APP_MATCH: 'true'
      META_ACCESS_AUDIT_REQUIRE_CRITICAL_ASSETS: 'true'

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Bind trigger to exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          current_main="$(git rev-parse origin/main)"
          checked_out="$(git rev-parse HEAD)"
          test "$current_main" = "$checked_out" || {
            echo "META_CREDENTIAL_MAIN_GATE=FAIL reason=main_moved" >&2
            exit 1
          }
          expected="PROVISION-META-ADS-CANONICAL ${checked_out}"
          test "$TRIGGER_COMMENT" = "$expected" || {
            echo "META_CREDENTIAL_MAIN_GATE=FAIL reason=trigger_sha_mismatch" >&2
            exit 1
          }
          echo "META_CREDENTIAL_MAIN_GATE=PASS"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22

      - name: Require production secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${META_CANONICAL_ACCESS_TOKEN:-}"
          test -n "${META_CANONICAL_APP_SECRET:-}"
          test -n "${ENCRYPTION_KEY:-}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-${NUVANX_SUPABASE_SERVICE_ROLE_KEY:-}}"
          echo 'META_CREDENTIAL_SECRETS=PASS present=true'

      - name: Validate canonical Meta identity and assets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/meta-access-audit.js
          node scripts/meta-system-user-audit.js
          echo 'META_CREDENTIAL_CANONICAL_IDENTITY=PASS'

      - name: Provision and reconcile canonical credential
        shell: bash
        run: |
          set -euo pipefail
          export SUPABASE_SERVICE_ROLE_KEY="${SUPABASE_SERVICE_ROLE_KEY:-${NUVANX_SUPABASE_SERVICE_ROLE_KEY:-}}"
          node scripts/meta-provision-canonical-credential-atomic-once.cjs

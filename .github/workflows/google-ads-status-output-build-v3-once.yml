name: Google Ads Status Output Build V3 Once

on:
  push:
    branches:
      - feat/google-ads-status-output-20260825
    paths:
      - '.github/workflows/google-ads-status-output-build-v3-once.yml'

permissions:
  contents: write

jobs:
  build-test-commit:
    if: github.actor == 'Arisofia'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x

      - name: Patch canonical Google Ads output surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          api_path = Path('supabase/functions/api/index.ts')
          api = api_path.read_text()
          declaration = 'async function handleGoogleAdsInsightsGet(ctx: AuthenticatedRouteContext): Promise<Response | null> {'
          status_fn = '''async function handleGoogleAdsStatusGet(ctx: AuthenticatedRouteContext): Promise<Response | null> {
            const { adminClient, userId, resource, sub, req, sendJson } = ctx;
            if (resource !== 'google-ads' || sub !== 'status' || req.method !== 'GET') return null;

            const { data: row, error } = await adminClient
              .from('vw_google_ads_connection_status')
              .select('status, customer_id, credential_present, credential_created_at, credential_last_used, last_sync, last_error, updated_at')
              .eq('user_id', userId)
              .maybeSingle();
            if (error) throw error;

            if (!row) {
              return sendJson({
                success: true,
                connected: false,
                status: 'not_configured',
                customerId: null,
                credentialPresent: false,
                credentialCreatedAt: null,
                credentialLastUsed: null,
                lastSync: null,
                lastErrorPresent: false,
                updatedAt: null,
              });
            }

            const customerId = typeof row.customer_id === 'string' && row.customer_id.trim()
              ? row.customer_id.trim()
              : null;
            const credentialPresent = row.credential_present === true;
            const connected = row.status === 'connected' && credentialPresent && Boolean(customerId);

            return sendJson({
              success: true,
              connected,
              status: row.status ?? 'unknown',
              customerId,
              credentialPresent,
              credentialCreatedAt: row.credential_created_at ?? null,
              credentialLastUsed: row.credential_last_used ?? null,
              lastSync: row.last_sync ?? null,
              lastErrorPresent: Boolean(row.last_error),
              updatedAt: row.updated_at ?? null,
            });
          }

          '''
          if 'async function handleGoogleAdsStatusGet(' not in api:
              if api.count(declaration) != 1:
                  raise SystemExit(f'insights declaration count={api.count(declaration)}')
              api = api.replace(declaration, status_fn + declaration, 1)

          route_anchor = "  ['google-ads|insights|GET', handleGoogleAdsInsightsGet],\n"
          status_route = "  ['google-ads|status|GET', handleGoogleAdsStatusGet],\n"
          if status_route not in api:
              if api.count(route_anchor) != 1:
                  raise SystemExit(f'Google Ads route anchor count={api.count(route_anchor)}')
              api = api.replace(route_anchor, status_route + route_anchor, 1)
          api_path.write_text(api)

          marketing_path = Path('frontend/src/pages/MarketingUnified.tsx')
          marketing = marketing_path.read_text()
          state_anchor = 'type GoogleState = {\n'
          status_type = '''type GoogleStatusResponse = {
            success: boolean
            connected: boolean
            status: string
            customerId: string | null
            credentialPresent: boolean
            credentialCreatedAt: string | null
            credentialLastUsed: string | null
            lastSync: string | null
            lastErrorPresent: boolean
            updatedAt: string | null
          }

          '''
          if 'type GoogleStatusResponse = {' not in marketing:
              if marketing.count(state_anchor) != 1:
                  raise SystemExit('GoogleState anchor not unique')
              marketing = marketing.replace(state_anchor, status_type + state_anchor, 1)
          if '  connection: GoogleStatusResponse | null\n' not in marketing:
              marketing = marketing.replace(state_anchor, state_anchor + '  connection: GoogleStatusResponse | null\n', 1)

          init_anchor = '  const [state, setState] = useState<GoogleState>({\n'
          if '    connection: null,\n' not in marketing:
              if marketing.count(init_anchor) != 1:
                  raise SystemExit('GoogleState initializer not unique')
              marketing = marketing.replace(init_anchor, init_anchor + '    connection: null,\n', 1)

          old_fetch = '''      const [insights, campaigns] = await Promise.all([
        invokeApi<GoogleInsightsResponse>(`/api/google-ads/insights?${params}`),
        invokeApi<GoogleCampaignsResponse>(`/api/google-ads/campaigns?${params}`),
      ])'''
          new_fetch = '''      const [connection, insights, campaigns] = await Promise.all([
        invokeApi<GoogleStatusResponse>('/api/google-ads/status'),
        invokeApi<GoogleInsightsResponse>(`/api/google-ads/insights?${params}`),
        invokeApi<GoogleCampaignsResponse>(`/api/google-ads/campaigns?${params}`),
      ])'''
          if "invokeApi<GoogleStatusResponse>('/api/google-ads/status')" not in marketing:
              if marketing.count(old_fetch) != 1:
                  raise SystemExit(f'Google fetch block count={marketing.count(old_fetch)}')
              marketing = marketing.replace(old_fetch, new_fetch, 1)

          validation_anchor = "      if (!insights.success) {\n"
          validation = "      if (!connection.success) {\n        throw new Error('No se pudo comprobar el estado de Google Ads.')\n      }\n"
          if validation not in marketing:
              if marketing.count(validation_anchor) != 1:
                  raise SystemExit('insights validation not unique')
              marketing = marketing.replace(validation_anchor, validation + validation_anchor, 1)

          setter_anchor = '      setState({\n        summary: insights.summary ?? null,\n'
          if '        connection,\n' not in marketing:
              if marketing.count(setter_anchor) != 1:
                  raise SystemExit(f'state setter count={marketing.count(setter_anchor)}')
              marketing = marketing.replace(setter_anchor, '      setState({\n        connection,\n        summary: insights.summary ?? null,\n', 1)

          grid_anchor = '      <div className="grid grid-cols-2 gap-4 md:grid-cols-4">\n'
          status_ui = '''      {state.connection && (
        <div data-testid="google-ads-connection-status" className="rounded-lg border border-border bg-card px-4 py-3">
          <div className="flex flex-wrap items-center justify-between gap-2">
            <div>
              <p className="text-sm font-semibold text-foreground">
                {state.connection.connected ? 'Conexión Google Ads operativa' : 'Conexión Google Ads incompleta'}
              </p>
              <p className="mt-1 text-xs text-muted">
                Customer ID: {state.connection.customerId ?? 'no configurado'} · Credencial: {state.connection.credentialPresent ? 'configurada' : 'ausente'} · Última sincronización: {state.connection.lastSync ? new Date(state.connection.lastSync).toLocaleString('es-ES') : 'sin sincronización registrada'}
              </p>
            </div>
            <span className="text-xs font-semibold text-muted">{state.connection.status}</span>
          </div>
          {state.connection.lastErrorPresent && (
            <p className="mt-2 text-xs text-red-600">La integración tiene un error registrado y requiere revisión.</p>
          )}
        </div>
      )}

          '''
          if 'data-testid="google-ads-connection-status"' not in marketing:
              if marketing.count(grid_anchor) != 1:
                  raise SystemExit(f'metric grid count={marketing.count(grid_anchor)}')
              marketing = marketing.replace(grid_anchor, status_ui + grid_anchor, 1)
          marketing_path.write_text(marketing)

          pkg_path = Path('package.json')
          pkg = json.loads(pkg_path.read_text())
          pkg['scripts']['google-ads:status'] = 'node scripts/check-google-ads-db.js --json'
          pkg_path.write_text(json.dumps(pkg, indent=2, ensure_ascii=False) + '\n')
          PY

          cat > scripts/check-google-ads-db.js <<'EOF'
          #!/usr/bin/env node
          'use strict';

          const { createClient } = require('@supabase/supabase-js');
          require('dotenv').config();

          function requireEnv(name) {
            const value = String(process.env[name] || '').trim();
            if (!value) throw new Error(`${name} is required.`);
            return value;
          }

          async function check() {
            const supabaseUrl = process.env.SUPABASE_URL || process.env.VITE_SUPABASE_URL;
            const serviceRoleKey = requireEnv('SUPABASE_SERVICE_ROLE_KEY');
            if (!supabaseUrl) throw new Error('SUPABASE_URL or VITE_SUPABASE_URL is required.');
            const supabase = createClient(supabaseUrl, serviceRoleKey, { auth: { persistSession: false, autoRefreshToken: false } });
            let query = supabase
              .from('vw_google_ads_connection_status')
              .select('user_id, clinic_id, status, customer_id, credential_present, credential_created_at, credential_last_used, last_sync, last_error, updated_at')
              .order('updated_at', { ascending: false });
            const userId = String(process.env.GOOGLE_ADS_STATUS_USER_ID || '').trim();
            if (userId) query = query.eq('user_id', userId);
            const { data, error } = await query;
            if (error) throw error;
            const rows = (data || []).map((row) => ({
              user_id: row.user_id,
              clinic_id: row.clinic_id,
              status: row.status,
              customer_id: row.customer_id,
              credential_present: row.credential_present === true,
              credential_created_at: row.credential_created_at,
              credential_last_used: row.credential_last_used,
              last_sync: row.last_sync,
              last_error_present: Boolean(row.last_error),
              updated_at: row.updated_at,
              connected: row.status === 'connected' && row.credential_present === true && Boolean(row.customer_id),
            }));
            const output = { success: true, rows: rows.length, connected: rows.filter((row) => row.connected).length, data: rows };
            console.log(process.argv.includes('--json') ? JSON.stringify(output) : JSON.stringify(output, null, 2));
            if (rows.length === 0) process.exitCode = 2;
            else if (rows.some((row) => !row.connected)) process.exitCode = 3;
          }

          check().catch((error) => {
            console.error(`[check-google-ads-db] Failed: ${error.message || error}`);
            process.exit(1);
          });
          EOF

          cat > supabase/functions/api/google-ads-status-contract.test.mjs <<'EOF'
          import { readFileSync } from 'node:fs';
          import { describe, expect, it } from 'vitest';

          const api = readFileSync('supabase/functions/api/index.ts', 'utf8');
          const checker = readFileSync('scripts/check-google-ads-db.js', 'utf8');
          const migration = readFileSync('supabase/migrations/20260825082322_create_google_ads_connection_status_view.sql', 'utf8');

          describe('Google Ads status output contract', () => {
            it('serves authenticated per-user status without credential material', () => {
              const start = api.indexOf('async function handleGoogleAdsStatusGet');
              const end = api.indexOf('async function handleGoogleAdsInsightsGet', start);
              expect(start).toBeGreaterThan(-1);
              expect(end).toBeGreaterThan(start);
              const section = api.slice(start, end);
              expect(section).toContain(".from('vw_google_ads_connection_status')");
              expect(section).toContain(".eq('user_id', userId)");
              expect(section).toContain('lastErrorPresent');
              expect(section).not.toContain('encrypted_key');
              expect(section).not.toContain('integration_id');
              expect(api).toContain("['google-ads|status|GET', handleGoogleAdsStatusGet]");
            });

            it('keeps the database surface server-only and secret-free', () => {
              expect(migration).toContain('with (security_invoker = true)');
              expect(migration).toContain('revoke all on public.vw_google_ads_connection_status from authenticated');
              expect(migration).toContain('grant select on public.vw_google_ads_connection_status to service_role');
              expect(migration).not.toContain('encrypted_key');
            });

            it('makes the CLI consume the same canonical view', () => {
              expect(checker).toContain(".from('vw_google_ads_connection_status')");
              expect(checker).not.toContain(".from('credentials')");
              expect(checker).not.toContain(".from('integrations')");
              expect(checker).not.toContain('encrypted_key');
            });
          });
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/tests/marketing-unified-contract.test.ts')
          text = p.read_text()
          anchor = "    expect(marketing).toContain('/api/google-ads/campaigns?')\n"
          extra = "    expect(marketing).toContain('/api/google-ads/status')\n    expect(marketing).toContain('google-ads-connection-status')\n    expect(marketing).toContain('Conexión Google Ads operativa')\n"
          if "expect(marketing).toContain('/api/google-ads/status')" not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('marketing contract anchor not unique')
              text = text.replace(anchor, anchor + extra, 1)
          p.write_text(text)
          PY

          cat > docs/operations/google-ads-status-output.md <<'EOF'
          # Google Ads status output ownership

          Canonical flow: `public.vw_google_ads_connection_status` → authenticated `GET /api/google-ads/status` → Vercel `/marketing` Google Ads panel.

          The view is secret-free and direct `anon`/`authenticated` access is revoked. Only the server-side service role queries it. The browser receives connection state, Customer ID, credential presence and timestamps; it never receives credential IDs, encrypted keys, tokens or raw credential metadata.

          `npm run google-ads:status` executes `scripts/check-google-ads-db.js`, which reads the same view with `SUPABASE_SERVICE_ROLE_KEY` and exits non-zero if no Google Ads row exists or if a selected row is not operational.

          Owners:
          - Database state: Supabase `vw_google_ads_connection_status`.
          - API: Supabase Edge `api` / `GET /api/google-ads/status`.
          - Human output: Vercel Control Centre `/marketing`.
          - CLI/CI diagnostic: `scripts/check-google-ads-db.js`.
          EOF

          node --check scripts/check-google-ads-db.js
          git diff --check

      - name: Validate full repository surface
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm test
          npm run validate:workflows
          npm run validate:migrations
          npm run secrets:scan
          npm run validate:edge-deno
          npm --prefix frontend ci --ignore-scripts
          npm --prefix frontend run lint
          npm --prefix frontend test
          npm --prefix frontend run build
          git diff --check

      - name: Commit only permanent non-workflow changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Nuvanx Engineering'
          git config user.email 'admin@nuvanx.com'
          git add package.json scripts/check-google-ads-db.js supabase/functions/api/index.ts supabase/functions/api/google-ads-status-contract.test.mjs frontend/src/pages/MarketingUnified.tsx frontend/tests/marketing-unified-contract.test.ts docs/operations/google-ads-status-output.md
          if git diff --cached --name-only | grep -E '^\.github/workflows/'; then exit 1; fi
          git diff --cached --check
          git commit -m 'feat(google-ads): expose canonical connection status'
          git push origin HEAD:feat/google-ads-status-output-20260825

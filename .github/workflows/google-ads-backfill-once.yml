name: Google Ads August Backfill Once

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/google-ads-backfill-once.yml

permissions:
  contents: read

concurrency:
  group: google-ads-august-backfill-once
  cancel-in-progress: false

jobs:
  backfill:
    name: Backfill Google Ads August 2026
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Production
    env:
      SUPABASE_URL: https://ssvvuuysgxyqvmovrlvk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.NUVANX_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Validate Supabase runtime access
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"

      - name: Backfill August 2026 in Supabase Edge Runtime
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --show-error --silent --max-time 120 \
            -X POST "${SUPABASE_URL}/functions/v1/google-ads-daily-sync" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H 'Content-Type: application/json' \
            -d '{"from":"2026-08-01","to":"2026-08-31"}')"
          printf '%s\n' "$response"
          grep -q '"success":true' <<<"$response"

name: Google Ads August Backfill Once

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Deploy Standalone Edge Functions
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: google-ads-august-backfill-once
  cancel-in-progress: false

jobs:
  backfill:
    name: Backfill Google Ads August 2026
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.event == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Production
    env:
      SUPABASE_URL: https://ssvvuuysgxyqvmovrlvk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.NUVANX_SUPABASE_SERVICE_ROLE_KEY }}
      DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted main matches deployed candidate
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git rev-parse HEAD)"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            [[ "${DEPLOYED_SHA:-}" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid deployed SHA' >&2; exit 1; }
            if [[ "$CURRENT_SHA" != "$DEPLOYED_SHA" ]]; then
              echo "Current main advanced beyond the deployed candidate; a newer deployment run must own the backfill." >&2
              exit 1
            fi
          fi
          echo "Verified trusted candidate $CURRENT_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          cache: npm

      - name: Install workspace dependencies
        run: npm install --include=dev --ignore-scripts

      - name: Validate server-side runtime contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"

      - name: Dispatch and await August 2026 backfill
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const base = String(process.env.SUPABASE_URL || '').replace(/\/$/, '');
          const key = String(process.env.SUPABASE_SERVICE_ROLE_KEY || '');
          const runnerTemp = String(process.env.RUNNER_TEMP || '').trim();
          if (!base || !key || !runnerTemp) throw new Error('Supabase/runtime contract unavailable');

          async function rpc(name, body) {
            const response = await fetch(`${base}/rest/v1/rpc/${name}`, {
              method: 'POST',
              headers: {
                apikey: key,
                Authorization: `Bearer ${key}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify(body),
              signal: AbortSignal.timeout(20_000),
            });
            const raw = await response.text();
            let payload;
            try {
              payload = raw ? JSON.parse(raw) : null;
            } catch {
              throw new Error(`${name} returned non-JSON (HTTP ${response.status})`);
            }
            if (!response.ok) {
              const message = payload && typeof payload === 'object'
                ? String(payload.message || payload.hint || payload.code || 'RPC failed')
                : 'RPC failed';
              throw new Error(`${name} failed HTTP ${response.status}: ${message}`);
            }
            return payload;
          }

          const requestIdRaw = await rpc('nvx_dispatch_google_ads_backfill_once', {
            p_from: '2026-08-01',
            p_to: '2026-08-31',
          });
          const requestId = Number(requestIdRaw);
          if (!Number.isSafeInteger(requestId) || requestId <= 0) {
            throw new Error('Google Ads dispatcher returned an invalid request id');
          }
          console.log(JSON.stringify({ dispatched: true, request_id: requestId }));

          for (let attempt = 1; attempt <= 60; attempt += 1) {
            const result = await rpc('nvx_get_google_ads_backfill_response', {
              p_request_id: requestId,
            });
            if (result?.ready === true) {
              if (result.timed_out === true) throw new Error('Google Ads internal dispatch timed out');
              const status = Number(result.status_code || 0);
              if (status < 200 || status >= 300) {
                throw new Error(`Google Ads internal dispatch failed HTTP ${status}`);
              }
              let content;
              try {
                content = JSON.parse(String(result.content || '{}'));
              } catch {
                throw new Error('Google Ads internal dispatcher returned non-JSON content');
              }
              if (content.success !== true) {
                const failures = Array.isArray(content.failures)
                  ? content.failures.map((item) => ({
                      customer_id: item?.customer_id || null,
                      kind: item?.kind || null,
                      message: item?.message || null,
                    }))
                  : [];
                console.error(JSON.stringify({ success: false, failures }));
                throw new Error('Google Ads backfill worker reported failure');
              }

              const summary = {
                success: true,
                provider: content.provider || null,
                api_version: content.api_version || null,
                date_range: content.date_range || null,
                accounts: Array.isArray(content.accounts) ? content.accounts : [],
              };
              if (summary.provider !== 'google_ads' || summary.accounts.length === 0) {
                throw new Error('Google Ads provider summary is incomplete');
              }
              fs.writeFileSync(path.join(runnerTemp, 'google-ads-provider-summary.json'), JSON.stringify(summary));
              console.log(JSON.stringify(summary));
              process.exit(0);
            }
            await new Promise((resolve) => setTimeout(resolve, 2_000));
          }
          throw new Error('Google Ads internal dispatch response was not observed before timeout');
          NODE

      - name: Verify provider totals equal persisted August facts
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { createClient } = require('@supabase/supabase-js');

          const summaryPath = path.join(String(process.env.RUNNER_TEMP || ''), 'google-ads-provider-summary.json');
          const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
          const range = summary.date_range || {};
          if (range.from !== '2026-08-01' || range.to !== '2026-08-31') {
            throw new Error('Provider summary does not cover the canonical August window');
          }

          const client = createClient(
            String(process.env.SUPABASE_URL || ''),
            String(process.env.SUPABASE_SERVICE_ROLE_KEY || ''),
            { auth: { persistSession: false, autoRefreshToken: false } },
          );

          const norm = (value) => String(value || '').replace(/\D/g, '');
          const round6 = (value) => Number(Number(value || 0).toFixed(6));
          const expected = new Map();
          for (const account of summary.accounts || []) {
            const customerId = norm(account.customer_id);
            if (!customerId || expected.has(customerId)) throw new Error('Provider returned invalid/duplicate customer identity');
            expected.set(customerId, {
              rows: Number(account.rows || 0),
              impressions: Number(account.impressions || 0),
              clicks: Number(account.clicks || 0),
              spend: round6(account.spend),
              conversions: round6(account.conversions),
            });
          }
          if (expected.size === 0) throw new Error('Provider returned no Google Ads accounts');

          (async () => {
            for (const [customerId, provider] of expected.entries()) {
              const { data, error } = await client
                .from('google_ads_daily_insights')
                .select('impressions,clicks,spend,conversions')
                .eq('customer_id', customerId)
                .gte('date', range.from)
                .lte('date', range.to);
              if (error) throw error;
              const persisted = (data || []).reduce((acc, row) => {
                acc.rows += 1;
                acc.impressions += Number(row.impressions || 0);
                acc.clicks += Number(row.clicks || 0);
                acc.spend += Number(row.spend || 0);
                acc.conversions += Number(row.conversions || 0);
                return acc;
              }, { rows: 0, impressions: 0, clicks: 0, spend: 0, conversions: 0 });
              persisted.spend = round6(persisted.spend);
              persisted.conversions = round6(persisted.conversions);

              for (const metric of ['rows', 'impressions', 'clicks', 'spend', 'conversions']) {
                if (persisted[metric] !== provider[metric]) {
                  throw new Error(`Provider/DB mismatch ${customerId} ${metric}: provider=${provider[metric]} db=${persisted[metric]}`);
                }
              }
              console.log(JSON.stringify({ customer_id: customerId, provider_db_match: true, ...persisted }));
            }
          })().catch((error) => {
            console.error(error.message || error);
            process.exit(1);
          });
          NODE

      - name: Verify connection and August range coverage
        run: node scripts/check-google-ads-db.js --json --from 2026-08-01 --to 2026-08-31

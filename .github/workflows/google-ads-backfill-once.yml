name: Google Ads August Backfill Once

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/google-ads-backfill-once.yml

permissions:
  contents: read

concurrency:
  group: google-ads-august-backfill-once
  cancel-in-progress: false

jobs:
  backfill:
    name: Backfill Google Ads August 2026
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Production
    env:
      SUPABASE_URL: https://ssvvuuysgxyqvmovrlvk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.NUVANX_SUPABASE_SERVICE_ROLE_KEY }}
      GOOGLE_ADS_SERVICE_ACCOUNT_RAW: ${{ secrets.GOOGLE_ADS_SERVICE_ACCOUNT }}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID || '' }}
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          cache: npm

      - name: Install workspace dependencies
        run: npm install --include=dev --ignore-scripts

      - name: Normalize and validate Google service account
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          import base64
          import json
          import os
          import re

          raw = os.environ.get('GOOGLE_ADS_SERVICE_ACCOUNT_RAW', '').strip()
          if not raw:
              raise SystemExit('GOOGLE_ADS_SERVICE_ACCOUNT is empty')

          candidates = []
          def add(label, value):
              value = (value or '').strip()
              if value and all(existing != value for _, existing in candidates):
                  candidates.append((label, value))

          add('raw', raw)
          if raw.startswith('GOOGLE_ADS_SERVICE_ACCOUNT='):
              add('assignment', raw.split('=', 1)[1])
          if raw[:1] in {'"', "'"} and raw[-1:] == raw[:1]:
              add('outer-quoted', raw[1:-1])
          if raw.startswith(('base64:', 'b64:')):
              add('base64-prefixed', raw.split(':', 1)[1])
          if '\\"' in raw:
              add('escaped-quotes', raw.replace('\\"', '"'))

          expanded = list(candidates)
          for label, value in expanded:
              compact = re.sub(r'\s+', '', value)
              padded = compact + ('=' * (-len(compact) % 4))
              for variant, decoder in (
                  ('base64', base64.b64decode),
                  ('base64url', base64.urlsafe_b64decode),
              ):
                  try:
                      decoded = decoder(padded.encode()).decode('utf-8').strip()
                  except Exception:
                      continue
                  add(f'{label}-{variant}', decoded)

          service_account = None
          matched = None
          for label, value in candidates:
              parsed = None
              try:
                  parsed = json.loads(value)
                  if isinstance(parsed, str):
                      parsed = json.loads(parsed)
              except Exception:
                  try:
                      parsed = ast.literal_eval(value)
                  except Exception:
                      parsed = None
              if isinstance(parsed, dict) and parsed.get('client_email') and parsed.get('private_key'):
                  service_account = parsed
                  matched = label
                  break

          if service_account is None:
              raise SystemExit('GOOGLE_ADS_SERVICE_ACCOUNT format is unsupported or missing client_email/private_key')

          canonical = json.dumps(service_account, separators=(',', ':'))
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              handle.write(f'GOOGLE_ADS_SERVICE_ACCOUNT={canonical}\n')
          print(f'Google service account normalized successfully ({matched}).')
          PY

      - name: Validate required runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -n "${GOOGLE_ADS_SERVICE_ACCOUNT:-}"
          test -n "${GOOGLE_ADS_DEVELOPER_TOKEN:-}"

      - name: Backfill August 2026
        run: node scripts/sync-google-ads-insights.js --from 2026-08-01 --to 2026-08-31

      - name: Verify canonical August totals
        run: node scripts/check-google-ads-db.js --json

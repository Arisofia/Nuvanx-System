name: Google Ads August Backfill Once

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/google-ads-backfill-once.yml

permissions:
  contents: read

concurrency:
  group: google-ads-august-backfill-once
  cancel-in-progress: false

jobs:
  backfill:
    name: Backfill Google Ads August 2026
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Production
    env:
      SUPABASE_URL: https://ssvvuuysgxyqvmovrlvk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.NUVANX_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          cache: npm

      - name: Install workspace dependencies
        run: npm install --include=dev --ignore-scripts

      - name: Validate server-side runtime contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"

      - name: Backfill August 2026 through Edge runtime
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --header "Content-Type: application/json" \
            --data '{"from":"2026-08-01","to":"2026-08-31"}' \
            "${SUPABASE_URL}/functions/v1/google-ads-daily-sync")"

          node - "$response_file" "$status" <<'NODE'
          const fs = require('fs');
          const [file, status] = process.argv.slice(2);
          const raw = fs.readFileSync(file, 'utf8');
          let payload;
          try {
            payload = JSON.parse(raw);
          } catch {
            throw new Error(`Google Ads Edge runtime returned non-JSON (HTTP ${status})`);
          }
          if (Number(status) < 200 || Number(status) >= 300 || payload.success !== true) {
            const safe = {
              status: Number(status),
              success: payload.success === true,
              provider: payload.provider || null,
              kind: payload.kind || null,
              message: payload.message || null,
              failures: Array.isArray(payload.failures)
                ? payload.failures.map((item) => ({
                    customer_id: item.customer_id || null,
                    kind: item.kind || null,
                    message: item.message || null,
                  }))
                : [],
            };
            console.error(JSON.stringify(safe));
            process.exit(1);
          }
          const summary = {
            success: true,
            provider: payload.provider || null,
            api_version: payload.api_version || null,
            date_range: payload.date_range || null,
            accounts: Array.isArray(payload.accounts) ? payload.accounts : [],
          };
          console.log(JSON.stringify(summary));
          NODE

      - name: Verify canonical August totals
        run: node scripts/check-google-ads-db.js --json --from 2026-08-01 --to 2026-08-31

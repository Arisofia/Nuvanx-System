name: Google Ads August Backfill Once

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/google-ads-backfill-once.yml
      - supabase/functions/google-ads-backfill-dispatcher/**
      - supabase/migrations/20260901012500_add_google_ads_internal_backfill_dispatch.sql

permissions:
  contents: read

concurrency:
  group: google-ads-august-backfill-once
  cancel-in-progress: false

jobs:
  backfill:
    name: Backfill Google Ads August 2026
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Production
    env:
      SUPABASE_URL: https://ssvvuuysgxyqvmovrlvk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.NUVANX_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          cache: npm

      - name: Install workspace dependencies
        run: npm install --include=dev --ignore-scripts

      - name: Validate server-side runtime contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}"

      - name: Dispatch and await August 2026 backfill
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = String(process.env.SUPABASE_URL || '').replace(/\/$/, '');
          const key = String(process.env.SUPABASE_SERVICE_ROLE_KEY || '');
          if (!base || !key) throw new Error('Supabase runtime contract unavailable');

          async function rpc(name, body) {
            const response = await fetch(`${base}/rest/v1/rpc/${name}`, {
              method: 'POST',
              headers: {
                apikey: key,
                Authorization: `Bearer ${key}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify(body),
              signal: AbortSignal.timeout(20_000),
            });
            const raw = await response.text();
            let payload;
            try {
              payload = raw ? JSON.parse(raw) : null;
            } catch {
              throw new Error(`${name} returned non-JSON (HTTP ${response.status})`);
            }
            if (!response.ok) {
              const message = payload && typeof payload === 'object'
                ? String(payload.message || payload.hint || payload.code || 'RPC failed')
                : 'RPC failed';
              throw new Error(`${name} failed HTTP ${response.status}: ${message}`);
            }
            return payload;
          }

          const requestIdRaw = await rpc('nvx_dispatch_google_ads_backfill_once', {
            p_from: '2026-08-01',
            p_to: '2026-08-31',
          });
          const requestId = Number(requestIdRaw);
          if (!Number.isSafeInteger(requestId) || requestId <= 0) {
            throw new Error('Google Ads dispatcher returned an invalid request id');
          }
          console.log(JSON.stringify({ dispatched: true, request_id: requestId }));

          for (let attempt = 1; attempt <= 60; attempt += 1) {
            const result = await rpc('nvx_get_google_ads_backfill_response', {
              p_request_id: requestId,
            });
            if (result?.ready === true) {
              if (result.timed_out === true) throw new Error('Google Ads internal dispatch timed out');
              const status = Number(result.status_code || 0);
              if (status < 200 || status >= 300) {
                throw new Error(`Google Ads internal dispatch failed HTTP ${status}`);
              }
              let content;
              try {
                content = JSON.parse(String(result.content || '{}'));
              } catch {
                throw new Error('Google Ads internal dispatcher returned non-JSON content');
              }
              if (content.success !== true) {
                const failures = Array.isArray(content.failures)
                  ? content.failures.map((item) => ({
                      customer_id: item?.customer_id || null,
                      kind: item?.kind || null,
                      message: item?.message || null,
                    }))
                  : [];
                console.error(JSON.stringify({ success: false, failures }));
                throw new Error('Google Ads backfill worker reported failure');
              }
              console.log(JSON.stringify({
                success: true,
                provider: content.provider || null,
                api_version: content.api_version || null,
                date_range: content.date_range || null,
                accounts: Array.isArray(content.accounts) ? content.accounts : [],
              }));
              process.exit(0);
            }
            await new Promise((resolve) => setTimeout(resolve, 2_000));
          }
          throw new Error('Google Ads internal dispatch response was not observed before timeout');
          NODE

      - name: Verify canonical August totals
        run: node scripts/check-google-ads-db.js --json --from 2026-08-01 --to 2026-08-31

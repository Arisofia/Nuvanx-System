# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Deploy Standalone Edge Functions

on:
  workflow_run:
    workflows: ['Master System']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# One automatic owner deploys the governed standalone/Control Centre Edge set.
# Manual Maintenance shares this lock only as an explicit break-glass operation.
concurrency:
  group: manual-maintenance-deploy_edge
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy · governed Edge Functions
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: Production
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      QUALITY_APPROVED_SHA: ${{ github.event.workflow_run.head_sha }}
      CORS_ALLOWED_ORIGINS: https://nuvanx-frontend.jenineferderas.workers.dev
      FRONTEND_URL: https://nuvanx-frontend.jenineferderas.workers.dev
      PRODUCTION_FALLBACK_URL: https://nuvanx-frontend.jenineferderas.workers.dev
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: '8265708501'
      GOOGLE_ADS_AUTH_MODE: service_account
      GOOGLE_ADS_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_ADS_SERVICE_ACCOUNT }}
      GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
      GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
      GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify current main is the quality-approved candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git rev-parse HEAD)"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            test -n "${QUALITY_APPROVED_SHA:-}"
            if [[ "$CURRENT_SHA" != "$QUALITY_APPROVED_SHA" ]]; then
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              echo "Current main $CURRENT_SHA advanced beyond approved candidate $QUALITY_APPROVED_SHA; a newer Master System run will own deployment."
              exit 0
            fi
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$CURRENT_SHA" >> "$GITHUB_OUTPUT"

      - name: Validate production deployment configuration
        if: ${{ steps.candidate.outputs.deploy == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_PROJECT_REF:-}"
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${CORS_ALLOWED_ORIGINS:-}"
          test -n "${FRONTEND_URL:-}"
          test -n "${PRODUCTION_FALLBACK_URL:-}"
          test -n "${GOOGLE_ADS_LOGIN_CUSTOMER_ID:-}"
          test -n "${GOOGLE_ADS_AUTH_MODE:-}"
          [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]
          [[ "$SUPABASE_ACCESS_TOKEN" =~ ^sbp_[A-Za-z0-9]+$ ]]
          [[ "$GOOGLE_ADS_LOGIN_CUSTOMER_ID" == "8265708501" ]]
          [[ "$GOOGLE_ADS_AUTH_MODE" == "service_account" ]]
          if [ -z "${DATABASE_URL:-}" ] && [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error::DATABASE_URL or SUPABASE_DB_PASSWORD is required for migration parity validation"
            exit 1
          fi

      - name: Setup Node.js
        if: ${{ steps.candidate.outputs.deploy == 'true' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          cache: npm

      - name: Validate Google Ads Edge auth identity
        if: ${{ steps.candidate.outputs.deploy == 'true' }}
        run: node scripts/converge-google-ads-edge-auth.js --validate-only

      - name: Setup Deno
        if: ${{ steps.candidate.outputs.deploy == 'true' }}
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x

      - name: Wait for automatic Production migration owner
        if: ${{ steps.candidate.outputs.deploy == 'true' }}
        uses: ./.github/actions/supabase-link-run
        with:
          project_ref: ${{ env.SUPABASE_PROJECT_REF }}
          supabase_access_token: ${{ env.SUPABASE_ACCESS_TOKEN }}
          database_url: ${{ env.DATABASE_URL }}
          supabase_db_password: ${{ env.SUPABASE_DB_PASSWORD }}
          skip_link: true
          command: |
            set -euo pipefail
            REQUIRED_MIGRATIONS=(20260901190000 20260901190100 20260901190200 20260903142000 20260905141000 20260905144500 20260905173500)
            for ATTEMPT in {1..20}; do
              MIGRATION_STATUS="$(supabase migration list --db-url "${SESSION_URL:-$DATABASE_URL}" 2>&1)"
              MISSING_MIGRATIONS=()
              for REQUIRED_MIGRATION in "${REQUIRED_MIGRATIONS[@]}"; do
                if ! printf '%s\n' "$MIGRATION_STATUS" | grep -Eq "^[[:space:]]*${REQUIRED_MIGRATION}[[:space:]]*[|│][[:space:]]*${REQUIRED_MIGRATION}[[:space:]]*([|│]|$)"; then
                  MISSING_MIGRATIONS+=("$REQUIRED_MIGRATION")
                fi
              done

              if [ "${#MISSING_MIGRATIONS[@]}" -eq 0 ]; then
                printf '%s\n' "$MIGRATION_STATUS"
                echo "All migration-dependent Edge schemas are present in LOCAL and REMOTE history."
                break
              fi

              if [ "$ATTEMPT" -eq 20 ]; then
                printf '%s\n' "$MIGRATION_STATUS"
                echo "::error::Automatic Production migration owner did not converge required migrations: ${MISSING_MIGRATIONS[*]}. Refusing Edge deployment."
                exit 1
              fi

              echo "Waiting for automatic Production migration owner; missing: ${MISSING_MIGRATIONS[*]} (attempt ${ATTEMPT}/20)."
              sleep 15
            done

      - name: Revalidate governed Edge candidate
        if: ${{ steps.candidate.outputs.deploy == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --include=dev --ignore-scripts
          npm test
          deno check --config=supabase/functions/deno.json \
            supabase/functions/api/index.ts \
            supabase/functions/mcp/index.ts \
            supabase/functions/daily-aggregates/index.ts \
            supabase/functions/auth/index.ts \
            supabase/functions/health/index.ts \
            supabase/functions/playbooks/index.ts \
            supabase/functions/dashboard/index.ts \
            supabase/functions/agent-run/index.ts \
            supabase/functions/runtime-bootstrap/index.ts \
            supabase/functions/control-centre-provider/index.ts \
            supabase/functions/google-ads-auth-preflight/index.ts \
            supabase/functions/google-ads-health/index.ts \
            supabase/functions/google-ads-daily-sync/index.ts \
            supabase/functions/google-ads-backfill-dispatcher/index.ts \
            supabase/functions/meta-lead-backfill/index.ts \
            supabase/functions/meta-daily-insights/index.ts \
            supabase/functions/meta-routing-audit/index.ts \
            supabase/functions/meta-leadgen-subscribe/index.ts \
            supabase/functions/meta-hubspot-sync/index.ts \
            supabase/functions/meta-capi-dispatch/index.ts \
            supabase/functions/hubspot-marketing-contact-monitor/index.ts \
            supabase/functions/revops-dispatcher/index.ts \
            supabase/functions/whatsapp-send/index.ts \
            supabase/functions/whatsapp-outbound-worker/index.ts \
            supabase/functions/whatsapp-provider-acceptance/index.ts \
            supabase/functions/whatsapp-status-webhook/index.ts \
            supabase/functions/google-click-attribution/index.ts \
            supabase/functions/google-data-manager-export/index.ts \
            supabase/functions/seo-web-performance/index.ts

      - name: Reverify remote main immediately before Production mutation
        id: mutation_guard
        if: ${{ steps.candidate.outputs.deploy == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          REMOTE_MAIN_SHA="$(git rev-parse origin/main)"
          CANDIDATE_SHA="${{ steps.candidate.outputs.candidate_sha }}"
          if [[ "$REMOTE_MAIN_SHA" != "$CANDIDATE_SHA" ]]; then
            echo "mutate=false" >> "$GITHUB_OUTPUT"
            echo "Remote main advanced to $REMOTE_MAIN_SHA beyond approved candidate $CANDIDATE_SHA; refusing stale Production mutation."
            exit 0
          fi
          echo "mutate=true" >> "$GITHUB_OUTPUT"

      - name: Deploy governed functions
        if: ${{ steps.candidate.outputs.deploy == 'true' && steps.mutation_guard.outputs.mutate == 'true' }}
        uses: ./.github/actions/supabase-link-run
        with:
          project_ref: ${{ env.SUPABASE_PROJECT_REF }}
          supabase_access_token: ${{ env.SUPABASE_ACCESS_TOKEN }}
          database_url: ${{ env.DATABASE_URL }}
          supabase_db_password: ${{ env.SUPABASE_DB_PASSWORD }}
          skip_link: true
          command: |
            set -euo pipefail
            test -n "${SUPABASE_PROJECT_REF:-}"
            test -n "${CORS_ALLOWED_ORIGINS:-}"
            test -n "${FRONTEND_URL:-}"
            test -n "${PRODUCTION_FALLBACK_URL:-}"
            test -n "${GOOGLE_ADS_LOGIN_CUSTOMER_ID:-}"
            test -n "${GOOGLE_ADS_AUTH_MODE:-}"
            [[ "$GOOGLE_ADS_LOGIN_CUSTOMER_ID" == "8265708501" ]]
            [[ "$GOOGLE_ADS_AUTH_MODE" == "service_account" ]]

            supabase secrets set \
              CORS_ALLOWED_ORIGINS="$CORS_ALLOWED_ORIGINS" \
              FRONTEND_URL="$FRONTEND_URL" \
              PRODUCTION_FALLBACK_URL="$PRODUCTION_FALLBACK_URL" \
              GOOGLE_ADS_LOGIN_CUSTOMER_ID="$GOOGLE_ADS_LOGIN_CUSTOMER_ID" \
              --project-ref "$SUPABASE_PROJECT_REF"

            node scripts/converge-google-ads-edge-auth.js

            supabase functions deploy api --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
            supabase functions deploy mcp --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
            supabase functions deploy daily-aggregates --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
            supabase functions deploy auth --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
            supabase functions deploy health --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
            supabase functions deploy playbooks --project-ref "$SUPABASE_PROJECT_REF"
            supabase functions deploy dashboard --project-ref "$SUPABASE_PROJECT_REF"
            supabase functions deploy agent-run --project-ref "$SUPABASE_PROJECT_REF"
            supabase functions deploy runtime-bootstrap --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
            supabase functions deploy control-centre-provider --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
            supabase functions deploy google-ads-auth-preflight --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
            supabase functions deploy google-ads-health --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
            supabase functions deploy google-ads-daily-sync --project-ref "$SUPABASE_PROJECT_REF"
            supabase functions deploy google-ads-backfill-dispatcher --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
            supabase functions deploy meta-lead-backfill --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
            supabase functions deploy meta-daily-insights --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
            supabase functions deploy meta-routing-audit --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
            supabase functions deploy meta-leadgen-subscribe --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
            supabase functions deploy meta-hubspot-sync --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
            supabase functions deploy meta-capi-dispatch --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
            supabase functions deploy hubspot-marketing-contact-monitor --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
            supabase functions deploy revops-dispatcher --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
            supabase functions deploy whatsapp-send --project-ref "$SUPABASE_PROJECT_REF"
            supabase functions deploy whatsapp-outbound-worker --project-ref "$SUPABASE_PROJECT_REF"
            supabase functions deploy whatsapp-provider-acceptance --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
            supabase functions deploy whatsapp-status-webhook --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
            supabase functions deploy google-click-attribution --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
            supabase functions deploy google-data-manager-export --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
            supabase functions deploy seo-web-performance --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
            supabase functions list --project-ref "$SUPABASE_PROJECT_REF"

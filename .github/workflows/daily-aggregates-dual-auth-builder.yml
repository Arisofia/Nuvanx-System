name: Daily Aggregates Dual Auth Builder

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  build-dual-auth:
    if: github.head_ref == 'fix/daily-aggregates-auth-20260825'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.x

      - name: Apply dual-auth hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('supabase/functions/daily-aggregates')
          index = root / 'index.ts'
          text = index.read_text()

          text = text.replace(
              "import { hasServiceRoleBearer } from './service-auth.ts';",
              "import { hasServiceRoleBearer, secretMatches } from './request-auth.ts';",
              1,
          )

          old_guard = """  if (!hasServiceRoleBearer(req, SUPABASE_SERVICE_ROLE_KEY)) {\n    return new Response(JSON.stringify({ success: false, error: 'Unauthorized' }), {\n      status: 401,\n      headers: { 'Content-Type': 'application/json' },\n    });\n  }\n\n"""
          new_guard = """  const authorizedByServiceRole = hasServiceRoleBearer(req, SUPABASE_SERVICE_ROLE_KEY);\n  let authorizedByInternalSecret = false;\n\n  if (!authorizedByServiceRole) {\n    const { data: expectedInternalSecret, error: internalSecretError } = await getSupabase().rpc('nvx_get_runtime_secret', {\n      p_name: 'REVOPS_INTERNAL_SECRET',\n    });\n\n    if (internalSecretError || !expectedInternalSecret) {\n      return new Response(JSON.stringify({ success: false, error: 'Server configuration error' }), {\n        status: 500,\n        headers: { 'Content-Type': 'application/json' },\n      });\n    }\n\n    authorizedByInternalSecret = await secretMatches(\n      String(req.headers.get('x-nvx-internal-secret') || ''),\n      String(expectedInternalSecret),\n    );\n  }\n\n  if (!authorizedByServiceRole && !authorizedByInternalSecret) {\n    return new Response(JSON.stringify({ success: false, error: 'Forbidden' }), {\n      status: 403,\n      headers: { 'Content-Type': 'application/json' },\n    });\n  }\n\n"""
          if old_guard not in text:
              raise SystemExit('service-role-only guard not found')
          text = text.replace(old_guard, new_guard, 1)
          index.write_text(text)

          (root / 'request-auth.ts').write_text("""export function hasServiceRoleBearer(request: Request, serviceRoleKey: string): boolean {\n  const expectedToken = serviceRoleKey.trim();\n  if (!expectedToken) return false;\n\n  const authorization = request.headers.get('authorization');\n  if (!authorization) return false;\n\n  const match = /^Bearer\\s+(.+)$/i.exec(authorization.trim());\n  if (!match) return false;\n\n  return match[1].trim() === expectedToken;\n}\n\nasync function sha256Bytes(raw: string): Promise<Uint8Array> {\n  return new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw)));\n}\n\nexport async function secretMatches(received: string, expected: string): Promise<boolean> {\n  const normalizedReceived = String(received || '').trim();\n  const normalizedExpected = String(expected || '').trim();\n  if (!normalizedReceived || !normalizedExpected) return false;\n\n  const a = await sha256Bytes(normalizedReceived);\n  const b = await sha256Bytes(normalizedExpected);\n  if (a.length !== b.length) return false;\n\n  let diff = 0;\n  for (let i = 0; i < a.length; i += 1) diff |= a[i] ^ b[i];\n  return diff === 0;\n}\n""")

          (root / 'request-auth.test.mjs').write_text("""import { describe, expect, it } from 'vitest';\nimport { hasServiceRoleBearer, secretMatches } from './request-auth.ts';\n\nfunction requestWithAuthorization(authorization) {\n  const headers = authorization === undefined ? {} : { Authorization: authorization };\n  return new Request('https://example.test/functions/v1/daily-aggregates', {\n    method: 'POST',\n    headers,\n    body: '{}',\n  });\n}\n\ndescribe('daily-aggregates request authorization', () => {\n  it('rejects missing, malformed and incorrect service-role credentials', () => {\n    expect(hasServiceRoleBearer(requestWithAuthorization(undefined), 'service-role-secret')).toBe(false);\n    expect(hasServiceRoleBearer(requestWithAuthorization('Basic service-role-secret'), 'service-role-secret')).toBe(false);\n    expect(hasServiceRoleBearer(requestWithAuthorization('Bearer wrong-secret'), 'service-role-secret')).toBe(false);\n    expect(hasServiceRoleBearer(requestWithAuthorization('Bearer service-role-secret'), '   ')).toBe(false);\n  });\n\n  it('accepts the exact configured service-role Bearer credential', () => {\n    expect(hasServiceRoleBearer(requestWithAuthorization('Bearer service-role-secret'), 'service-role-secret')).toBe(true);\n    expect(hasServiceRoleBearer(requestWithAuthorization('bearer   service-role-secret'), 'service-role-secret')).toBe(true);\n  });\n\n  it('matches the internal scheduler secret only when both non-empty values are exact', async () => {\n    await expect(secretMatches('', 'internal-secret')).resolves.toBe(false);\n    await expect(secretMatches('internal-secret', '')).resolves.toBe(false);\n    await expect(secretMatches('wrong-secret', 'internal-secret')).resolves.toBe(false);\n    await expect(secretMatches(' internal-secret ', 'internal-secret')).resolves.toBe(true);\n  });\n});\n""")

          for obsolete in [root / 'service-auth.ts', root / 'service-auth.test.mjs']:
              if obsolete.exists():
                  obsolete.unlink()

          migration = Path('supabase/migrations/20260825184500_harden_daily_aggregates_internal_auth.sql')
          migration.write_text("""-- Harden the existing daily Meta scheduler without creating a second owner.\n-- The 05:00 pg_cron job authenticates with the environment-local Vault secret;\n-- GitHub reconciliation continues to use the service-role Bearer path.\n\ndo $$\ndeclare\n  v_job record;\n  v_command text;\n  v_old text := $old$'Authorization', 'Bearer ' || current_setting('SUPABASE_SERVICE_ROLE_KEY', true),$old$;\n  v_new text := $new$'x-nvx-internal-secret', (select decrypted_secret from vault.decrypted_secrets where name = 'REVOPS_INTERNAL_SECRET' limit 1),$new$;\nbegin\n  if not exists (select 1 from pg_extension where extname = 'pg_cron') then\n    raise notice 'Skipping daily-aggregates auth hardening: pg_cron is unavailable';\n    return;\n  end if;\n\n  if not exists (\n    select 1\n    from vault.decrypted_secrets\n    where name = 'REVOPS_INTERNAL_SECRET'\n      and length(trim(decrypted_secret)) >= 32\n  ) then\n    raise exception 'REVOPS_INTERNAL_SECRET is unavailable; refusing to leave daily-aggregates scheduler unauthenticated';\n  end if;\n\n  for v_job in\n    select jobid, command\n    from cron.job\n    where jobname = 'fetch-meta-daily-insights'\n  loop\n    v_command := v_job.command;\n\n    if position('x-nvx-internal-secret' in v_command) > 0 then\n      continue;\n    end if;\n\n    if position(v_old in v_command) = 0 then\n      raise exception 'Unexpected fetch-meta-daily-insights auth contract; refusing unsafe rewrite';\n    end if;\n\n    v_command := replace(v_command, v_old, v_new);\n    perform cron.alter_job(v_job.jobid, command := v_command);\n  end loop;\nend;\n$$;\n""")

          (root / 'auth-contract.test.mjs').write_text("""import { readFileSync } from 'node:fs';\nimport { describe, expect, it } from 'vitest';\n\nconst index = readFileSync('supabase/functions/daily-aggregates/index.ts', 'utf8');\nconst migration = readFileSync('supabase/migrations/20260825184500_harden_daily_aggregates_internal_auth.sql', 'utf8');\n\ndescribe('daily-aggregates dual auth contract', () => {\n  it('authorizes before request body parsing and preserves both legitimate owners', () => {\n    const serviceRoleCheck = index.indexOf('authorizedByServiceRole');\n    const internalSecretCheck = index.indexOf('authorizedByInternalSecret');\n    const bodyParse = index.indexOf('await req.json()');\n    expect(serviceRoleCheck).toBeGreaterThan(-1);\n    expect(internalSecretCheck).toBeGreaterThan(-1);\n    expect(bodyParse).toBeGreaterThan(internalSecretCheck);\n    expect(index).toContain("p_name: 'REVOPS_INTERNAL_SECRET'");\n    expect(index).toContain("req.headers.get('x-nvx-internal-secret')");\n  });\n\n  it('alters the existing scheduler in place instead of creating another owner', () => {\n    expect(migration).toContain("jobname = 'fetch-meta-daily-insights'");\n    expect(migration).toContain('cron.alter_job');\n    expect(migration).toContain('REVOPS_INTERNAL_SECRET');\n    expect(migration).not.toContain('cron.schedule(');\n  });\n});\n""")
          PY

      - name: Install dependencies
        run: npm install --include=dev --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Deno type-check
        run: |
          deno check --config=supabase/functions/deno.json \
            supabase/functions/daily-aggregates/request-auth.ts \
            supabase/functions/daily-aggregates/index.ts

      - name: Commit validated permanent changes
        shell: bash
        run: |
          set -euo pipefail
          git add \
            supabase/functions/daily-aggregates/index.ts \
            supabase/functions/daily-aggregates/request-auth.ts \
            supabase/functions/daily-aggregates/request-auth.test.mjs \
            supabase/functions/daily-aggregates/auth-contract.test.mjs \
            supabase/migrations/20260825184500_harden_daily_aggregates_internal_auth.sql \
            supabase/functions/daily-aggregates/service-auth.ts \
            supabase/functions/daily-aggregates/service-auth.test.mjs
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(security): harden daily aggregates scheduler auth'
          git push origin HEAD:${{ github.head_ref }}

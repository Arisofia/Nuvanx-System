name: Enable Supabase Leaked Password Protection

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/enable-supabase-leaked-password-protection.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuvanx-supabase-auth-config
  cancel-in-progress: false

jobs:
  enable-password-hibp:
    name: Supabase Auth · leaked-password protection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Validate governed inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_PROJECT_REF:-}"
          [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]
          [[ "$SUPABASE_ACCESS_TOKEN" =~ ^sbp_[A-Za-z0-9]+$ ]]

      - name: Read current Auth configuration
        id: before
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/config/auth")"
          current="$(jq -r '.password_hibp_enabled // false' <<<"$response")"
          [[ "$current" == "true" || "$current" == "false" ]]
          echo "enabled=$current" >> "$GITHUB_OUTPUT"
          echo "Leaked-password protection currently enabled: $current"

      - name: Enable leaked-password protection
        if: steps.before.outputs.enabled != 'true'
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"password_hibp_enabled":true}' \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/config/auth")"
          enabled="$(jq -r '.password_hibp_enabled // false' <<<"$response")"
          test "$enabled" = "true"
          echo "Supabase Auth accepted password_hibp_enabled=true."

      - name: Verify final Auth configuration
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/config/auth")"
          enabled="$(jq -r '.password_hibp_enabled // false' <<<"$response")"
          test "$enabled" = "true"
          echo "Leaked-password protection verified enabled."

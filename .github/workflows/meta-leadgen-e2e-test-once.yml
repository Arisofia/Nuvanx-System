# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: Meta Leadgen E2E Test Once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  meta-leadgen-e2e:
    name: E2E · minimal Meta test lead → webhook → Supabase
    if: ${{ github.head_ref == 'diagnostic/meta-leadgen-subscription-20260820' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Create PII-free test lead, prove lineage, and clean up
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          NUVANX_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NUVANX_SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = await import('node:crypto');

          const graphVersion = 'v22.0';
          const systemUserId = '61569256954284';
          const pageId = '685010274687129';
          const supabaseBase = 'https://ssvvuuysgxyqvmovrlvk.supabase.co';
          const systemUserToken = String(process.env.META_ACCESS_TOKEN || '').trim();
          const appSecret = String(process.env.META_APP_SECRET || '').trim();
          const serviceKey = String(process.env.NUVANX_SUPABASE_SERVICE_ROLE_KEY || '').trim();

          if (!systemUserToken || !appSecret || !serviceKey) {
            console.error('META_MINIMAL_E2E_STATUS=ABORT_MISSING_REQUIRED_SECRET');
            process.exit(2);
          }

          const proof = (token) => crypto.createHmac('sha256', appSecret).update(token).digest('hex');

          async function parseResponse(response) {
            const text = await response.text();
            let payload = null;
            try { payload = JSON.parse(text); } catch {}
            if (!response.ok || payload?.error) {
              const e = payload?.error || {};
              const err = new Error(String(e.message || text || `HTTP ${response.status}`).replace(/[A-Za-z0-9_-]{32,}/g, '[masked]'));
              err.status = response.status;
              err.code = e.code ?? null;
              throw err;
            }
            return payload ?? {};
          }

          async function graphRequest(method, path, params, token) {
            const url = new URL(`https://graph.facebook.com/${graphVersion}${path}`);
            for (const [key, value] of Object.entries(params || {})) url.searchParams.set(key, String(value));
            url.searchParams.set('access_token', token);
            url.searchParams.set('appsecret_proof', proof(token));
            return parseResponse(await fetch(url, {
              method,
              headers: { Accept: 'application/json' },
              signal: AbortSignal.timeout(20000),
            }));
          }

          async function resolvePageToken() {
            const payload = await graphRequest('GET', `/${systemUserId}/accounts`, { fields: 'id,name,access_token' }, systemUserToken);
            const page = (Array.isArray(payload.data) ? payload.data : []).find((item) => String(item?.id || '') === pageId);
            const token = String(page?.access_token || '').trim();
            if (!token) throw new Error('Target Page access token was not resolved.');
            return token;
          }

          async function rest(method, table, query) {
            const url = new URL(`${supabaseBase}/rest/v1/${table}`);
            for (const [key, value] of Object.entries(query || {})) url.searchParams.set(key, String(value));
            const response = await fetch(url, {
              method,
              headers: {
                Authorization: `Bearer ${serviceKey}`,
                apikey: serviceKey,
                Accept: 'application/json',
                ...(method === 'DELETE' ? { Prefer: 'return=representation' } : {}),
              },
              signal: AbortSignal.timeout(15000),
            });
            return parseResponse(response);
          }

          async function cleanupDb(leadgenId, leadId) {
            if (!leadgenId) return true;
            await rest('DELETE', 'meta_attribution', { leadgen_id: `eq.${leadgenId}` });
            if (leadId) await rest('DELETE', 'leads', { id: `eq.${leadId}`, external_id: `eq.${leadgenId}`, source: 'eq.meta_leadgen' });
            const a = await rest('GET', 'meta_attribution', { leadgen_id: `eq.${leadgenId}`, select: 'leadgen_id', limit: '1' });
            const l = leadId ? await rest('GET', 'leads', { id: `eq.${leadId}`, select: 'id', limit: '1' }) : [];
            return Array.isArray(a) && a.length === 0 && Array.isArray(l) && l.length === 0;
          }

          let pageToken = '';
          let createdLeadId = '';
          let insertedLeadId = '';

          try {
            pageToken = await resolvePageToken();
            console.log('META_MINIMAL_E2E_PAGE_TOKEN_RESOLVED=true');

            const subscriptions = await graphRequest('GET', `/${pageId}/subscribed_apps`, { fields: 'id,name,subscribed_fields' }, pageToken);
            const subscribed = Array.isArray(subscriptions.data) && subscriptions.data.some((app) => Array.isArray(app?.subscribed_fields) && app.subscribed_fields.includes('leadgen'));
            console.log(`META_MINIMAL_E2E_LEADGEN_SUBSCRIBED=${subscribed}`);
            if (!subscribed) throw new Error('Page is not subscribed to leadgen.');

            const formsPayload = await graphRequest('GET', `/${pageId}/leadgen_forms`, { fields: 'id,name,status,created_time', limit: '100' }, pageToken);
            const forms = (Array.isArray(formsPayload.data) ? formsPayload.data : [])
              .filter((form) => String(form?.status || '').toUpperCase() === 'ACTIVE');
            console.log(`META_MINIMAL_E2E_ACTIVE_FORMS=${forms.length}`);

            let selected = null;
            for (const form of forms) {
              const tests = await graphRequest('GET', `/${form.id}/test_leads`, { fields: 'id,created_time', limit: '10' }, pageToken);
              const count = Array.isArray(tests.data) ? tests.data.length : 0;
              console.log(`META_MINIMAL_E2E_FORM id=${form.id} test_leads=${count}`);
              if (count === 0) { selected = form; break; }
            }
            if (!selected) throw new Error('No active form with zero test leads is available.');

            console.log(`META_MINIMAL_E2E_FORM_ID=${selected.id}`);
            console.log(`META_MINIMAL_E2E_FORM_NAME=${JSON.stringify(String(selected.name || ''))}`);

            try {
              const created = await graphRequest('POST', `/${selected.id}/test_leads`, {}, pageToken);
              createdLeadId = String(created?.id || '').trim();
            } catch (error) {
              console.log(`META_MINIMAL_E2E_CREATE_ERROR_CODE=${error?.code ?? 'unknown'}`);
              console.log(`META_MINIMAL_E2E_CREATE_ERROR_HTTP=${error?.status ?? 'unknown'}`);
              const after = await graphRequest('GET', `/${selected.id}/test_leads`, { fields: 'id,created_time', limit: '10' }, pageToken);
              const tests = Array.isArray(after.data) ? after.data : [];
              if (tests.length === 1) {
                createdLeadId = String(tests[0]?.id || '').trim();
                console.log('META_MINIMAL_E2E_RECOVERED_AFTER_ERROR=true');
              } else {
                throw error;
              }
            }

            if (!createdLeadId) throw new Error('Meta did not create a minimal test lead.');
            console.log(`META_MINIMAL_E2E_LEADGEN_ID=${createdLeadId}`);
            console.log('META_MINIMAL_E2E_TEST_LEAD_CREATED=true');

            let attribution = null;
            let lead = null;
            for (let attempt = 1; attempt <= 15; attempt += 1) {
              const attrs = await rest('GET', 'meta_attribution', {
                leadgen_id: `eq.${createdLeadId}`,
                select: 'lead_id,leadgen_id,page_id,form_id,captured_at',
                limit: '1',
              });
              if (Array.isArray(attrs) && attrs.length === 1) {
                attribution = attrs[0];
                insertedLeadId = String(attribution.lead_id || '');
                const leads = await rest('GET', 'leads', {
                  id: `eq.${insertedLeadId}`,
                  select: 'id,external_id,source,email,phone,created_at',
                  limit: '1',
                });
                if (Array.isArray(leads) && leads.length === 1) {
                  lead = leads[0];
                  break;
                }
              }
              console.log(`META_MINIMAL_E2E_POLL_ATTEMPT=${attempt}`);
              await new Promise((resolve) => setTimeout(resolve, 2500));
            }

            const lineageOk = Boolean(attribution && lead)
              && String(attribution.leadgen_id) === createdLeadId
              && String(attribution.lead_id) === String(lead.id)
              && String(lead.external_id) === createdLeadId
              && String(lead.source) === 'meta_leadgen';

            console.log(`META_MINIMAL_E2E_ATTRIBUTION_FOUND=${Boolean(attribution)}`);
            console.log(`META_MINIMAL_E2E_LEAD_FOUND=${Boolean(lead)}`);
            console.log(`META_MINIMAL_E2E_LINEAGE_MATCH=${lineageOk}`);
            if (lead) {
              console.log(`META_MINIMAL_E2E_PII_FREE=${!lead.email && !lead.phone}`);
            }

            if (!lineageOk) {
              console.error('META_MINIMAL_E2E_STATUS=FAILED_NO_WEBHOOK_LINEAGE');
              process.exitCode = 30;
            } else {
              console.log('META_MINIMAL_E2E_STATUS=SUCCESS');
            }
          } catch (error) {
            console.error(`META_MINIMAL_E2E_STATUS=ABORTED code=${error?.code ?? 'unknown'} status=${error?.status ?? 'unknown'}`);
            console.error(`META_MINIMAL_E2E_ERROR=${String(error?.message || error).replace(/[A-Za-z0-9_-]{32,}/g, '[masked]')}`);
            process.exitCode = 31;
          } finally {
            if (createdLeadId && pageToken) {
              try {
                const deleted = await graphRequest('DELETE', `/${createdLeadId}`, {}, pageToken);
                console.log(`META_MINIMAL_E2E_META_TEST_CLEANUP=${deleted?.success === true}`);
              } catch (error) {
                console.log(`META_MINIMAL_E2E_META_TEST_CLEANUP_ERROR code=${error?.code ?? 'unknown'} status=${error?.status ?? 'unknown'}`);
              }
              try {
                const dbClean = await cleanupDb(createdLeadId, insertedLeadId);
                console.log(`META_MINIMAL_E2E_DB_CLEANUP=${dbClean}`);
                if (!dbClean && !process.exitCode) process.exitCode = 32;
              } catch (error) {
                console.log(`META_MINIMAL_E2E_DB_CLEANUP_ERROR=${String(error?.message || error)}`);
                if (!process.exitCode) process.exitCode = 33;
              }
            } else {
              console.log('META_MINIMAL_E2E_CLEANUP=NO_TEST_LEAD_CREATED');
            }
          }
          NODE

# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: Deploy Attribution Edge Functions

on:
  workflow_dispatch:
    inputs:
      function:
        description: Attribution/RevOps function to deploy
        required: true
        default: all
        type: choice
        options:
          - all
          - web-events
          - google-click-attribution
          - runtime-bootstrap
          - lead-captured
          - web-lead-reconcile
          - deal-factory
      confirm_production:
        description: Type DEPLOY to authorize production deployment
        required: true
        type: string

concurrency:
  group: deploy-attribution-edge-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate attribution and RevOps contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install workspace dependencies
        run: npm ci

      - name: Gate attribution and RevOps contracts
        run: >-
          npx vitest run
          supabase/functions/web-events/index.test.mjs
          supabase/functions/lead-captured/index.test.mjs
          supabase/functions/runtime-bootstrap/index.test.mjs
          supabase/functions/web-lead-reconcile/index.test.mjs
          supabase/functions/deal-factory/index.test.mjs

      - name: Type-check governed Edge Functions
        run: >-
          deno check --config=supabase/functions/deno.json
          supabase/functions/web-events/index.ts
          supabase/functions/google-click-attribution/index.ts
          supabase/functions/runtime-bootstrap/index.ts
          supabase/functions/lead-captured/index.ts
          supabase/functions/web-lead-reconcile/index.ts
          supabase/functions/deal-factory/index.ts

  deploy:
    name: Deploy attribution and RevOps functions
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      DEPLOY_FUNCTION: ${{ inputs.function }}
      CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
    steps:
      - uses: actions/checkout@v5

      - name: Fail closed unless production deployment is explicit
        shell: bash
        run: |
          set -euo pipefail
          [ "$CONFIRM_PRODUCTION" = "DEPLOY" ] || { echo "::error::confirm_production must equal DEPLOY"; exit 1; }
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || { echo "::error::SUPABASE_ACCESS_TOKEN is required"; exit 1; }
          [ -n "${SUPABASE_PROJECT_REF:-}" ] || { echo "::error::SUPABASE_PROJECT_REF is required"; exit 1; }
          [[ "${SUPABASE_PROJECT_REF:-}" =~ ^[a-z0-9]{20}$ ]] || { echo "::error::SUPABASE_PROJECT_REF format is invalid"; exit 1; }
          [[ "$DEPLOY_FUNCTION" =~ ^(all|web-events|google-click-attribution|runtime-bootstrap|lead-captured|web-lead-reconcile|deal-factory)$ ]] || { echo "::error::Unsupported function selection"; exit 1; }
          if [ -z "${DATABASE_URL:-}" ] && [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error::DATABASE_URL or SUPABASE_DB_PASSWORD is required"
            exit 1
          fi

      - name: Preflight legacy web-events secret only when CAPI is selected
        if: ${{ inputs.function == 'all' || inputs.function == 'web-events' }}
        uses: ./.github/actions/supabase-link-run
        with:
          project_ref: ${{ env.SUPABASE_PROJECT_REF }}
          supabase_access_token: ${{ env.SUPABASE_ACCESS_TOKEN }}
          database_url: ${{ env.DATABASE_URL }}
          supabase_db_password: ${{ env.SUPABASE_DB_PASSWORD }}
          skip_link: true
          command: |
            set -euo pipefail
            secrets="$(supabase secrets list --project-ref "$SUPABASE_PROJECT_REF")"
            secret_names="$({
              printf '%s\n' "$secrets" \
                | tr '│|' '  ' \
                | awk '{ for (i = 1; i <= NF; i += 1) if ($i ~ /^[A-Z][A-Z0-9_]+$/) { print $i; break } }'
            } | sort -u)"
            grep -Fxq 'NUVANX_WEB_EVENT_SECRET' <<<"$secret_names" || {
              echo "::error::NUVANX_WEB_EVENT_SECRET is not configured in Supabase; web-events deploy remains blocked"
              exit 1
            }

      - name: Apply canonical attribution/RevOps migrations
        if: >-
          ${{ inputs.function == 'all' || inputs.function == 'runtime-bootstrap' ||
              inputs.function == 'lead-captured' || inputs.function == 'web-lead-reconcile' ||
              inputs.function == 'deal-factory' }}
        uses: ./.github/actions/supabase-link-run
        with:
          project_ref: ${{ env.SUPABASE_PROJECT_REF }}
          supabase_access_token: ${{ env.SUPABASE_ACCESS_TOKEN }}
          database_url: ${{ env.DATABASE_URL }}
          supabase_db_password: ${{ env.SUPABASE_DB_PASSWORD }}
          skip_link: false
          command: |
            set -euo pipefail
            bash scripts/supabase-migrate.sh

      - name: Deploy google-click-attribution
        if: ${{ inputs.function == 'all' || inputs.function == 'google-click-attribution' }}
        uses: ./.github/actions/supabase-link-run
        with:
          project_ref: ${{ env.SUPABASE_PROJECT_REF }}
          supabase_access_token: ${{ env.SUPABASE_ACCESS_TOKEN }}
          database_url: ${{ env.DATABASE_URL }}
          supabase_db_password: ${{ env.SUPABASE_DB_PASSWORD }}
          skip_link: true
          command: supabase functions deploy google-click-attribution --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Deploy web-events
        if: ${{ inputs.function == 'all' || inputs.function == 'web-events' }}
        uses: ./.github/actions/supabase-link-run
        with:
          project_ref: ${{ env.SUPABASE_PROJECT_REF }}
          supabase_access_token: ${{ env.SUPABASE_ACCESS_TOKEN }}
          database_url: ${{ env.DATABASE_URL }}
          supabase_db_password: ${{ env.SUPABASE_DB_PASSWORD }}
          skip_link: true
          command: supabase functions deploy web-events --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Deploy runtime-bootstrap
        if: ${{ inputs.function == 'all' || inputs.function == 'runtime-bootstrap' }}
        uses: ./.github/actions/supabase-link-run
        with:
          project_ref: ${{ env.SUPABASE_PROJECT_REF }}
          supabase_access_token: ${{ env.SUPABASE_ACCESS_TOKEN }}
          database_url: ${{ env.DATABASE_URL }}
          supabase_db_password: ${{ env.SUPABASE_DB_PASSWORD }}
          skip_link: true
          command: supabase functions deploy runtime-bootstrap --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Deploy lead-captured
        if: ${{ inputs.function == 'all' || inputs.function == 'lead-captured' }}
        uses: ./.github/actions/supabase-link-run
        with:
          project_ref: ${{ env.SUPABASE_PROJECT_REF }}
          supabase_access_token: ${{ env.SUPABASE_ACCESS_TOKEN }}
          database_url: ${{ env.DATABASE_URL }}
          supabase_db_password: ${{ env.SUPABASE_DB_PASSWORD }}
          skip_link: true
          command: supabase functions deploy lead-captured --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Deploy web-lead-reconcile
        if: ${{ inputs.function == 'all' || inputs.function == 'web-lead-reconcile' }}
        uses: ./.github/actions/supabase-link-run
        with:
          project_ref: ${{ env.SUPABASE_PROJECT_REF }}
          supabase_access_token: ${{ env.SUPABASE_ACCESS_TOKEN }}
          database_url: ${{ env.DATABASE_URL }}
          supabase_db_password: ${{ env.SUPABASE_DB_PASSWORD }}
          skip_link: true
          command: supabase functions deploy web-lead-reconcile --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy deal-factory
        if: ${{ inputs.function == 'all' || inputs.function == 'deal-factory' }}
        uses: ./.github/actions/supabase-link-run
        with:
          project_ref: ${{ env.SUPABASE_PROJECT_REF }}
          supabase_access_token: ${{ env.SUPABASE_ACCESS_TOKEN }}
          database_url: ${{ env.DATABASE_URL }}
          supabase_db_password: ${{ env.SUPABASE_DB_PASSWORD }}
          skip_link: true
          command: supabase functions deploy deal-factory --project-ref "$SUPABASE_PROJECT_REF"

      - name: Verify deployed function inventory
        uses: ./.github/actions/supabase-link-run
        with:
          project_ref: ${{ env.SUPABASE_PROJECT_REF }}
          supabase_access_token: ${{ env.SUPABASE_ACCESS_TOKEN }}
          database_url: ${{ env.DATABASE_URL }}
          supabase_db_password: ${{ env.SUPABASE_DB_PASSWORD }}
          skip_link: true
          command: supabase functions list --project-ref "$SUPABASE_PROJECT_REF"

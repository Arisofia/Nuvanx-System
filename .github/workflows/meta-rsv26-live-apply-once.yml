name: Meta RSV26 Live Apply Once

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: meta-rsv26-live-apply-once
  cancel-in-progress: false

jobs:
  apply-rsv26:
    if: >-
      github.event.pull_request.head.ref == 'ops/rsv26-live-apply-once-20260824' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 15
    env:
      META_CANONICAL_ACCESS_TOKEN: ${{ secrets.META_CANONICAL_ACCESS_TOKEN }}
      META_CANONICAL_APP_SECRET: ${{ secrets.META_CANONICAL_APP_SECRET }}
      META_ACCESS_AUDIT_REQUIRED_SOURCE: META_CANONICAL_ACCESS_TOKEN
      META_ACCESS_AUDIT_REQUIRE_CRITICAL: 'true'
      META_ACCESS_AUDIT_REQUIRE_ALL: 'false'
      META_ACCESS_AUDIT_REQUIRE_APP_MATCH: 'true'
      META_ACCESS_AUDIT_REQUIRE_CRITICAL_ASSETS: 'true'

    steps:
      - name: Checkout exact reviewed main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 6e44a9d49a8584c978db6eb3c6dcdfc6517eb513
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Safety regression tests
        run: npx vitest run supabase/functions/meta-rsv26-tools.test.mjs supabase/functions/meta-rsv26-safety-extra.test.mjs

      - name: Validate canonical token, app, permissions and assets
        run: node scripts/meta-access-audit.js

      - name: Validate canonical System User
        run: node scripts/meta-system-user-audit.js

      - name: Capture pre-apply drift
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node scripts/meta-audit-rsv26.js
          status=$?
          set -e
          echo "META_RSV26_PRE_AUDIT_EXIT=$status"
          test "$status" -eq 0 -o "$status" -eq 1

      - name: Dry-run full reconciliation
        run: node scripts/meta-apply-rsv26.js

      - name: Apply full canonical RSV26 reconciliation
        run: >-
          node scripts/meta-apply-rsv26.js
          --apply
          --apply-names
          --apply-attribution
          --apply-adset-settings
          --apply-creatives

      - name: Verify zero canonical drift after apply
        run: node scripts/meta-audit-rsv26.js

      - name: Verify creative contracts after apply
        run: node scripts/meta-creative-diff-rsv26.js

name: Meta RSV26 Clone Contract Audit Once

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: meta-rsv26-clone-contract-audit
  cancel-in-progress: false

jobs:
  audit-clone-contract:
    if: >-
      github.event.pull_request.head.ref == 'ops/rsv26-live-apply-once-20260824' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 6
    env:
      META_CANONICAL_ACCESS_TOKEN: ${{ secrets.META_CANONICAL_ACCESS_TOKEN }}
      META_CANONICAL_APP_SECRET: ${{ secrets.META_CANONICAL_APP_SECRET }}

    steps:
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22

      - name: Read exact live ad-set clone fields
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import { createHmac } from 'node:crypto';
          const token = process.env.META_CANONICAL_ACCESS_TOKEN;
          const secret = process.env.META_CANONICAL_APP_SECRET;
          if (!token || !secret) throw new Error('Canonical Meta credentials missing');
          const proof = createHmac('sha256', secret).update(token).digest('hex');
          const items = [
            ['skin_quality','120249780276620419','120249780276610419','2070344224367581'],
            ['pigmentation','120249784103200419','120249784103190419','2550302458739059'],
            ['texture','120249789017420419','120249789017430419','1981483249231784'],
            ['hydration_expression','120249789256740419','120249789256750419','3183323615191790'],
          ];
          const fields = 'id,name,campaign_id,status,effective_status,daily_budget,lifetime_budget,attribution_spec,optimization_goal,billing_event,bid_strategy,bid_amount,targeting,promoted_object,destination_type,is_dynamic_creative,start_time,end_time,configured_status,optimization_sub_event,recurring_budget_semantics';
          async function get(path, fieldsValue) {
            const params = new URLSearchParams({ fields: fieldsValue, access_token: token, appsecret_proof: proof });
            const response = await fetch(`https://graph.facebook.com/v22.0/${path}?${params}`);
            const json = await response.json();
            if (!response.ok || json?.error) {
              const e = json?.error ?? {};
              throw new Error(`GET ${path} failed: ${e.message ?? response.statusText} (code=${e.code ?? response.status}, sub=${e.error_subcode ?? 'n/a'})`);
            }
            return json;
          }
          for (const [key, adsetId, adId, sourceCreativeId] of items) {
            const adset = await get(adsetId, fields);
            const ad = await get(adId, 'id,name,status,effective_status,adset_id,creative{id,name}');
            console.log(`META_RSV26_CLONE_CONTRACT=${JSON.stringify({ key, source_creative_id: sourceCreativeId, adset, ad })}`);
          }
          const campaign = await get('120249780276630419', 'id,name,status,effective_status,objective,special_ad_categories,bid_strategy,daily_budget,lifetime_budget');
          console.log(`META_RSV26_CAMPAIGN_CONTRACT=${JSON.stringify(campaign)}`);
          NODE

name: Meta RSV26 Probe Cleanup Once

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: meta-rsv26-probe-cleanup-once
  cancel-in-progress: false

jobs:
  cleanup-probe:
    if: >-
      github.event.pull_request.head.ref == 'ops/rsv26-live-apply-once-20260824' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 6
    env:
      META_CANONICAL_ACCESS_TOKEN: ${{ secrets.META_CANONICAL_ACCESS_TOKEN }}
      META_CANONICAL_APP_SECRET: ${{ secrets.META_CANONICAL_APP_SECRET }}

    steps:
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22

      - name: Respect Meta mutation rate window
        run: sleep 40

      - name: Delete PAUSED probe ad
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import { createHmac } from 'node:crypto';
          const token = process.env.META_CANONICAL_ACCESS_TOKEN;
          const secret = process.env.META_CANONICAL_APP_SECRET;
          if (!token || !secret) throw new Error('Canonical Meta credentials missing');
          const proof = createHmac('sha256', secret).update(token).digest('hex');
          const params = new URLSearchParams({ access_token: token, appsecret_proof: proof });
          const response = await fetch(`https://graph.facebook.com/v22.0/120249823437100419?${params}`, { method: 'DELETE' });
          const json = await response.json();
          if (!response.ok || json?.error || json?.success !== true) {
            const e = json?.error ?? {};
            throw new Error(`Probe cleanup failed: ${e.message ?? response.statusText} (code=${e.code ?? response.status}, sub=${e.error_subcode ?? 'n/a'})`);
          }
          console.log('META_EXISTING_CREATIVE_PROBE_CLEANUP=PASS ad_id=120249823437100419');
          NODE

      - name: Respect Meta verification rate window
        run: sleep 40

      - name: Verify probe is not deliverable
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import { createHmac } from 'node:crypto';
          const token = process.env.META_CANONICAL_ACCESS_TOKEN;
          const secret = process.env.META_CANONICAL_APP_SECRET;
          const proof = createHmac('sha256', secret).update(token).digest('hex');
          const params = new URLSearchParams({
            fields: 'id,status,effective_status',
            access_token: token,
            appsecret_proof: proof,
          });
          const response = await fetch(`https://graph.facebook.com/v22.0/120249823437100419?${params}`);
          const json = await response.json();
          if (response.ok && !json?.error) {
            console.log(`META_EXISTING_CREATIVE_PROBE_VERIFY residual=true status=${json.status ?? 'unknown'} effective_status=${json.effective_status ?? 'unknown'}`);
            if (!['DELETED','ARCHIVED'].includes(String(json.status ?? '')) && !['DELETED','ARCHIVED'].includes(String(json.effective_status ?? ''))) {
              throw new Error(`Probe remains deliverable: ${json.status}/${json.effective_status}`);
            }
            process.exit(0);
          }
          const e = json?.error ?? {};
          if (Number(e.code) === 100 || Number(e.code) === 803) {
            console.log('META_EXISTING_CREATIVE_PROBE_VERIFY residual=false');
            process.exit(0);
          }
          throw new Error(`Probe verification failed unexpectedly: ${e.message ?? response.statusText} (code=${e.code ?? response.status}, sub=${e.error_subcode ?? 'n/a'})`);
          NODE

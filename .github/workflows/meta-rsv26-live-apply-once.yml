name: Meta RSV26 Non-Creative Apply Once

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: meta-rsv26-noncreative-apply-once
  cancel-in-progress: false

jobs:
  apply-rsv26-noncreative:
    if: >-
      github.event.pull_request.head.ref == 'ops/rsv26-live-apply-once-20260824' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 12
    env:
      META_CANONICAL_ACCESS_TOKEN: ${{ secrets.META_CANONICAL_ACCESS_TOKEN }}
      META_CANONICAL_APP_SECRET: ${{ secrets.META_CANONICAL_APP_SECRET }}
      META_ACCESS_AUDIT_REQUIRED_SOURCE: META_CANONICAL_ACCESS_TOKEN
      META_ACCESS_AUDIT_REQUIRE_CRITICAL: 'true'
      META_ACCESS_AUDIT_REQUIRE_ALL: 'false'
      META_ACCESS_AUDIT_REQUIRE_APP_MATCH: 'true'
      META_ACCESS_AUDIT_REQUIRE_CRITICAL_ASSETS: 'true'

    steps:
      - name: Checkout exact reviewed main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 6e44a9d49a8584c978db6eb3c6dcdfc6517eb513
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Safety regression tests
        run: npx vitest run supabase/functions/meta-rsv26-tools.test.mjs supabase/functions/meta-rsv26-safety-extra.test.mjs

      - name: Validate canonical access
        run: node scripts/meta-access-audit.js

      - name: Validate canonical System User
        run: node scripts/meta-system-user-audit.js

      - name: Apply names, attribution and ad-set settings only
        run: >-
          node scripts/meta-apply-rsv26.js
          --apply
          --apply-names
          --apply-attribution
          --apply-adset-settings

      - name: Capture post-apply audit
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node scripts/meta-audit-rsv26.js > /tmp/rsv26-post.json
          status=$?
          set -e
          cat /tmp/rsv26-post.json
          echo "META_RSV26_NONCREATIVE_POST_AUDIT_EXIT=$status"
          test "$status" -eq 1

      - name: Assert only four creative drifts remain and campaign is active
        run: |
          node --input-type=module - <<'NODE'
          import { readFile } from 'node:fs/promises';
          const audit = JSON.parse(await readFile('/tmp/rsv26-post.json', 'utf8'));
          if (audit?.campaign?.status !== 'ACTIVE' || audit?.campaign?.effective_status !== 'ACTIVE') {
            throw new Error(`Campaign not ACTIVE after partial reconciliation: ${JSON.stringify(audit?.campaign)}`);
          }
          const drift = Array.isArray(audit?.drift) ? audit.drift : [];
          if (drift.length !== 4 || drift.some((item) => item?.field !== 'ad.creative')) {
            throw new Error(`Expected exactly 4 ad.creative drifts after non-creative apply, got ${JSON.stringify(drift)}`);
          }
          console.log('META_RSV26_NONCREATIVE_ASSERT=PASS campaign_active=true remaining_drift=4 creative_only=true');
          NODE

      - name: Audit remaining creative contracts read-only
        run: node scripts/meta-creative-diff-rsv26.js

name: Meta RSV26 State Audit Once

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: meta-rsv26-state-audit-once
  cancel-in-progress: false

jobs:
  audit-state:
    if: >-
      github.event.pull_request.head.ref == 'ops/rsv26-live-apply-once-20260824' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 8
    env:
      META_CANONICAL_ACCESS_TOKEN: ${{ secrets.META_CANONICAL_ACCESS_TOKEN }}
      META_CANONICAL_APP_SECRET: ${{ secrets.META_CANONICAL_APP_SECRET }}

    steps:
      - name: Checkout exact reviewed main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 6e44a9d49a8584c978db6eb3c6dcdfc6517eb513
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Audit live RSV26 state read-only
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node scripts/meta-audit-rsv26.js > /tmp/rsv26-state.json
          status=$?
          set -e
          cat /tmp/rsv26-state.json
          echo "META_RSV26_STATE_AUDIT_EXIT=$status"
          test "$status" -eq 0 -o "$status" -eq 1

      - name: Emit campaign safety state
        run: |
          node --input-type=module - <<'NODE'
          import { readFile } from 'node:fs/promises';
          const audit = JSON.parse(await readFile('/tmp/rsv26-state.json', 'utf8'));
          console.log(`META_RSV26_CAMPAIGN_STATE status=${audit?.campaign?.status ?? 'unknown'} effective_status=${audit?.campaign?.effective_status ?? 'unknown'} drift_count=${audit?.drift_count ?? 'unknown'}`);
          NODE

name: Meta lead conversion contract patch once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/meta-lead-conversion-contract-20260823' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Require exact base ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 422cff1e5139890b9c0bf27cefb2c2dc1a17625e HEAD
      - name: Apply lead conversion contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ops/fix-meta-lead-conversion-contract.py
          git diff --check
          grep -Fq 'export function resolveMetaLeadConversions' supabase/functions/api/index.ts
          grep -Fq 'Math.max(rawConversions, leadActions, messagingConversations)' supabase/functions/api/index.ts
          grep -Fq "conversions: Math.round(dbRows.reduce((sum: number, row: any) => sum + resolveMetaLeadConversions(row), 0))" supabase/functions/api/index.ts
          grep -Fq "const conversions = resolveMetaLeadConversions(ins);" supabase/functions/api/index.ts
          echo 'META_LEAD_CONVERSION_CONTRACT=PASS'
      - name: Commit patched API only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Nuvanx Bot'
          git config user.email 'bot@nuvanx.com'
          git add supabase/functions/api/index.ts
          git diff --cached --quiet && { echo 'No API patch produced' >&2; exit 1; }
          git commit -m 'fix(meta): make lead actions canonical across live and fallback insights'
          git push origin HEAD:fix/meta-lead-conversion-contract-20260823

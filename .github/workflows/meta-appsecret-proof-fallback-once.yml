name: Meta Appsecret Proof Fallback Once

on:
  push:
    branches:
      - fix/meta-appsecret-proof-fallback-20260825
    paths:
      - '.github/workflows/meta-appsecret-proof-fallback-once.yml'

permissions:
  contents: write

concurrency:
  group: meta-appsecret-proof-fallback-once
  cancel-in-progress: false

jobs:
  patch-validate-commit:
    if: github.actor == 'Arisofia'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Bind exact branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'fix/meta-appsecret-proof-fallback-20260825'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x

      - name: Apply proof fallback patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('supabase/functions/api/index.ts')
          text = path.read_text()
          before = "  return [...new Set(values)].map((value) => value || null).concat(values.length === 0 ? [null] : []);"
          after = "  return [...new Set(values)].map((value) => value || null).concat([null]);"
          if text.count(before) != 1:
              raise SystemExit(f'expected one metaGraphSecretCandidates return, found {text.count(before)}')
          path.write_text(text.replace(before, after, 1))

          test_path = Path('supabase/functions/api/meta-appsecret-proof-fallback.test.mjs')
          test_path.write_text('''import { describe, expect, it } from "vitest";\nimport { readFileSync } from "node:fs";\nimport { fileURLToPath } from "node:url";\n\nconst source = readFileSync(fileURLToPath(new URL("./index.ts", import.meta.url)), "utf8");\n\ndescribe("Meta appsecret proof routing", () => {\n  it("falls back to a bare access token only after configured app secrets are exhausted", () => {\n    expect(source).toContain("return [...new Set(values)].map((value) => value || null).concat([null]);");\n    expect(source).toContain("const canRetrySecret = index + 1 < candidates.length && isInvalidAppsecretProof(data);");\n  });\n\n  it("keeps explicit service-specific overrides strict", () => {\n    expect(source).toContain("if (appSecretOverride !== undefined) return [appSecretOverride || null];");\n  });\n});\n''')
          PY
          git diff --check
          grep -Fq 'concat([null])' supabase/functions/api/index.ts

      - name: Validate full runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --include=dev --ignore-scripts --legacy-peer-deps
          npm test
          deno check --config=supabase/functions/deno.json supabase/functions/api/index.ts

      - name: Remove one-shot workflow and commit validated result
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/meta-appsecret-proof-fallback-once.yml
          git diff --check
          git config user.name 'Nuvanx Engineering'
          git config user.email 'admin@nuvanx.com'
          git add supabase/functions/api/index.ts supabase/functions/api/meta-appsecret-proof-fallback.test.mjs
          git commit -m 'fix(meta): avoid cross-app appsecret proof failures'
          git push origin HEAD:fix/meta-appsecret-proof-fallback-20260825
